    /* ====================================================
       98.css supplies all chrome: .window bevels,
       .title-bar gradient + .title-bar-controls buttons,
       .window-body, .field-row, .status-bar, buttons and
       the Pixelated MS Sans Serif webfont.

       ==================================================== */

    * {

    }


    html,
    body {
        width: 100%;
        height: 100%;

        margin: 0;
        padding: 0;

        background: #008080;

        overflow: hidden;

        user-select: none;
        -webkit-user-select: none;
    }


    #popup-overlay {

        position: fixed;

        inset: 0;

        display: none;

        z-index: 100000;

        overflow: hidden;
    }


    #popup-overlay.visible {
        display: block;
    }


    #popup {

        position: fixed;

        left: 50%;
        top: 50%;

        transform:
            translate(-50%, -50%);

        width: 500px;

        max-width:
            calc(100vw - 30px);

        max-height:
            calc(100vh - 30px);

        min-width: 0;

        overflow: hidden;
    }


    #popup-titlebar {

        cursor: move;

        touch-action: none;

        flex-shrink: 0;
    }


    #popup-title {

        flex: 1;

        min-width: 0;

        white-space: nowrap;

        overflow: hidden;

        text-overflow: ellipsis;
    }


    #popup-content {

        min-height: 90px;

        display: flex;

        align-items: center;

        padding: 10px 6px;

        min-width: 0;
    }


    /* 32px exclamation icon, drawn in the 98 dialog style */

    #popup-icon {

        width: 32px;
        min-width: 32px;

        height: 32px;

        margin-right: 18px;

        justify-content: center;

        flex: 1;

        min-width: 0;

        line-height: 1.35;

        overflow-wrap: break-word;

    /* .field-row handles the 6px button gaps */

        justify-content: center;

        padding: 0 6px 6px;

        flex-wrap: wrap;
    }


    #popup-status {
        margin-top: 6px;
    }


    @media (max-width: 520px) {

        #popup {

            width:
                calc(100vw - 30px);

<script>

"use strict";


/* ============================================================
   CONFIGURATION
   ============================================================ */

const POPUP_TEST_COUNT = 3;

const TEST_PAGE =
    "test.html";

const TARGET_PAGE =
    "popup.html";

const DISCORD_PAGE =
    "lol.html";

const TARGET_CHECK_INTERVAL =
    250;

const AUTOPLAY_CHECK_INTERVAL =
    250;


const QUESTION_WIDTH = 928;

const QUESTION_HEIGHT = 929;


const SCREEN_MARGIN = 20;


/* ============================================================
   ELEMENTS
   ============================================================ */

const popupOverlay =
    document.getElementById(
        "popup-overlay"
    );

const popupMessage =
    document.getElementById(
        "popup-message"
    );

const popupButtons =
    document.getElementById(
        "popup-buttons"
    );

const popupClose =
    document.getElementById(
        "popup-close"
    );

const popupIcon =
    document.getElementById(
        "popup-icon"
    );

const autoplayAudio =
    document.getElementById(
        "autoplay-test-audio"
    );

const popupTitlebar =
    document.getElementById(
        "popup-titlebar"
    );


/* ============================================================
   STATE
   ============================================================ */

const popupResults =
    new Set();


let popupTestStarted =
    false;


let popupAllowed =
    false;


let autoplayTestComplete =
    false;


let autoplayAllowed =
    false;


let permissionMessageVisible =
    false;


let popupResolver =
    null;


let openingTarget =
    false;


let targetPopup =
    null;


let targetPopupFinished =
    false;


let targetPopupMonitor =
    null;


let permissionStartupComplete =
    false;


let initialPopupOpenAttempted =
    false;


/* ============================================================
   PERMISSION POPUP DRAGGING
   ============================================================ */

let popupDragging =
    false;


let popupDragPointerId =
    null;


let popupDragStartX =
    0;


let popupDragStartY =
    0;


let popupStartLeft =
    0;


let popupStartTop =
    0;


function resetPermissionPopupPosition() {

    popup.style.left =
        "50%";

    popup.style.top =
        "50%";

    popup.style.transform =
        "translate(-50%, -50%)";

}


popupTitlebar.addEventListener(
    "pointerdown",
    event => {

        if (
            event.target.closest(
                "#popup-close"
            )
        ) {

            return;

        }


        if (
            !popupOverlay.classList.contains(
                "visible"
            )
        ) {

            return;

        }


        const rect =
            popup.getBoundingClientRect();


        popupStartLeft =
            rect.left;


        popupStartTop =
            rect.top;


        popupDragStartX =
            event.clientX;


        popupDragStartY =
            event.clientY;


        popup.style.transform =
            "none";


        popup.style.left =
            `${popupStartLeft}px`;


        popup.style.top =
            `${popupStartTop}px`;


        popupDragging =
            true;


        popupDragPointerId =
            event.pointerId;


        try {

            popupTitlebar.setPointerCapture(
                event.pointerId
            );

        } catch (_) {}


        event.preventDefault();

    }
);


popupTitlebar.addEventListener(
    "pointermove",
    event => {

        if (
            !popupDragging ||
            event.pointerId !==
            popupDragPointerId
        ) {

            return;

        }


        const deltaX =
            event.clientX -
            popupDragStartX;


        const deltaY =
            event.clientY -
            popupDragStartY;


        const rect =
            popup.getBoundingClientRect();


        const minVisibleX =
            Math.min(
                30,
                rect.width
            );


        const minVisibleY =
            Math.min(
                30,
                rect.height
            );


        const minX =
            -rect.width +
            minVisibleX;


        const maxX =
            window.innerWidth -
            minVisibleX;


        const minY =
            -rect.height +
            minVisibleY;


        const maxY =
            window.innerHeight -
            minVisibleY;


        let newLeft =
            popupStartLeft +
            deltaX;


        let newTop =
            popupStartTop +
            deltaY;


        newLeft =
            Math.min(
                Math.max(
                    newLeft,
                    minX
                ),
                maxX
            );


        newTop =
            Math.min(
                Math.max(
                    newTop,
                    minY
                ),
                maxY
            );


        popup.style.left =
            `${newLeft}px`;


        popup.style.top =
            `${newTop}px`;

    }
);


function stopPopupDragging(event) {

    if (
        !popupDragging ||
        event.pointerId !==
        popupDragPointerId
    ) {

        return;

    }


    popupDragging =
        false;


    popupDragPointerId =
        null;


    try {

        popupTitlebar.releasePointerCapture(
            event.pointerId
        );

    } catch (_) {}

}


popupTitlebar.addEventListener(
    "pointerup",
    stopPopupDragging
);


popupTitlebar.addEventListener(
    "pointercancel",
    stopPopupDragging
);


/* ============================================================
   MESSAGE BOX
   ============================================================ */

function showPopup(
    message,
    buttons = ["OK"],
    icon = "!"
) {

    popupMessage.textContent =
        message;


    popupIcon.textContent =
        icon;


    popupButtons.innerHTML =
        "";


    popupOverlay.classList.add(
        "visible"
    );


    return new Promise(
        resolve => {

            popupResolver =
                resolve;


            for (
                const text of buttons
            ) {

                const button =
                    document.createElement(
                        "button"
                    );


                button.type =
                    "button";


                button.textContent =
                    text;


                button.addEventListener(
                    "click",
                    () => {

                        closePopup(
                            text
                        );

                    }
                );


                popupButtons.appendChild(
                    button
                );

            }


            const firstButton =
                popupButtons.querySelector(
                    "button"
                );


            if (firstButton) {

                firstButton.focus();

            }

        }
    );

}


function closePopup(
    result = "Close"
) {

    popupOverlay.classList.remove(
        "visible"
    );


    if (popupResolver) {

        const resolve =
            popupResolver;

        popupResolver =
            null;

        resolve(result);

    }

}


popupClose.addEventListener(
    "click",
    () => {

        closePopup(
            "Close"
        );

    }
);


/* ============================================================
   AUTOPLAY TEST
   ============================================================ */

async function testAutoplayPermission() {

    if (
        autoplayTestComplete
    ) {

        return autoplayAllowed;

    }


    autoplayTestComplete =
        true;


    try {

        autoplayAudio.pause();


        try {

            autoplayAudio.currentTime =
                0;

        } catch (_) {}


        /*
         * This is intentionally attempted WITHOUT
         * any user-interaction unlock handler.
         *
         * A click or keypress must NOT make this
         * test pass.
         */
        const playPromise =
            autoplayAudio.play();


        if (
            playPromise &&
            typeof playPromise.then ===
            "function"
        ) {

            await playPromise;

        }


        await new Promise(
            resolve => {

                setTimeout(
                    resolve,
                    100
                );

            }
        );


        autoplayAllowed =
            !autoplayAudio.paused &&
            !autoplayAudio.ended;


        if (
            !autoplayAllowed
        ) {

            autoplayAudio.pause();


            try {

                autoplayAudio.currentTime =
                    0;

            } catch (_) {}

        }

    } catch (_) {

        autoplayAllowed =
            false;


        try {

            autoplayAudio.pause();

            autoplayAudio.currentTime =
                0;

        } catch (_) {}

    }


    updatePermissionMessage();

    maybeOpenQuestionPopup();


    return autoplayAllowed;

}


/* ============================================================
   PERIODIC AUTOPLAY TEST
   ============================================================ */

setInterval(
    () => {

        if (
            autoplayAllowed
        ) {

            return;

        }


        autoplayTestComplete =
            false;


        testAutoplayPermission();

    },
    AUTOPLAY_CHECK_INTERVAL
);


/* ============================================================
   POPUP PERMISSION TEST
   ============================================================ */

function testPopupPermission() {

    if (
        popupTestStarted
    ) {

        return popupAllowed;

    }


    popupTestStarted =
        true;


    popupResults.clear();


    for (
        let i = 0;
        i < POPUP_TEST_COUNT;
        i++
    ) {

        try {

            const testPopup =
                window.open(
                    `${TEST_PAGE}?id=${i}`,
                    `youare_popup_test_${i}`,
                    [
                        "width=1",
                        "height=1",
                        "left=-10000",
                        "top=-10000"
                    ].join(",")
                );


            void testPopup;

        } catch (_) {}

    }


    setTimeout(
        () => {

            updatePermissionMessage();

            maybeOpenQuestionPopup();


            if (
                !popupAllowed &&
                !permissionMessageVisible
            ) {

                showPermissionMessage();

            }

        },
        1500
    );


    return popupAllowed;

}


/* ============================================================
   POPUP TEST RESULT
   ============================================================ */

window.addEventListener(
    "message",
    event => {

        if (
            event.origin !==
            window.location.origin
        ) {

            return;

        }


        const data =
            event.data;


        if (
            !data ||
            data.type !==
            "YOUARE_POPUP_TEST_SUCCESS"
        ) {

            return;

        }


        const id =
            String(data.id);


        if (
            ![
                "0",
                "1",
                "2"
            ].includes(id)
        ) {

            return;

        }


        popupResults.add(
            id
        );


        if (
            popupResults.size >=
            POPUP_TEST_COUNT
        ) {

            popupAllowed =
                true;

        }


        updatePermissionMessage();

        maybeOpenQuestionPopup();

    }
);


/* ============================================================
   PERMISSION MESSAGE
   ============================================================ */

function getPermissionMessage() {

    const POPUP_REFRESH_HINT =
        " If you already allowed pop-ups but nothing has changed, " +
        "try refreshing the page.";


    const BOTH_REFRESH_HINT =
        " If you already changed the settings but nothing has changed, " +
        "try refreshing the page.";


    const AUTOPLAY_HINT =
        " If you don't see an option to turn " +
        "autoplay on, just click OK.";


    if (
        popupAllowed &&
        autoplayAllowed
    ) {

        return null;

    }


    if (
        !popupAllowed &&
        autoplayAllowed
    ) {

        return (
            "This recreation requires pop-up windows " +
            "to be enabled in your browser. Please allow " +
            "pop-ups for this site." +
            POPUP_REFRESH_HINT
        );

    }


    if (
        popupAllowed &&
        !autoplayAllowed
    ) {

        return (
            "This recreation requires audio autoplay " +
            "to be enabled in your browser. Please allow " +
            "autoplay for this site." +
            AUTOPLAY_HINT
        );

    }


    return (
        "This recreation requires pop-up windows and " +
        "audio autoplay to be enabled in your browser. " +
        "Please allow both for this site." +
        AUTOPLAY_HINT +
        BOTH_REFRESH_HINT
    );

}


function updatePermissionMessage() {

    const message =
        getPermissionMessage();


    if (
        !message
    ) {

        if (
            permissionMessageVisible &&
            popupResolver
        ) {

            closePopup(
                "Permissions complete"
            );

        }


        permissionMessageVisible =
            false;


        maybeOpenQuestionPopup();

        return;

    }


    if (
        !permissionMessageVisible
    ) {

        return;

    }


    /*
     * Only reset the position when the actual
     * permission message changes.
     */
    if (
        popupMessage.textContent !==
        message
    ) {

        popupMessage.textContent =
            message;

        resetPermissionPopupPosition();

    }

}


async function showPermissionMessage() {

    const message =
        getPermissionMessage();


    if (
        !message
    ) {

        maybeOpenQuestionPopup();

        return;

    }


    if (
        permissionMessageVisible
    ) {

        return;

    }


    permissionMessageVisible =
        true;


    await showPopup(
        message,
        ["OK"],
        "!"
    );


    permissionMessageVisible =
        false;


    /*
     * Do NOT try to unlock autoplay here.
     *
     * Clicking OK must not count as autoplay.
     */


    if (
        !popupAllowed
    ) {

        popupTestStarted =
            false;

        popupResults.clear();

        testPopupPermission();

    }


    /*
     * Re-test autoplay normally, without using
     * the user's click as a gesture.
     */
    if (
        !autoplayAllowed
    ) {

        autoplayTestComplete =
            false;

        testAutoplayPermission();

    }


    maybeOpenQuestionPopup();

}


/* ============================================================
   DISCORD RESIZE REQUEST
   ============================================================ */

window.addEventListener(
    "message",
    event => {

        if (
            event.origin !==
            window.location.origin
        ) {

            return;

        }


        const data =
            event.data;


        if (
            !data ||
            data.type !==
            "YOUARE_REQUEST_DISCORD_SIZE"
        ) {

            return;

        }


        if (
            !targetPopup ||
            event.source !== targetPopup
        ) {

            return;

        }


        const width =
            Number(data.width);


        const height =
            Number(data.height);


        if (
            !Number.isFinite(width) ||
            !Number.isFinite(height) ||
            width < 1 ||
            height < 1
        ) {

            return;

        }


        const safeWidth =
            Math.round(
                Math.min(
                    width,
                    Math.max(
                        1,
                        screen.availWidth
                    )
                )
            );


        const safeHeight =
            Math.round(
                Math.min(
                    height,
                    Math.max(
                        1,
                        screen.availHeight
                    )
                )
            );


        try {

            targetPopup.resizeTo(
                safeWidth,
                safeHeight
            );

            const availLeft =
                Number(screen.availLeft) || 0;

            const availTop =
                Number(screen.availTop) || 0;

            const availWidth =
                Number(screen.availWidth) ||
                Number(screen.width);

            const availHeight =
                Number(screen.availHeight) ||
                Number(screen.height);

            targetPopup.moveTo(
                Math.max(
                    availLeft,
                    Math.round(
                        availLeft +
                        (availWidth - safeWidth) / 2
                    )
                ),
                Math.max(
                    availTop,
                    Math.round(
                        availTop +
                        (availHeight - safeHeight) / 2
                    )
                )
            );

        } catch (_) {}


        try {

            targetPopup.focus();

        } catch (_) {}

    }
);


/* ============================================================
   DYNAMIC QUESTION POPUP SIZE
   ============================================================ */

function getQuestionPopupDimensions() {

    const BROWSER_CHROME_HEIGHT = 90;

    const MAX_SCREEN_SHARE = 0.6;


    const availableWidth =
        Math.max(
            1,
            Number(screen.availWidth) -
            SCREEN_MARGIN * 2
        );


    const availableHeight =
        Math.max(
            1,
            Number(screen.availHeight) -
            SCREEN_MARGIN * 2
        );


    const maxContentWidth =
        Math.min(
            availableWidth,
            Number(screen.availWidth) *
            MAX_SCREEN_SHARE
        );


    const maxContentHeight =
        Math.min(
            availableHeight -
            BROWSER_CHROME_HEIGHT,
            Number(screen.availHeight) *
            MAX_SCREEN_SHARE
        );


    const PREFERRED_WIDTH = 520;

    const PREFERRED_HEIGHT = 521;


    let scale =
        Math.min(
            maxContentWidth / QUESTION_WIDTH,
            maxContentHeight / QUESTION_HEIGHT,
            PREFERRED_WIDTH / QUESTION_WIDTH,
            PREFERRED_HEIGHT / QUESTION_HEIGHT
        );


    if (
        !Number.isFinite(scale) ||
        scale <= 0
    ) {

        scale = 0.5;

    }


    let width =
        QUESTION_WIDTH * scale;


    let height =
        QUESTION_HEIGHT * scale +
        BROWSER_CHROME_HEIGHT;


    width =
        Math.min(
            width,
            availableWidth
        );


    height =
        Math.min(
            height,
            availableHeight
        );


    width =
        Math.max(
            200,
            Math.floor(width)
        );


    height =
        Math.max(
            200,
            Math.floor(height)
        );


    return {
        width,
        height
    };

}


/* ============================================================
   POPUP FEATURES
   ============================================================ */

function getPopupFeatures() {

    const dimensions =
        getQuestionPopupDimensions();


    const left =
        Math.max(
            0,
            Math.floor(
                (
                    screen.availWidth -
                    dimensions.width
                ) / 2
            )
        );


    const top =
        Math.max(
            0,
            Math.floor(
                (
                    screen.availHeight -
                    dimensions.height
                ) / 2
            )
        );


    return [

        `width=${dimensions.width}`,

        `height=${dimensions.height}`,

        `left=${left}`,

        `top=${top}`,

        "resizable=yes",

        "scrollbars=no",

        "toolbar=no",

        "menubar=no",

        "location=no",

        "status=no"

    ].join(",");

}


/* ============================================================
   REAL POPUP CLOSED HANDLER
   ============================================================ */

function handleTargetPopupClosed() {

    if (
        targetPopupFinished
    ) {

        return;

    }


    targetPopupFinished =
        true;


    if (
        targetPopupMonitor
    ) {

        clearInterval(
            targetPopupMonitor
        );

        targetPopupMonitor =
            null;

    }


    targetPopup =
        null;


    const existingScript =
        document.querySelector(
            'script[data-youare-app-script="true"]'
        );


    if (
        existingScript
    ) {

        return;

    }


    const appScript =
        document.createElement(
            "script"
        );


    appScript.src =
        "/scripts/app.js";


    appScript.async =
        false;


    appScript.dataset.youareAppScript =
        "true";


    document.head.appendChild(
        appScript
    );

}


/* ============================================================
   MONITOR REAL POPUP
   ============================================================ */

function monitorTargetPopup(
    popup
) {

    if (
        targetPopupMonitor
    ) {

        clearInterval(
            targetPopupMonitor
        );

    }


    targetPopupMonitor =
        setInterval(
            () => {

                try {

                    if (
                        popup.closed
                    ) {

                        handleTargetPopupClosed();

                    }

                } catch (_) {}

            },
            TARGET_CHECK_INTERVAL
        );

}


/* ============================================================
   OPEN QUESTION POPUP
   ============================================================ */

function openQuestionPopup() {

    if (
        openingTarget ||
        targetPopup
    ) {

        return;

    }


    if (
        !popupAllowed ||
        !autoplayAllowed
    ) {

        return;

    }


    openingTarget =
        true;


    targetPopupFinished =
        false;


    const features =
        getPopupFeatures();


    let popup =
        null;


    try {

        popup =
            window.open(
                TARGET_PAGE,
                "YouAreAnIdiotQuestion",
                features
            );

    } catch (_) {

        popup =
            null;

    }


    if (
        !popup
    ) {

        openingTarget =
            false;


        popupAllowed =
            false;


        popupTestStarted =
            false;


        popupResults.clear();


        showPermissionMessage();

        return;

    }


    targetPopup =
        popup;


    openingTarget =
        false;


    monitorTargetPopup(
        popup
    );


    try {

        popup.focus();

    } catch (_) {}

}


/* ============================================================
   OPEN ONLY AFTER BOTH CHECKS
   ============================================================ */

function maybeOpenQuestionPopup() {

    if (
        initialPopupOpenAttempted
    ) {

        return;

    }


    if (
        !permissionStartupComplete
    ) {

        return;

    }


    if (
        !popupAllowed ||
        !autoplayAllowed
    ) {

        return;

    }


    if (
        targetPopup ||
        openingTarget
    ) {

        return;

    }


    initialPopupOpenAttempted =
        true;


    if (
        permissionMessageVisible
    ) {

        closePopup(
            "Permissions complete"
        );

        permissionMessageVisible =
            false;

    }


    openQuestionPopup();

}


/* ============================================================
   STARTUP
   ============================================================ */

window.addEventListener(
    "load",
    async () => {

        testPopupPermission();


        await testAutoplayPermission();


        permissionStartupComplete =
            true;


        maybeOpenQuestionPopup();


        if (
            !popupAllowed ||
            !autoplayAllowed
        ) {

            await showPermissionMessage();

        }

    },
    {
        once: true
    }
);


/* ============================================================
   RETEST ON FOCUS
   ============================================================ */

window.addEventListener(
    "focus",
    () => {

        if (
            !targetPopup &&
            !permissionMessageVisible
        ) {

            if (
                !popupAllowed
            ) {

                popupTestStarted =
                    false;

                popupResults.clear();

                testPopupPermission();

            }


            if (
                !autoplayAllowed
            ) {

                autoplayTestComplete =
                    false;

                testAutoplayPermission();

            }

        }

    }
);


/* ============================================================
   ESCAPE
   ============================================================ */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape"
        ) {

            closePopup(
                "Close"
            );

        }

    }
);


/* ============================================================
   RIGHT CLICK
   ============================================================ */

document.addEventListener(
    "contextmenu",
    event => {

        event.preventDefault();

    }
);

</script>
