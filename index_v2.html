<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Are you an idiot?</title>

    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {
            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;
        }


        body {
            /*
             * Startup page is intentionally just
             * the classic Windows 95 teal background.
             */
            background: #008080;

            overflow: hidden;

            font-family:
                "MS Sans Serif",
                "Microsoft Sans Serif",
                Tahoma,
                Arial,
                sans-serif;

            font-size: 11px;

            user-select: none;
            -webkit-user-select: none;
        }


        /* ============================================================
           WINDOWS 95 MESSAGE BOX
           ============================================================ */

        #popup-overlay {

            position: fixed;

            inset: 0;

            display: none;

            z-index: 100000;

            overflow: hidden;
        }


        #popup-overlay.visible {
            display: block;
        }


        #popup {

            position: fixed;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%);

            /*
             * Normal desktop size.
             */
            width: 500px;

            /*
             * Dynamic viewport limit.
             */
            max-width:
                calc(100vw - 30px);

            max-height:
                calc(100vh - 30px);

            /*
             * IMPORTANT:
             *
             * Do not use min-width: 390px.
             * That breaks on narrow phones.
             */
            min-width: 0;

            background: #c0c0c0;

            border: 2px solid;

            border-color:
                #ffffff
                #000000
                #000000
                #ffffff;

            box-shadow:
                inset 1px 1px 0 #dfdfdf,
                inset -1px -1px 0 #808080;

            font-family:
                "MS Sans Serif",
                "Microsoft Sans Serif",
                Tahoma,
                Arial,
                sans-serif;

            overflow: hidden;
        }


        #popup-titlebar {

            height: 22px;

            display: flex;

            align-items: center;

            padding-left: 4px;
            padding-right: 2px;

            background: #000080;

            color: #ffffff;

            font-size: 13px;

            font-weight: bold;

            line-height: 18px;

            flex-shrink: 0;
        }


        #popup-title {

            flex: 1;

            min-width: 0;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }


        #popup-close {

            width: 19px;
            min-width: 19px;

            height: 18px;

            padding: 0;

            margin-left: 2px;

            background: #c0c0c0;

            border: 2px solid;

            border-color:
                #ffffff
                #000000
                #000000
                #ffffff;

            box-shadow:
                inset 1px 1px 0 #dfdfdf,
                inset -1px -1px 0 #808080;

            font-family:
                Arial,
                sans-serif;

            font-size: 11px;

            font-weight: bold;

            line-height: 13px;

            cursor: default;

            appearance: none;
            -webkit-appearance: none;

            flex-shrink: 0;
        }


        #popup-close:active {

            border-color:
                #000000
                #ffffff
                #ffffff
                #000000;

            box-shadow:
                inset 1px 1px 0 #808080,
                inset -1px -1px 0 #dfdfdf;
        }


        #popup-content {

            min-height: 90px;

            display: flex;

            align-items: center;

            padding: 18px;

            min-width: 0;
        }


        #popup-icon {

            width: 32px;
            min-width: 32px;

            height: 32px;

            margin-right: 18px;

            display: flex;

            align-items: center;
            justify-content: center;

            background: #c0c0c0;

            color: #000000;

            font-family:
                Arial,
                sans-serif;

            font-size: 26px;

            font-weight: bold;

            line-height: 32px;

            text-align: center;

            flex-shrink: 0;
        }


        #popup-message {

            flex: 1;

            min-width: 0;

            font-size: 13px;

            color: #000000;

            line-height: 1.35;

            overflow-wrap: break-word;
        }


        #popup-buttons {

            display: flex;

            justify-content: center;

            gap: 8px;

            padding:
                0
                12px
                14px;

            flex-wrap: wrap;
        }


        #popup-buttons button {

            min-width: 75px;

            height: 27px;

            padding:
                2px
                12px;

            background: #c0c0c0;

            border: 2px solid;

            border-color:
                #ffffff
                #000000
                #000000
                #ffffff;

            box-shadow:
                inset 1px 1px 0 #dfdfdf,
                inset -1px -1px 0 #808080;

            font-family:
                "MS Sans Serif",
                "Microsoft Sans Serif",
                Tahoma,
                Arial,
                sans-serif;

            font-size: 12px;

            color: #000000;

            cursor: default;

            appearance: none;
            -webkit-appearance: none;
        }


        #popup-buttons button:hover {
            background: #c0c0c0;
        }


        #popup-buttons button:active {

            border-color:
                #000000
                #ffffff
                #ffffff
                #000000;

            box-shadow:
                inset 1px 1px 0 #808080,
                inset -1px -1px 0 #dfdfdf;
        }


        #popup-buttons button:focus {

            outline:
                1px dotted #000000;

            outline-offset: -5px;
        }


        /* ============================================================
           SMALL SCREEN MESSAGE BOX
           ============================================================ */

        @media (max-width: 520px) {

            #popup {

                width:
                    calc(100vw - 30px);

                max-width:
                    calc(100vw - 30px);
            }


            #popup-content {
                padding: 14px;
            }


            #popup-icon {
                margin-right: 12px;
            }


            #popup-message {
                font-size: 12px;
            }


            #popup-buttons {

                gap: 6px;

                padding:
                    0
                    10px
                    12px;
            }


            #popup-buttons button {
                min-width: 70px;
            }

        }


        /* ============================================================
           VERY SMALL SCREEN
           ============================================================ */

        @media (max-width: 360px) {

            #popup {

                width:
                    calc(100vw - 16px);

                max-width:
                    calc(100vw - 16px);
            }


            #popup-content {
                padding: 10px;
            }


            #popup-icon {

                width: 28px;
                min-width: 28px;

                height: 28px;

                margin-right: 8px;

                font-size: 22px;

                line-height: 28px;
            }


            #popup-message {
                font-size: 11px;
            }


            #popup-buttons {

                padding:
                    0
                    8px
                    10px;
            }

        }

    </style>

</head>


<body>

    <!--
        Intentionally empty.

        There is NO "Are You An Idiot?" text here.
        The normal startup page is only the teal background.
    -->


    <div id="popup-overlay">

        <div id="popup">

            <div id="popup-titlebar">

                <span id="popup-title">
                    YouAreAnIdiot
                </span>

                <button
                    id="popup-close"
                    type="button"
                >×</button>

            </div>


            <div id="popup-content">

                <div id="popup-icon">
                    !
                </div>


                <div id="popup-message"></div>

            </div>


            <div id="popup-buttons"></div>

        </div>

    </div>


    <audio
        id="autoplay-test-audio"
        preload="auto"
        loop
    >

        <source
            src="/media/test.mp3"
            type="audio/mpeg"
        >

    </audio>


<script>

"use strict";


/* ============================================================
   CONFIGURATION
   ============================================================ */

const POPUP_TEST_COUNT = 3;

const TEST_PAGE =
    "test.html";

const TARGET_PAGE =
    "popup.html";

const DISCORD_PAGE =
    "discord.html";

const TARGET_CHECK_INTERVAL =
    250;

const AUTOPLAY_CHECK_INTERVAL =
    250;


/*
 * popup.html's actual design size.
 *
 * Keep these identical to popup.html.
 */
const QUESTION_WIDTH = 928;
const QUESTION_HEIGHT = 929;


/*
 * Minimum amount of the desktop window that
 * should remain visible around the edges.
 */
const SCREEN_MARGIN = 20;


/* ============================================================
   ELEMENTS
   ============================================================ */

const popupOverlay =
    document.getElementById(
        "popup-overlay"
    );

const popupMessage =
    document.getElementById(
        "popup-message"
    );

const popupButtons =
    document.getElementById(
        "popup-buttons"
    );

const popupClose =
    document.getElementById(
        "popup-close"
    );

const popupIcon =
    document.getElementById(
        "popup-icon"
    );

const autoplayAudio =
    document.getElementById(
        "autoplay-test-audio"
    );


/* ============================================================
   STATE
   ============================================================ */

const popupResults =
    new Set();


let popupTestStarted =
    false;


let popupAllowed =
    false;


let autoplayTestComplete =
    false;


let autoplayAllowed =
    false;


let permissionMessageVisible =
    false;


let popupResolver =
    null;


let openingTarget =
    false;


let targetPopup =
    null;


let targetPopupFinished =
    false;


let targetPopupMonitor =
    null;


let permissionStartupComplete =
    false;


let initialPopupOpenAttempted =
    false;


/* ============================================================
   MESSAGE BOX
   ============================================================ */

function showPopup(
    message,
    buttons = ["OK"],
    icon = "!"
) {

    popupMessage.textContent =
        message;


    popupIcon.textContent =
        icon;


    popupButtons.innerHTML =
        "";


    popupOverlay.classList.add(
        "visible"
    );


    return new Promise(
        resolve => {

            popupResolver =
                resolve;


            for (
                const text of buttons
            ) {

                const button =
                    document.createElement(
                        "button"
                    );


                button.type =
                    "button";


                button.textContent =
                    text;


                button.addEventListener(
                    "click",
                    () => {

                        closePopup(
                            text
                        );

                    }
                );


                popupButtons.appendChild(
                    button
                );

            }


            const firstButton =
                popupButtons.querySelector(
                    "button"
                );


            if (firstButton) {

                firstButton.focus();

            }

        }
    );

}


function closePopup(
    result = "Close"
) {

    popupOverlay.classList.remove(
        "visible"
    );


    if (popupResolver) {

        const resolve =
            popupResolver;

        popupResolver =
            null;

        resolve(result);

    }

}


popupClose.addEventListener(
    "click",
    () => {

        closePopup(
            "Close"
        );

    }
);


/* ============================================================
   AUTOPLAY TEST
   ============================================================ */

async function testAutoplayPermission() {

    if (
        autoplayTestComplete
    ) {

        return autoplayAllowed;

    }


    autoplayTestComplete =
        true;


    try {

        autoplayAudio.pause();


        try {

            autoplayAudio.currentTime =
                0;

        } catch (_) {}


        const playPromise =
            autoplayAudio.play();


        if (
            playPromise &&
            typeof playPromise.then ===
            "function"
        ) {

            await playPromise;

        }


        await new Promise(
            resolve => {

                setTimeout(
                    resolve,
                    100
                );

            }
        );


        autoplayAllowed =
            !autoplayAudio.paused &&
            !autoplayAudio.ended;


        if (
            !autoplayAllowed
        ) {

            autoplayAudio.pause();


            try {

                autoplayAudio.currentTime =
                    0;

            } catch (_) {}

        }

    } catch (_) {

        autoplayAllowed =
            false;


        try {

            autoplayAudio.pause();

            autoplayAudio.currentTime =
                0;

        } catch (_) {}

    }


    updatePermissionMessage();

    maybeOpenQuestionPopup();


    return autoplayAllowed;

}


/* ============================================================
   PERIODIC AUTOPLAY TEST
   ============================================================ */

setInterval(
    () => {

        if (
            autoplayAllowed
        ) {

            return;

        }


        autoplayTestComplete =
            false;


        testAutoplayPermission();

    },
    AUTOPLAY_CHECK_INTERVAL
);


/* ============================================================
   USER INTERACTION AUTOPLAY UNLOCK
   ============================================================ */

function tryUnlockAutoplay() {

    if (
        autoplayAllowed
    ) {

        return;

    }


    try {

        const playPromise =
            autoplayAudio.play();


        if (
            playPromise &&
            typeof playPromise.then ===
            "function"
        ) {

            playPromise
                .then(
                    () => {

                        autoplayAllowed =
                            !autoplayAudio.paused &&
                            !autoplayAudio.ended;


                        if (
                            autoplayAllowed
                        ) {

                            autoplayTestComplete =
                                true;

                            updatePermissionMessage();

                            maybeOpenQuestionPopup();

                        }

                    }
                )
                .catch(
                    () => {

                        autoplayAllowed =
                            false;

                        updatePermissionMessage();

                    }
                );

        } else {

            autoplayAllowed =
                !autoplayAudio.paused &&
                !autoplayAudio.ended;


            if (
                autoplayAllowed
            ) {

                autoplayTestComplete =
                    true;

                updatePermissionMessage();

                maybeOpenQuestionPopup();

            }

        }

    } catch (_) {

        autoplayAllowed =
            false;

    }

}


document.addEventListener(
    "pointerdown",
    tryUnlockAutoplay,
    {
        passive: true
    }
);


document.addEventListener(
    "keydown",
    tryUnlockAutoplay,
    {
        passive: true
    }
);


/* ============================================================
   POPUP PERMISSION TEST
   ============================================================ */

function testPopupPermission() {

    if (
        popupTestStarted
    ) {

        return popupAllowed;

    }


    popupTestStarted =
        true;


    popupResults.clear();


    for (
        let i = 0;
        i < POPUP_TEST_COUNT;
        i++
    ) {

        try {

            const testPopup =
                window.open(
                    `${TEST_PAGE}?id=${i}`,
                    `youare_popup_test_${i}`,
                    [
                        "width=1",
                        "height=1",
                        "left=-10000",
                        "top=-10000"
                    ].join(",")
                );


            void testPopup;

        } catch (_) {}

    }


    setTimeout(
        () => {

            updatePermissionMessage();

            maybeOpenQuestionPopup();


            if (
                !popupAllowed &&
                !permissionMessageVisible
            ) {

                showPermissionMessage();

            }

        },
        1500
    );


    return popupAllowed;

}


/* ============================================================
   POPUP TEST RESULT
   ============================================================ */

window.addEventListener(
    "message",
    event => {

        if (
            event.origin !==
            window.location.origin
        ) {

            return;

        }


        const data =
            event.data;


        if (
            !data ||
            data.type !==
            "YOUARE_POPUP_TEST_SUCCESS"
        ) {

            return;

        }


        const id =
            String(data.id);


        if (
            ![
                "0",
                "1",
                "2"
            ].includes(id)
        ) {

            return;

        }


        popupResults.add(
            id
        );


        if (
            popupResults.size >=
            POPUP_TEST_COUNT
        ) {

            popupAllowed =
                true;

        }


        updatePermissionMessage();

        maybeOpenQuestionPopup();

    }
);


/* ============================================================
   PERMISSION MESSAGE
   ============================================================ */

function getPermissionMessage() {

    if (
        popupAllowed &&
        autoplayAllowed
    ) {

        return null;

    }


    if (
        !popupAllowed &&
        autoplayAllowed
    ) {

        return (
            "This recreation requires pop-up windows " +
            "to be enabled in your browser. Please allow " +
            "pop-ups for this site."
        );

    }


    if (
        popupAllowed &&
        !autoplayAllowed
    ) {

        return (
            "This recreation requires audio autoplay " +
            "to be enabled in your browser. Please allow " +
            "autoplay for this site."
        );

    }


    return (
        "This recreation requires pop-up windows and " +
        "audio autoplay to be enabled in your browser. " +
        "Please allow both for this site."
    );

}


function updatePermissionMessage() {

    const message =
        getPermissionMessage();


    if (
        !message
    ) {

        if (
            permissionMessageVisible &&
            popupResolver
        ) {

            closePopup(
                "Permissions complete"
            );

        }


        permissionMessageVisible =
            false;


        maybeOpenQuestionPopup();

        return;

    }


    if (
        !permissionMessageVisible
    ) {

        return;

    }


    popupMessage.textContent =
        message;

}


async function showPermissionMessage() {

    const message =
        getPermissionMessage();


    if (
        !message
    ) {

        maybeOpenQuestionPopup();

        return;

    }


    if (
        permissionMessageVisible
    ) {

        return;

    }


    permissionMessageVisible =
        true;


    await showPopup(
        message,
        ["OK"],
        "!"
    );


    permissionMessageVisible =
        false;


    tryUnlockAutoplay();


    if (
        !popupAllowed
    ) {

        popupTestStarted =
            false;

        popupResults.clear();

        testPopupPermission();

    }


    maybeOpenQuestionPopup();

}


/* ============================================================
   DISCORD RESIZE REQUEST
   ============================================================ */

window.addEventListener(
    "message",
    event => {

        if (
            event.origin !==
            window.location.origin
        ) {

            return;

        }


        const data =
            event.data;


        if (
            !data ||
            data.type !==
            "YOUARE_REQUEST_DISCORD_SIZE"
        ) {

            return;

        }


        if (
            !targetPopup ||
            event.source !== targetPopup
        ) {

            return;

        }


        const width =
            Number(data.width);


        const height =
            Number(data.height);


        if (
            !Number.isFinite(width) ||
            !Number.isFinite(height) ||
            width < 1 ||
            height < 1
        ) {

            return;

        }


        const safeWidth =
            Math.round(
                Math.min(
                    width,
                    Math.max(
                        1,
                        screen.availWidth
                    )
                )
            );


        const safeHeight =
            Math.round(
                Math.min(
                    height,
                    Math.max(
                        1,
                        screen.availHeight
                    )
                )
            );


        try {

            targetPopup.resizeTo(
                safeWidth,
                safeHeight
            );

            const availLeft =
                Number(screen.availLeft) || 0;

            const availTop =
                Number(screen.availTop) || 0;

            const availWidth =
                Number(screen.availWidth) ||
                Number(screen.width);

            const availHeight =
                Number(screen.availHeight) ||
                Number(screen.height);

            targetPopup.moveTo(
                Math.max(
                    availLeft,
                    Math.round(
                        availLeft +
                        (availWidth - safeWidth) / 2
                    )
                ),
                Math.max(
                    availTop,
                    Math.round(
                        availTop +
                        (availHeight - safeHeight) / 2
                    )
                )
            );

        } catch (_) {}



        try {

            targetPopup.focus();

        } catch (_) {}

    }
);


/* ============================================================
   DYNAMIC QUESTION POPUP SIZE
   ============================================================ */

/*
 * Calculates the browser-window dimensions required
 * to display popup.html at the largest possible
 * proportional size.
 *
 * Base design:
 *
 *     928 × 929
 *
 * Same ratio as popup.html.
 */

function getQuestionPopupDimensions() {

    /*
     * window.open() sizes the OUTER window, which
     * also contains the browser's own title bar,
     * address bar and borders. Reserve room for it
     * so the content area keeps the 928x929 ratio.
     */
    const BROWSER_CHROME_HEIGHT = 90;

    /*
     * The popup should feel like a classic desktop
     * window, not a full-screen page. Never take
     * more than this share of the screen.
     */
    const MAX_SCREEN_SHARE = 0.6;


    const availableWidth =
        Math.max(
            1,
            Number(screen.availWidth) -
            SCREEN_MARGIN * 2
        );


    const availableHeight =
        Math.max(
            1,
            Number(screen.availHeight) -
            SCREEN_MARGIN * 2
        );


    const maxContentWidth =
        Math.min(
            availableWidth,
            Number(screen.availWidth) *
            MAX_SCREEN_SHARE
        );


    const maxContentHeight =
        Math.min(
            availableHeight -
            BROWSER_CHROME_HEIGHT,
            Number(screen.availHeight) *
            MAX_SCREEN_SHARE
        );


    /*
     * Uniform scale, never upscaled past the
     * original design size.
     */
    const PREFERRED_WIDTH = 520;
    const PREFERRED_HEIGHT = 521;

    let scale =
        Math.min(
            maxContentWidth / QUESTION_WIDTH,
            maxContentHeight / QUESTION_HEIGHT,
            PREFERRED_WIDTH / QUESTION_WIDTH,
            PREFERRED_HEIGHT / QUESTION_HEIGHT
        );


    if (
        !Number.isFinite(scale) ||
        scale <= 0
    ) {

        scale = 0.5;

    }


    let width =
        QUESTION_WIDTH * scale;


    let height =
        QUESTION_HEIGHT * scale +
        BROWSER_CHROME_HEIGHT;


    width =
        Math.min(
            width,
            availableWidth
        );


    height =
        Math.min(
            height,
            availableHeight
        );


    width =
        Math.max(
            200,
            Math.floor(width)
        );


    height =
        Math.max(
            200,
            Math.floor(height)
        );


    return {
        width,
        height
    };

}



/* ============================================================
   POPUP FEATURES
   ============================================================ */

function getPopupFeatures() {

    const dimensions =
        getQuestionPopupDimensions();


    const left =
        Math.max(
            0,
            Math.floor(
                (
                    screen.availWidth -
                    dimensions.width
                ) / 2
            )
        );


    const top =
        Math.max(
            0,
            Math.floor(
                (
                    screen.availHeight -
                    dimensions.height
                ) / 2
            )
        );


    return [

        `width=${dimensions.width}`,

        `height=${dimensions.height}`,

        `left=${left}`,

        `top=${top}`,

        "resizable=yes",

        "scrollbars=no",

        "toolbar=no",

        "menubar=no",

        "location=no",

        "status=no"

    ].join(",");

}


/* ============================================================
   REAL POPUP CLOSED HANDLER
   ============================================================ */

function handleTargetPopupClosed() {

    if (
        targetPopupFinished
    ) {

        return;

    }


    targetPopupFinished =
        true;


    if (
        targetPopupMonitor
    ) {

        clearInterval(
            targetPopupMonitor
        );

        targetPopupMonitor =
            null;

    }


    targetPopup =
        null;


    const existingScript =
        document.querySelector(
            'script[data-youare-app-script="true"]'
        );


    if (
        existingScript
    ) {

        return;

    }


    const appScript =
        document.createElement(
            "script"
        );


    appScript.src =
        "/scripts/app.js";


    appScript.async =
        false;


    appScript.dataset.youareAppScript =
        "true";


    document.head.appendChild(
        appScript
    );

}


/* ============================================================
   MONITOR REAL POPUP
   ============================================================ */

function monitorTargetPopup(
    popup
) {

    if (
        targetPopupMonitor
    ) {

        clearInterval(
            targetPopupMonitor
        );

    }


    targetPopupMonitor =
        setInterval(
            () => {

                try {

                    if (
                        popup.closed
                    ) {

                        handleTargetPopupClosed();

                    }

                } catch (_) {}

            },
            TARGET_CHECK_INTERVAL
        );

}


/* ============================================================
   OPEN QUESTION POPUP
   ============================================================ */

function openQuestionPopup() {

    if (
        openingTarget ||
        targetPopup
    ) {

        return;

    }


    if (
        !popupAllowed ||
        !autoplayAllowed
    ) {

        return;

    }


    openingTarget =
        true;


    targetPopupFinished =
        false;


    const features =
        getPopupFeatures();


    let popup =
        null;


    try {

        popup =
            window.open(
                TARGET_PAGE,
                "YouAreAnIdiotQuestion",
                features
            );

    } catch (_) {

        popup =
            null;

    }


    if (
        !popup
    ) {

        openingTarget =
            false;


        popupAllowed =
            false;


        popupTestStarted =
            false;


        popupResults.clear();


        showPermissionMessage();

        return;

    }


    targetPopup =
        popup;


    openingTarget =
        false;


    monitorTargetPopup(
        popup
    );


    try {

        popup.focus();

    } catch (_) {}

}


/* ============================================================
   OPEN ONLY AFTER BOTH CHECKS
   ============================================================ */

function maybeOpenQuestionPopup() {

    if (
        initialPopupOpenAttempted
    ) {

        return;

    }


    if (
        !permissionStartupComplete
    ) {

        return;

    }


    if (
        !popupAllowed ||
        !autoplayAllowed
    ) {

        return;

    }


    if (
        targetPopup ||
        openingTarget
    ) {

        return;

    }


    initialPopupOpenAttempted =
        true;


    if (
        permissionMessageVisible
    ) {

        closePopup(
            "Permissions complete"
        );

        permissionMessageVisible =
            false;

    }


    openQuestionPopup();

}


/* ============================================================
   STARTUP
   ============================================================ */

window.addEventListener(
    "load",
    async () => {

        testPopupPermission();


        await testAutoplayPermission();


        permissionStartupComplete =
            true;


        maybeOpenQuestionPopup();


        if (
            !popupAllowed ||
            !autoplayAllowed
        ) {

            await showPermissionMessage();

        }

    },
    {
        once: true
    }
);


/* ============================================================
   RETEST ON FOCUS
   ============================================================ */

window.addEventListener(
    "focus",
    () => {

        if (
            !targetPopup &&
            !permissionMessageVisible
        ) {

            if (
                !popupAllowed
            ) {

                popupTestStarted =
                    false;

                popupResults.clear();

                testPopupPermission();

            }


            if (
                !autoplayAllowed
            ) {

                autoplayTestComplete =
                    false;

                testAutoplayPermission();

            }

        }


        if (
            !autoplayAllowed
        ) {

            tryUnlockAutoplay();

        }

    }
);


/* ============================================================
   ESCAPE
   ============================================================ */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape"
        ) {

            closePopup(
                "Close"
            );

        }

    }
);


/* ============================================================
   RIGHT CLICK
   ============================================================ */

document.addEventListener(
    "contextmenu",
    event => {

        event.preventDefault();

    }
);

</script>
