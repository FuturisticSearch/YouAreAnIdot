<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Are You An Idiot?</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            background: #008080;
            overflow: hidden;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: "MS Sans Serif", Tahoma, Arial, sans-serif;

            user-select: none;
        }


        /*
         * ============================================================
         * WINDOWS 95/98 STYLE MAIN WINDOW
         * ============================================================
         */

        #question-window {
            position: relative;

            width: 928px;
            height: 929px;

            background: #c0c0c0;

            border: 2px solid;
            border-color: #ffffff #000000 #000000 #ffffff;

            box-shadow:
                1px 1px 0 #dfdfdf,
                2px 2px 0 #808080;

            overflow: hidden;
        }


        /*
         * ============================================================
         * TITLE BAR
         * ============================================================
         */

        #titlebar {
            position: absolute;

            left: 3px;
            right: 3px;
            top: 3px;

            height: 25px;

            display: flex;
            align-items: center;

            padding-left: 5px;
            padding-right: 2px;

            background: #000080;

            color: #ffffff;

            font-family:
                "MS Sans Serif",
                Tahoma,
                Arial,
                sans-serif;

            font-size: 13px;
            font-weight: bold;
        }

        #title {
            flex: 1;
        }

        /*
         * Windows 95/98 title-bar buttons
         */

        .window-button {
            width: 21px;
            height: 21px;

            padding: 0;
            margin-left: 2px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #c0c0c0;

            color: #000000;

            border: 2px solid;
            border-color: #ffffff #000000 #000000 #ffffff;

            font-family: Arial, sans-serif;
            font-size: 12px;
            font-weight: bold;

            line-height: 15px;
        }

        .window-button:active {
            border-color: #000000 #ffffff #ffffff #000000;
        }


        /*
         * ============================================================
         * CONTENT AREA
         * ============================================================
         *
         * Original PictureBox:
         *
         * x = 0
         * y = 0
         * width = 928
         * height = 711
         *
         * Since we now have a title bar, the image starts below it
         * while retaining its original aspect/layout.
         */

        #pictureBox1 {
            position: absolute;

            left: 3px;
            top: 31px;

            width: 918px;
            height: 711px;

            display: block;

            object-fit: fill;

            pointer-events: none;
        }


        /*
         * ============================================================
         * QUESTION AREA
         * ============================================================
         *
         * The original label was at:
         *
         * x = 266
         * y = 786
         *
         * But that leaves it slightly off-center.
         *
         * Here the question is centered horizontally.
         */

        #question-area {
            position: absolute;

            left: 3px;
            right: 3px;

            top: 750px;
            height: 90px;

            display: flex;

            align-items: center;
            justify-content: center;
        }

        #question {
            margin: 0;

            font-family: Verdana, sans-serif;
            font-size: 20px;
            font-weight: normal;

            line-height: 1.2;

            white-space: nowrap;

            color: Indigo;

            text-align: center;
        }


        /*
         * ============================================================
         * ANSWER BUTTONS
         * ============================================================
         *
         * Original:
         *
         * No:
         *   x=28
         *   y=860
         *   w=262
         *   h=57
         *
         * None:
         *   x=298
         *   y=860
         *   w=354
         *   h=57
         *
         * Yes:
         *   x=660
         *   y=860
         *   w=244
         *   h=57
         *
         * The buttons are retained at essentially the same
         * horizontal arrangement.
         */

        .answer {
            position: absolute;

            top: 860px;
            height: 57px;

            padding: 0;

            font-family: Verdana, sans-serif;
            font-size: 12px;
            font-weight: normal;

            background: #c0c0c0;

            color: #000000;

            border: 2px solid;
            border-color: #ffffff #000000 #000000 #ffffff;

            border-radius: 0;

            cursor: default;
        }

        .answer:active {
            border-color: #000000 #ffffff #ffffff #000000;
        }

        #no {
            left: 28px;
            width: 262px;
        }

        #none {
            left: 298px;
            width: 354px;
        }

        #yes {
            left: 660px;
            width: 244px;
        }


        /*
         * ============================================================
         * WINDOWS 95/98 MESSAGE BOX
         * ============================================================
         */

        #popup-overlay {
            position: fixed;

            inset: 0;

            display: none;

            z-index: 100000;
        }

        #popup-overlay.visible {
            display: block;
        }

        #popup {
            position: fixed;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            min-width: 390px;

            background: #c0c0c0;

            border: 2px solid;
            border-color: #ffffff #000000 #000000 #ffffff;

            box-shadow:
                1px 1px 0 #dfdfdf,
                2px 2px 0 #808080;

            font-family:
                "MS Sans Serif",
                Tahoma,
                Arial,
                sans-serif;
        }

        #popup-titlebar {
            height: 25px;

            display: flex;
            align-items: center;

            padding-left: 5px;
            padding-right: 2px;

            background: #000080;

            color: white;

            font-size: 13px;
            font-weight: bold;
        }

        #popup-title {
            flex: 1;
        }

        #popup-close {
            width: 21px;
            height: 21px;

            padding: 0;

            background: #c0c0c0;

            border: 2px solid;
            border-color: #ffffff #000000 #000000 #ffffff;

            font-family: Arial, sans-serif;
            font-size: 12px;
            font-weight: bold;
        }

        #popup-close:active {
            border-color: #000000 #ffffff #ffffff #000000;
        }

        #popup-content {
            min-height: 90px;

            display: flex;
            align-items: center;

            padding: 18px;
        }

        #popup-icon {
            width: 32px;
            min-width: 32px;
            height: 32px;

            margin-right: 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, sans-serif;
            font-size: 27px;
            font-weight: bold;
        }

        #popup-message {
            flex: 1;

            font-family:
                "MS Sans Serif",
                Tahoma,
                Arial,
                sans-serif;

            font-size: 13px;

            color: #000000;
        }

        #popup-buttons {
            display: flex;
            justify-content: center;

            gap: 8px;

            padding: 0 12px 14px;
        }

        #popup-buttons button {
            min-width: 75px;
            height: 27px;

            padding: 2px 12px;

            background: #c0c0c0;

            border: 2px solid;
            border-color: #ffffff #000000 #000000 #ffffff;

            font-family:
                "MS Sans Serif",
                Tahoma,
                Arial,
                sans-serif;

            font-size: 12px;

            color: #000000;
        }

        #popup-buttons button:active {
            border-color: #000000 #ffffff #ffffff #000000;
        }

        #popup-buttons button:focus {
            outline: 1px dotted #000000;
            outline-offset: -5px;
        }


        /*
         * ============================================================
         * SMALL SCREEN SCALING
         * ============================================================
         */

        @media (max-width: 928px), (max-height: 929px) {

            #question-window {
                transform-origin: center center;

                transform:
                    scale(
                        min(
                            calc(100vw / 932),
                            calc(100vh / 933)
                        )
                    );
            }
        }
    </style>
</head>

<body>

    <!-- ============================================================
         MAIN QUESTION WINDOW
         ============================================================ -->

    <main id="question-window">

        <!-- Windows 95/98 title bar -->
        <div id="titlebar">

            <span id="title">
                Are You An Idiot?
            </span>

            <button
                class="window-button"
                id="minimize"
                type="button"
                aria-label="Minimize"
            >
                _
            </button>

            <button
                class="window-button"
                id="maximize"
                type="button"
                aria-label="Maximize"
            >
                □
            </button>

            <button
                class="window-button"
                id="close"
                type="button"
                aria-label="Close"
            >
                ×
            </button>

        </div>


        <!-- Original PictureBox -->
        <img
            id="pictureBox1"
            src="media/idiot.gif"
            alt=""
            draggable="false"
        >


        <!-- Centered question -->
        <div id="question-area">

            <div id="question">
                Are You An Idiot ?
            </div>

        </div>


        <!-- Original buttons -->

        <button
            class="answer"
            id="no"
            type="button"
        >
            No, I'm not.
        </button>

        <button
            class="answer"
            id="none"
            type="button"
        >
            I don't know =[
        </button>

        <button
            class="answer"
            id="yes"
            type="button"
        >
            Yes, I am.
        </button>

    </main>


    <!-- ============================================================
         CUSTOM MESSAGE BOX
         ============================================================ -->

    <div id="popup-overlay">

        <div id="popup">

            <div id="popup-titlebar">

                <span id="popup-title">
                    YouAreAnIdiot
                </span>

                <button
                    id="popup-close"
                    type="button"
                    aria-label="Close"
                >
                    ×
                </button>

            </div>

            <div id="popup-content">

                <div id="popup-icon">
                    !
                </div>

                <div id="popup-message"></div>

            </div>

            <div id="popup-buttons"></div>

        </div>

    </div>


    <!-- ============================================================
         AUDIO
         ============================================================

         Using the requested path:

         /media/youare-long.mp3
         -->

    <audio
        id="idiot-audio"
        preload="auto"
        loop
    >
        <source
            src="/media/youare-long.mp3"
            type="audio/mpeg"
        >
    </audio>


    <script>
        "use strict";


        /*
         * ============================================================
         * ELEMENTS
         * ============================================================
         */

        const question =
            document.getElementById("question");

        const noButton =
            document.getElementById("no");

        const noneButton =
            document.getElementById("none");

        const yesButton =
            document.getElementById("yes");

        const closeButton =
            document.getElementById("close");

        const idiotAudio =
            document.getElementById("idiot-audio");

        const popupOverlay =
            document.getElementById("popup-overlay");

        const popupMessage =
            document.getElementById("popup-message");

        const popupButtons =
            document.getElementById("popup-buttons");

        const popupClose =
            document.getElementById("popup-close");


        /*
         * ============================================================
         * FONT COLOUR TIMER
         * ============================================================
         *
         * Original Designer:
         *
         * FontColour.Interval = 55;
         *
         * Original sequence:
         *
         * Indigo
         * Ivory
         * LightPink
         * LightSkyBlue
         * Lime
         * MediumPurple
         * MediumSpringGreen
         * Pink
         * Red
         * Snow
         */

        const fontColors = [
            "Indigo",
            "Ivory",
            "LightPink",
            "LightSkyBlue",
            "Lime",
            "MediumPurple",
            "MediumSpringGreen",
            "Pink",
            "Red",
            "Snow"
        ];

        let timerFT = 0;


        setInterval(() => {

            timerFT++;

            if (timerFT >= 1 && timerFT <= 9) {
                question.style.color =
                    fontColors[timerFT];
            }

            if (timerFT >= 9) {

                question.style.color = "Snow";

                timerFT = 0;
            }

        }, 55);


        /*
         * ============================================================
         * AUDIO
         * ============================================================
         *
         * Requested:
         *
         * /media/youare-long.mp3
         */

        function playAudio() {

            idiotAudio
                .play()
                .catch(() => {
                    /*
                     * Autoplay may be blocked by the browser.
                     */
                });
        }

        playAudio();


        /*
         * Retry after first user interaction if autoplay was blocked.
         */

        document.addEventListener(
            "pointerdown",
            () => {
                playAudio();
            },
            { once: true }
        );


        /*
         * ============================================================
         * CUSTOM MESSAGE BOX
         * ============================================================
         */

        let popupResolver = null;


        function showPopup(message, buttons, icon = "!") {

            popupMessage.textContent = message;

            document.getElementById(
                "popup-icon"
            ).textContent = icon;

            popupButtons.innerHTML = "";

            popupOverlay.classList.add("visible");


            return new Promise(resolve => {

                popupResolver = resolve;


                for (const text of buttons) {

                    const button =
                        document.createElement("button");

                    button.type = "button";

                    button.textContent = text;

                    button.addEventListener(
                        "click",
                        () => {
                            closePopup(text);
                        }
                    );

                    popupButtons.appendChild(button);
                }


                const firstButton =
                    popupButtons.querySelector("button");

                if (firstButton) {
                    firstButton.focus();
                }
            });
        }


        function closePopup(result = "Close") {

            popupOverlay.classList.remove("visible");

            if (popupResolver) {

                const resolve = popupResolver;

                popupResolver = null;

                resolve(result);
            }
        }


        popupClose.addEventListener(
            "click",
            () => {
                closePopup("Close");
            }
        );


        /*
         * ============================================================
         * REDIRECT
         * ============================================================
         *
         * Requested replacement for the original HAHA spawning.
         */

        let redirecting = false;


        function redirectToDiscord() {

            if (redirecting) {
                return;
            }

            redirecting = true;

            window.location.href = "discord.html";
        }


        /*
         * ============================================================
         * NO
         * ============================================================
         *
         * Original:
         *
         * MessageBox.Show(
         *     "Oh... I think you are an idiot. XD",
         *     "YouAreAnIdiot"
         * );
         *
         * this.Close();
         */

        async function handleNo() {

            if (redirecting) {
                return;
            }

            await showPopup(
                "Oh... I think you are an idiot. XD",
                ["OK"],
                "!"
            );

            redirectToDiscord();
        }


        /*
         * Both No and None are connected to No_Click in the
         * original Designer.cs.
         */

        noButton.addEventListener(
            "click",
            handleNo
        );

        noneButton.addEventListener(
            "click",
            handleNo
        );


        /*
         * ============================================================
         * YES
         * ============================================================
         *
         * Original:
         *
         * MessageBox.Show(
         *     "Are you sure?",
         *     "YouAreAnIdiot",
         *     MessageBoxButtons.YesNo
         * );
         *
         * this.Close();
         */

        yesButton.addEventListener(
            "click",
            async () => {

                if (redirecting) {
                    return;
                }

                await showPopup(
                    "Are you sure?",
                    ["Yes", "No"],
                    "?"
                );

                redirectToDiscord();
            }
        );


        /*
         * ============================================================
         * CLOSE BUTTON
         * ============================================================
         *
         * Equivalent to closing the original Question form.
         */

        closeButton.addEventListener(
            "click",
            redirectToDiscord
        );


        /*
         * The minimize/maximize buttons don't exist on the original
         * WinForms window because:
         *
         * MaximizeBox = false
         * MinimizeBox = false
         *
         * They are therefore disabled visually/functionally.
         */

        document.getElementById("minimize").disabled = true;
        document.getElementById("maximize").disabled = true;


        /*
         * ESC = close
         */

        document.addEventListener(
            "keydown",
            event => {

                if (event.key === "Escape") {
                    redirectToDiscord();
                }

            }
        );


        /*
         * Prevent context menu, matching the fixed-app behavior.
         */

        document.addEventListener(
            "contextmenu",
            event => {
                event.preventDefault();
            }
        );


        /*
         * Don't let the GIF be dragged.
         */

        document
            .getElementById("pictureBox1")
            .addEventListener(
                "dragstart",
                event => {
                    event.preventDefault();
                }
            );
    </script>

</body>
</html>
