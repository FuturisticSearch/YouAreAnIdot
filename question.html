<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Are You An Idiot?</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        body {
            background: #000;
            overflow: hidden;
            font-family: Verdana, sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;

            user-select: none;
        }

        /*
         * WinForms equivalent:
         *
         * ClientSize = 928 x 929
         * BackColor = White
         * FormBorderStyle = FixedSingle
         * MaximizeBox = false
         * MinimizeBox = false
         * StartPosition = CenterScreen
         * TopMost = true
         */

        #question-form {
            position: relative;

            width: 928px;
            height: 929px;

            background: #fff;

            overflow: hidden;

            flex: 0 0 auto;
        }


        /*
         * ============================================================
         * PictureBox
         *
         * Location = (0, 0)
         * Size = (928, 711)
         * SizeMode = StretchImage
         *
         * Uses media/idiot.gif
         * ============================================================
         */

        #pictureBox1 {
            position: absolute;

            left: 0;
            top: 0;

            width: 928px;
            height: 711px;

            display: block;

            /*
             * WinForms PictureBoxSizeMode.StretchImage
             */
            object-fit: fill;
        }


        /*
         * ============================================================
         * Label_Question
         *
         * Location = (266, 786)
         * Font = Verdana 20
         * Text = "Are You An Idiot ?"
         * ============================================================
         */

        #question {
            position: absolute;

            left: 266px;
            top: 786px;

            margin: 0;

            padding: 0;

            font-family: Verdana, sans-serif;
            font-size: 20px;
            font-weight: normal;

            line-height: normal;

            white-space: nowrap;

            color: Indigo;
        }


        /*
         * ============================================================
         * Buttons
         *
         * Font = Verdana 12
         * ============================================================
         */

        .answer {
            position: absolute;

            top: 860px;
            height: 57px;

            padding: 0;

            font-family: Verdana, sans-serif;
            font-size: 12px;
            font-weight: normal;

            color: #000;

            background: #efefef;

            border: 1px solid #767676;
            border-radius: 2px;

            cursor: default;
        }

        /*
         * No
         *
         * Location = (28, 860)
         * Size = (262, 57)
         */

        #no {
            left: 28px;
            width: 262px;
        }

        /*
         * None
         *
         * Location = (298, 860)
         * Size = (354, 57)
         */

        #none {
            left: 298px;
            width: 354px;
        }

        /*
         * Yes
         *
         * Location = (660, 860)
         * Size = (244, 57)
         */

        #yes {
            left: 660px;
            width: 244px;
        }

        .answer:hover {
            background: #e5e5e5;
        }

        .answer:active {
            background: #d5d5d5;
        }


        /*
         * ============================================================
         * Custom MessageBox
         *
         * The original uses Windows MessageBox.Show().
         * Using a custom popup instead of alert() gives us much
         * more control over the appearance and Yes/No behavior.
         * ============================================================
         */

        #popup-overlay {
            position: fixed;
            inset: 0;

            display: none;

            z-index: 999999;

            background: transparent;
        }

        #popup-overlay.visible {
            display: block;
        }

        #popup {
            position: fixed;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            min-width: 360px;

            background: #c0c0c0;

            border: 2px solid;
            border-color: #fff #404040 #404040 #fff;

            box-shadow:
                1px 1px 0 #000,
                2px 2px 0 #808080;

            font-family:
                Tahoma,
                "MS Sans Serif",
                Arial,
                sans-serif;
        }

        #popup-titlebar {
            height: 24px;

            display: flex;
            align-items: center;

            padding-left: 5px;
            padding-right: 2px;

            color: #fff;

            font-size: 13px;
            font-weight: bold;

            background: linear-gradient(
                to right,
                #000080,
                #1084d7
            );
        }

        #popup-title {
            flex: 1;
        }

        #popup-close {
            width: 18px;
            height: 18px;

            padding: 0;

            color: #000;

            background: #c0c0c0;

            border: 2px solid;
            border-color: #fff #404040 #404040 #fff;

            font-size: 11px;
            font-weight: bold;

            line-height: 13px;
        }

        #popup-content {
            min-height: 72px;

            display: flex;
            align-items: center;

            padding: 12px 14px;
        }

        #popup-icon {
            width: 32px;
            min-width: 32px;
            height: 32px;

            margin-right: 14px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, sans-serif;
            font-size: 25px;
            font-weight: bold;
        }

        #popup-message {
            flex: 1;

            font-size: 13px;
            color: #000;
        }

        #popup-buttons {
            display: flex;
            justify-content: center;

            gap: 8px;

            padding: 4px 10px 12px;
        }

        #popup-buttons button {
            min-width: 75px;
            height: 25px;

            padding: 2px 10px;

            font-family:
                Tahoma,
                "MS Sans Serif",
                Arial,
                sans-serif;

            font-size: 12px;

            background: #c0c0c0;
            color: #000;

            border: 2px solid;
            border-color: #fff #404040 #404040 #fff;
        }

        #popup-buttons button:active {
            border-color: #404040 #fff #fff #404040;
        }

        #popup-buttons button:focus {
            outline: 1px dotted #000;
            outline-offset: -5px;
        }


        /*
         * ============================================================
         * Small screens
         *
         * The original is fixed at 928x929. On a smaller browser
         * viewport we scale the entire form rather than changing
         * the internal coordinates.
         * ============================================================
         */

        @media (max-width: 928px), (max-height: 929px) {
            #question-form {
                transform-origin: center center;

                transform:
                    scale(
                        min(
                            calc(100vw / 928),
                            calc(100vh / 929)
                        )
                    );
            }
        }
    </style>
</head>

<body>

    <main id="question-form">

        <!--
            Original PictureBox:

            Location: 0,0
            Size: 928x711
            SizeMode: StretchImage
        -->
        <img
            id="pictureBox1"
            src="media/idiot.gif"
            alt=""
            draggable="false"
        >


        <!--
            Original Label_Question:

            Location: 266,786
            Font: Verdana 20
            Text: Are You An Idiot ?
        -->
        <div id="question">
            Are You An Idiot ?
        </div>


        <!--
            Original No button:

            Location: 28,860
            Size: 262x57
            Text: No, I'm not.
        -->
        <button
            class="answer"
            id="no"
            type="button"
        >
            No, I'm not.
        </button>


        <!--
            Original None button:

            Location: 298,860
            Size: 354x57
            Text: I don't know =[
        -->
        <button
            class="answer"
            id="none"
            type="button"
        >
            I don't know =[
        </button>


        <!--
            Original Yes button:

            Location: 660,860
            Size: 244x57
            Text: Yes, I am.
        -->
        <button
            class="answer"
            id="yes"
            type="button"
        >
            Yes, I am.
        </button>

    </main>


    <!-- ============================================================
         Custom Windows-style MessageBox
         ============================================================ -->

    <div id="popup-overlay">

        <div id="popup">

            <div id="popup-titlebar">

                <span id="popup-title">
                    YouAreAnIdiot
                </span>

                <button
                    id="popup-close"
                    type="button"
                    aria-label="Close"
                >
                    ×
                </button>

            </div>


            <div id="popup-content">

                <div id="popup-icon">
                    !
                </div>

                <div id="popup-message"></div>

            </div>


            <div id="popup-buttons"></div>

        </div>

    </div>


    <!--
        Original:

        Properties.Resources.you_are_an_idiot

        Expected web equivalent:
        media/you_are_an_idiot.mp3
    -->
    <audio
        id="start-audio"
        preload="auto"
    >
        <source
            src="media/you_are_an_idiot.mp3"
            type="audio/mpeg"
        >
    </audio>


    <script>
        "use strict";


        /*
         * ============================================================
         * Elements
         * ============================================================
         */

        const question =
            document.getElementById("question");

        const noButton =
            document.getElementById("no");

        const noneButton =
            document.getElementById("none");

        const yesButton =
            document.getElementById("yes");

        const startAudio =
            document.getElementById("start-audio");

        const popupOverlay =
            document.getElementById("popup-overlay");

        const popupMessage =
            document.getElementById("popup-message");

        const popupButtons =
            document.getElementById("popup-buttons");

        const popupClose =
            document.getElementById("popup-close");


        /*
         * ============================================================
         * FontColour timer
         * ============================================================
         *
         * Designer:
         *
         * FontColour.Interval = 55
         *
         * Question.cs:
         *
         * 0  -> Indigo
         * 1  -> Ivory
         * 2  -> LightPink
         * 3  -> LightSkyBlue
         * 4  -> Lime
         * 5  -> MediumPurple
         * 6  -> MediumSpringGreen
         * 7  -> Pink
         * 8  -> Red
         * 9  -> Snow
         *
         * Then Timer_FT resets to 0.
         */

        const fontColors = [
            "Indigo",
            "Ivory",
            "LightPink",
            "LightSkyBlue",
            "Lime",
            "MediumPurple",
            "MediumSpringGreen",
            "Pink",
            "Red",
            "Snow"
        ];

        let timerFT = 0;


        setInterval(() => {

            timerFT += 1;

            /*
             * The original increments Timer_FT first.
             *
             * Starting from 0 therefore produces:
             *
             * Ivory -> LightPink -> ... -> Snow -> reset
             *
             * The initial color before the first tick is Indigo.
             */

            if (timerFT >= 1 && timerFT <= 9) {
                question.style.color =
                    fontColors[timerFT];
            }

            if (timerFT === 9) {
                question.style.color = "Snow";
                timerFT = 0;
            }

        }, 55);


        /*
         * ============================================================
         * Initial audio
         * ============================================================
         *
         * Original Question constructor:
         *
         * waveOutStart.Init(provider);
         * waveOutStart.Play();
         *
         * Browsers can block autoplay, so try immediately and
         * retry on the first interaction.
         */

        function playStartAudio() {

            if (!startAudio) {
                return;
            }

            startAudio.play().catch(() => {
                /*
                 * Autoplay was blocked.
                 * The pointer interaction handler below will retry.
                 */
            });
        }


        playStartAudio();


        document.addEventListener(
            "pointerdown",
            () => {
                playStartAudio();
            },
            { once: true }
        );


        /*
         * ============================================================
         * Custom MessageBox
         * ============================================================
         */

        let popupResolver = null;


        function showPopup(message, buttons, icon = "!") {

            popupMessage.textContent = message;

            const popupIcon =
                document.getElementById("popup-icon");

            popupIcon.textContent = icon;

            popupButtons.innerHTML = "";

            popupOverlay.classList.add("visible");


            return new Promise(resolve => {

                popupResolver = resolve;


                for (const text of buttons) {

                    const button =
                        document.createElement("button");

                    button.type = "button";
                    button.textContent = text;

                    button.addEventListener(
                        "click",
                        () => {
                            closePopup(text);
                        }
                    );

                    popupButtons.appendChild(button);
                }


                /*
                 * Native message boxes normally focus a button.
                 */

                const firstButton =
                    popupButtons.querySelector("button");

                if (firstButton) {
                    firstButton.focus();
                }
            });
        }


        function closePopup(result = "Close") {

            popupOverlay.classList.remove("visible");

            if (popupResolver) {

                const resolve = popupResolver;

                popupResolver = null;

                resolve(result);
            }
        }


        popupClose.addEventListener(
            "click",
            () => {
                closePopup("Close");
            }
        );


        /*
         * ============================================================
         * Redirect
         * ============================================================
         *
         * Instead of Question_Closing() creating:
         *
         *     HAHA haha1
         *     HAHA haha2
         *     HAHA haha3
         *     HAHA haha4
         *     HAHA haha5
         *
         * the requested web behavior is simply:
         *
         *     discord.html
         */

        let redirecting = false;


        function redirectToDiscord() {

            if (redirecting) {
                return;
            }

            redirecting = true;

            window.location.href = "discord.html";
        }


        /*
         * ============================================================
         * No_Click
         * ============================================================
         *
         * Original:
         *
         * MessageBox.Show(
         *     "Oh... I think you are an idiot. XD",
         *     "YouAreAnIdiot"
         * );
         *
         * this.Close();
         * ============================================================
         */

        async function handleNo() {

            if (redirecting) {
                return;
            }

            await showPopup(
                "Oh... I think you are an idiot. XD",
                ["OK"],
                "!"
            );

            redirectToDiscord();
        }


        /*
         * Both No and None use No_Click in the original Designer.
         *
         * Therefore they intentionally have identical behavior.
         */

        noButton.addEventListener(
            "click",
            handleNo
        );

        noneButton.addEventListener(
            "click",
            handleNo
        );


        /*
         * ============================================================
         * Yes_Click
         * ============================================================
         *
         * Original:
         *
         * MessageBox.Show(
         *     "Are you sure?",
         *     "YouAreAnIdiot",
         *     MessageBoxButtons.YesNo
         * );
         *
         * this.Close();
         *
         * The original closes regardless of whether the user
         * chooses Yes or No in the message box.
         */

        yesButton.addEventListener(
            "click",
            async () => {

                if (redirecting) {
                    return;
                }

                await showPopup(
                    "Are you sure?",
                    ["Yes", "No"],
                    "?"
                );

                redirectToDiscord();
            }
        );


        /*
         * ============================================================
         * Keyboard behavior
         * ============================================================
         *
         * Escape is treated as closing the form.
         */

        document.addEventListener(
            "keydown",
            event => {

                if (event.key === "Escape") {
                    redirectToDiscord();
                }

            }
        );


        /*
         * Prevent accidental context-menu interaction.
         *
         * The original application is a fixed topmost WinForms
         * window rather than a normal browser page.
         */

        document.addEventListener(
            "contextmenu",
            event => {
                event.preventDefault();
            }
        );


        /*
         * Keep the GIF from being dragged around.
         */

        document
            .getElementById("pictureBox1")
            .addEventListener(
                "dragstart",
                event => event.preventDefault()
            );
    </script>

</body>
</html>
