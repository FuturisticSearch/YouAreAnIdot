<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Are You An Idiot?</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            background: #008080;
            overflow: hidden;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family:
                "MS Sans Serif",
                Tahoma,
                Arial,
                sans-serif;

            user-select: none;
        }


        /* ============================================================
           MAIN WINDOW
           ============================================================ */

        #question-window {
            position: absolute;

            width: 928px;
            height: 929px;

            background: #c0c0c0;

            border: 2px solid;
            border-color: #ffffff #000000 #000000 #ffffff;

            box-shadow:
                1px 1px 0 #dfdfdf,
                2px 2px 0 #808080;

            overflow: hidden;
        }


        /* ============================================================
           TITLE BAR
           ============================================================ */

        #titlebar {
            position: absolute;

            left: 3px;
            right: 3px;
            top: 3px;

            height: 25px;

            display: flex;
            align-items: center;

            padding-left: 5px;
            padding-right: 2px;

            background: #000080;

            color: #ffffff;

            font-family:
                "MS Sans Serif",
                Tahoma,
                Arial,
                sans-serif;

            font-size: 13px;
            font-weight: bold;

            cursor: move;
        }

        #title {
            flex: 1;

            pointer-events: none;
        }


        /* Windows 95/98 title buttons */

        .window-button {
            width: 21px;
            height: 21px;

            padding: 0;
            margin-left: 2px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #c0c0c0;

            color: #000000;

            border: 2px solid;
            border-color:
                #ffffff
                #000000
                #000000
                #ffffff;

            font-family: Arial, sans-serif;
            font-size: 12px;
            font-weight: bold;

            line-height: 15px;

            cursor: default;
        }

        .window-button:disabled {
            opacity: 1;
        }


        /* ============================================================
           GIF / PICTURE BOX
           ============================================================ */

        #pictureBox1 {
            position: absolute;

            left: 3px;
            top: 31px;

            width: 918px;
            height: 711px;

            display: block;

            object-fit: fill;

            pointer-events: none;
        }


        /* ============================================================
           QUESTION
           ============================================================ */

        #question-area {
            position: absolute;

            left: 3px;
            right: 3px;

            top: 750px;
            height: 90px;

            display: flex;

            align-items: center;
            justify-content: center;
        }

        #question {
            margin: 0;

            font-family: Verdana, sans-serif;
            font-size: 20px;
            font-weight: normal;

            line-height: 1.2;

            white-space: nowrap;

            color: Indigo;

            text-align: center;
        }


        /* ============================================================
           WIN95/98 ANSWER BUTTONS
           ============================================================ */

        .answer {
            position: absolute;

            top: 860px;
            height: 57px;

            padding: 0;

            background: #c0c0c0;

            color: #000000;

            font-family: Verdana, sans-serif;
            font-size: 12px;
            font-weight: normal;

            border: 2px solid;

            /*
             * Classic raised Win95/98 button.
             */
            border-color:
                #ffffff
                #000000
                #000000
                #ffffff;

            border-radius: 0;

            box-shadow:
                inset 1px 1px 0 #dfdfdf,
                inset -1px -1px 0 #808080;

            cursor: default;

            appearance: none;
            -webkit-appearance: none;
        }

        /*
         * Win95/98 pressed-button appearance.
         */

        .answer:active {
            border-color:
                #000000
                #ffffff
                #ffffff
                #000000;

            box-shadow:
                inset 1px 1px 0 #808080,
                inset -1px -1px 0 #dfdfdf;

            padding-left: 2px;
            padding-top: 2px;
        }

        /*
         * Keep the classic gray appearance instead of modern
         * browser hover effects.
         */

        .answer:hover {
            background: #c0c0c0;
        }

        /*
         * Dotted focus rectangle characteristic of old Windows UI.
         */

        .answer:focus {
            outline: 1px dotted #000000;
            outline-offset: -5px;
        }


        #no {
            left: 28px;
            width: 262px;
        }

        #none {
            left: 298px;
            width: 354px;
        }

        #yes {
            left: 660px;
            width: 244px;
        }


        /* ============================================================
           CUSTOM WINDOWS 95/98 MESSAGE BOX
           ============================================================ */

        #popup-overlay {
            position: fixed;

            inset: 0;

            display: none;

            z-index: 100000;
        }

        #popup-overlay.visible {
            display: block;
        }

        #popup {
            position: fixed;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            min-width: 390px;

            background: #c0c0c0;

            border: 2px solid;
            border-color:
                #ffffff
                #000000
                #000000
                #ffffff;

            box-shadow:
                1px 1px 0 #dfdfdf,
                2px 2px 0 #808080;

            font-family:
                "MS Sans Serif",
                Tahoma,
                Arial,
                sans-serif;
        }

        #popup-titlebar {
            height: 25px;

            display: flex;
            align-items: center;

            padding-left: 5px;
            padding-right: 2px;

            background: #000080;

            color: #ffffff;

            font-size: 13px;
            font-weight: bold;
        }

        #popup-title {
            flex: 1;
        }

        #popup-close {
            width: 21px;
            height: 21px;

            padding: 0;

            background: #c0c0c0;

            border: 2px solid;
            border-color:
                #ffffff
                #000000
                #000000
                #ffffff;

            font-family: Arial, sans-serif;
            font-size: 12px;
            font-weight: bold;

            cursor: default;
        }

        #popup-close:active {
            border-color:
                #000000
                #ffffff
                #ffffff
                #000000;
        }

        #popup-content {
            min-height: 90px;

            display: flex;
            align-items: center;

            padding: 18px;
        }

        #popup-icon {
            width: 32px;
            min-width: 32px;
            height: 32px;

            margin-right: 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, sans-serif;
            font-size: 27px;
            font-weight: bold;
        }

        #popup-message {
            flex: 1;

            font-family:
                "MS Sans Serif",
                Tahoma,
                Arial,
                sans-serif;

            font-size: 13px;

            color: #000000;
        }

        #popup-buttons {
            display: flex;
            justify-content: center;

            gap: 8px;

            padding: 0 12px 14px;
        }

        #popup-buttons button {
            min-width: 75px;
            height: 27px;

            padding: 2px 12px;

            background: #c0c0c0;

            border: 2px solid;
            border-color:
                #ffffff
                #000000
                #000000
                #ffffff;

            box-shadow:
                inset 1px 1px 0 #dfdfdf,
                inset -1px -1px 0 #808080;

            font-family:
                "MS Sans Serif",
                Tahoma,
                Arial,
                sans-serif;

            font-size: 12px;

            color: #000000;

            cursor: default;
        }

        #popup-buttons button:active {
            border-color:
                #000000
                #ffffff
                #ffffff
                #000000;

            box-shadow:
                inset 1px 1px 0 #808080,
                inset -1px -1px 0 #dfdfdf;
        }

        #popup-buttons button:focus {
            outline: 1px dotted #000000;
            outline-offset: -5px;
        }


        /* ============================================================
           SMALL SCREENS
           ============================================================ */

        @media (max-width: 928px), (max-height: 929px) {

            #question-window {
                transform-origin: center center;

                transform:
                    scale(
                        min(
                            calc(100vw / 932),
                            calc(100vh / 933)
                        )
                    );
            }
        }
    </style>
</head>

<body>

    <!-- ============================================================
         MAIN WINDOW
         ============================================================ -->

    <main id="question-window">

        <div id="titlebar">

            <span id="title">
                Are You An Idiot?
            </span>

            <button
                class="window-button"
                id="minimize"
                type="button"
                disabled
            >_</button>

            <button
                class="window-button"
                id="maximize"
                type="button"
                disabled
            >□</button>

            <button
                class="window-button"
                id="close"
                type="button"
            >×</button>

        </div>


        <img
            id="pictureBox1"
            src="media/idiot.gif"
            alt=""
            draggable="false"
        >


        <div id="question-area">
            <div id="question">
                Are You An Idiot ?
            </div>
        </div>


        <button
            class="answer"
            id="no"
            type="button"
        >
            No, I'm not.
        </button>

        <button
            class="answer"
            id="none"
            type="button"
        >
            I don't know =[
        </button>

        <button
            class="answer"
            id="yes"
            type="button"
        >
            Yes, I am.
        </button>

    </main>


    <!-- ============================================================
         CUSTOM MESSAGE BOX
         ============================================================ -->

    <div id="popup-overlay">

        <div id="popup">

            <div id="popup-titlebar">

                <span id="popup-title">
                    YouAreAnIdiot
                </span>

                <button
                    id="popup-close"
                    type="button"
                >×</button>

            </div>

            <div id="popup-content">

                <div id="popup-icon">!</div>

                <div id="popup-message"></div>

            </div>

            <div id="popup-buttons"></div>

        </div>

    </div>


    <!-- ============================================================
         AUDIO
         ============================================================ -->

    <audio
        id="idiot-audio"
        preload="auto"
        loop
    >
        <source
            src="/media/youare-long.mp3"
            type="audio/mpeg"
        >
    </audio>


    <script>
        "use strict";


        /* ============================================================
           ELEMENTS
           ============================================================ */

        const question =
            document.getElementById("question");

        const noButton =
            document.getElementById("no");

        const noneButton =
            document.getElementById("none");

        const yesButton =
            document.getElementById("yes");

        const closeButton =
            document.getElementById("close");

        const idiotAudio =
            document.getElementById("idiot-audio");

        const popupOverlay =
            document.getElementById("popup-overlay");

        const popupMessage =
            document.getElementById("popup-message");

        const popupButtons =
            document.getElementById("popup-buttons");

        const popupClose =
            document.getElementById("popup-close");

        const questionWindow =
            document.getElementById("question-window");

        const titlebar =
            document.getElementById("titlebar");


        /* ============================================================
           RAINBOW TEXT
           ============================================================ */

        const fontColors = [
            "Indigo",
            "Ivory",
            "LightPink",
            "LightSkyBlue",
            "Lime",
            "MediumPurple",
            "MediumSpringGreen",
            "Pink",
            "Red",
            "Snow"
        ];

        let timerFT = 0;

        setInterval(() => {

            timerFT++;

            if (timerFT >= 1 && timerFT <= 9) {
                question.style.color =
                    fontColors[timerFT];
            }

            if (timerFT >= 9) {

                question.style.color =
                    "Snow";

                timerFT = 0;
            }

        }, 55);


        /* ============================================================
           AUDIO
           ============================================================ */

        function playAudio() {

            idiotAudio
                .play()
                .catch(() => {
                    // Browser blocked autoplay.
                });
        }

        playAudio();

        document.addEventListener(
            "pointerdown",
            () => {
                playAudio();
            },
            { once: true }
        );


        /* ============================================================
           CUSTOM MESSAGE BOX
           ============================================================ */

        let popupResolver = null;

        function showPopup(message, buttons, icon = "!") {

            popupMessage.textContent =
                message;

            document.getElementById(
                "popup-icon"
            ).textContent = icon;

            popupButtons.innerHTML = "";

            popupOverlay.classList.add(
                "visible"
            );

            return new Promise(resolve => {

                popupResolver = resolve;

                for (const text of buttons) {

                    const button =
                        document.createElement("button");

                    button.type = "button";

                    button.textContent =
                        text;

                    button.addEventListener(
                        "click",
                        () => {
                            closePopup(text);
                        }
                    );

                    popupButtons.appendChild(
                        button
                    );
                }

                const firstButton =
                    popupButtons.querySelector(
                        "button"
                    );

                if (firstButton) {
                    firstButton.focus();
                }
            });
        }


        function closePopup(result = "Close") {

            popupOverlay.classList.remove(
                "visible"
            );

            if (popupResolver) {

                const resolve =
                    popupResolver;

                popupResolver = null;

                resolve(result);
            }
        }


        popupClose.addEventListener(
            "click",
            () => {
                closePopup("Close");
            }
        );


        /* ============================================================
           REDIRECT
           ============================================================ */

        let redirecting = false;

        function redirectToDiscord() {

            if (redirecting) {
                return;
            }

            redirecting = true;

            window.location.href =
                "discord.html";
        }


        /* ============================================================
           NO / I DON'T KNOW
           ============================================================ */

        async function handleNo() {

            if (redirecting) {
                return;
            }

            await showPopup(
                "Oh... I think you are an idiot. XD",
                ["OK"],
                "!"
            );

            redirectToDiscord();
        }


        noButton.addEventListener(
            "click",
            handleNo
        );

        noneButton.addEventListener(
            "click",
            handleNo
        );


        /* ============================================================
           YES
           ============================================================ */

        yesButton.addEventListener(
            "click",
            async () => {

                if (redirecting) {
                    return;
                }

                await showPopup(
                    "Are you sure?",
                    ["Yes", "No"],
                    "?"
                );

                redirectToDiscord();
            }
        );


        /* ============================================================
           CLOSE
           ============================================================ */

        closeButton.addEventListener(
            "click",
            redirectToDiscord
        );


        /* ============================================================
           DISABLE MINIMIZE / MAXIMIZE
           ============================================================ */

        document.getElementById(
            "minimize"
        ).disabled = true;

        document.getElementById(
            "maximize"
        ).disabled = true;


        /* ============================================================
           ESCAPE
           ============================================================ */

        document.addEventListener(
            "keydown",
            event => {

                if (event.key === "Escape") {
                    redirectToDiscord();
                }

            }
        );


        /* ============================================================
           RIGHT CLICK
           ============================================================ */

        document.addEventListener(
            "contextmenu",
            event => {
                event.preventDefault();
            }
        );


        /* ============================================================
           DRAGGABLE WINDOW
           ============================================================
           
           Only the blue title bar is draggable.
           
           The window itself uses absolute positioning, so moving it
           doesn't cause the page to scroll or move.
           ============================================================ */

        let dragging = false;

        let dragOffsetX = 0;
        let dragOffsetY = 0;


        titlebar.addEventListener(
            "pointerdown",
            event => {

                /*
                 * Don't start dragging when clicking a title-bar button.
                 */

                if (
                    event.target.closest(
                        ".window-button"
                    )
                ) {
                    return;
                }

                dragging = true;

                const rect =
                    questionWindow.getBoundingClientRect();

                dragOffsetX =
                    event.clientX - rect.left;

                dragOffsetY =
                    event.clientY - rect.top;

                titlebar.setPointerCapture(
                    event.pointerId
                );

                event.preventDefault();
            }
        );


        titlebar.addEventListener(
            "pointermove",
            event => {

                if (!dragging) {
                    return;
                }

                /*
                 * Account for the current visual scale on small
                 * screens.
                 */

                const scale =
                    questionWindow.getBoundingClientRect().width /
                    questionWindow.offsetWidth;

                const newLeft =
                    event.clientX -
                    (dragOffsetX * scale);

                const newTop =
                    event.clientY -
                    (dragOffsetY * scale);


                questionWindow.style.left =
                    `${newLeft}px`;

                questionWindow.style.top =
                    `${newTop}px`;

                /*
                 * Once manually dragged, stop using the body's
                 * flex centering.
                 */

                questionWindow.style.margin =
                    "0";

                questionWindow.style.transform =
                    `scale(${scale})`;
            }
        );


        function stopDragging(event) {

            if (!dragging) {
                return;
            }

            dragging = false;

            try {
                titlebar.releasePointerCapture(
                    event.pointerId
                );
            } catch (_) {
                // Pointer capture may already have been released.
            }
        }


        titlebar.addEventListener(
            "pointerup",
            stopDragging
        );

        titlebar.addEventListener(
            "pointercancel",
            stopDragging
        );


        /*
         * Prevent dragging the GIF itself.
         */

        document
            .getElementById("pictureBox1")
            .addEventListener(
                "dragstart",
                event => {
                    event.preventDefault();
                }
            );
    </script>

</body>
</html>
