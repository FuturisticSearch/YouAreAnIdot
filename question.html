<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Are You An Idiot?</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            background: #008080;
            overflow: hidden;

            font-family:
                "MS Sans Serif",
                Tahoma,
                Arial,
                sans-serif;

            user-select: none;
            -webkit-user-select: none;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ============================================================
           MAIN WINDOW
           ============================================================ */

        #question-window {
            position: absolute;

            width: 928px;
            height: 929px;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%)
                scale(1);

            transform-origin: center center;

            background: #c0c0c0;

            border: 2px solid;
            border-color:
                #ffffff
                #000000
                #000000
                #ffffff;

            box-shadow:
                1px 1px 0 #dfdfdf,
                2px 2px 0 #808080;

            overflow: hidden;
        }

        /* ============================================================
           TITLE BAR
           ============================================================ */

        #titlebar {
            position: absolute;

            left: 3px;
            right: 3px;
            top: 3px;

            height: 25px;

            display: flex;
            align-items: center;

            padding-left: 5px;
            padding-right: 2px;

            background: #000080;

            color: #ffffff;

            font-family:
                "MS Sans Serif",
                Tahoma,
                Arial,
                sans-serif;

            font-size: 13px;
            font-weight: bold;

            cursor: move;

            touch-action: none;
        }

        #title {
            flex: 1;
            pointer-events: none;
        }

        /* ============================================================
           TITLE BAR BUTTONS
           ============================================================ */

        .window-button {
            width: 21px;
            height: 21px;

            padding: 0;
            margin-left: 2px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #c0c0c0;
            color: #000000;

            border: 2px solid;
            border-color:
                #ffffff
                #000000
                #000000
                #ffffff;

            font-family: Arial, sans-serif;
            font-size: 12px;
            font-weight: bold;

            line-height: 15px;

            cursor: default;

            appearance: none;
            -webkit-appearance: none;
        }

        .window-button:active {
            border-color:
                #000000
                #ffffff
                #ffffff
                #000000;
        }

        .window-button:disabled {
            opacity: 1;
        }

        /* ============================================================
           GIF
           ============================================================ */

        #pictureBox1 {
            position: absolute;

            left: 3px;
            top: 31px;

            width: 918px;
            height: 711px;

            display: block;

            object-fit: fill;

            pointer-events: none;
        }

        /* ============================================================
           QUESTION
           ============================================================ */

        #question-area {
            position: absolute;

            left: 3px;
            right: 3px;

            top: 750px;
            height: 90px;

            display: flex;

            align-items: center;
            justify-content: center;
        }

        #question {
            margin: 0;

            font-family: Verdana, sans-serif;
            font-size: 20px;
            font-weight: normal;

            line-height: 1.2;

            white-space: nowrap;

            color: Indigo;

            text-align: center;
        }

        /* ============================================================
           ANSWER BUTTONS
           ============================================================ */

        .answer {
            position: absolute;

            top: 860px;
            height: 57px;

            padding: 0;

            background: #c0c0c0;
            color: #000000;

            font-family: Verdana, sans-serif;
            font-size: 12px;
            font-weight: normal;

            border: 2px solid;

            border-color:
                #ffffff
                #000000
                #000000
                #ffffff;

            border-radius: 0;

            box-shadow:
                inset 1px 1px 0 #dfdfdf,
                inset -1px -1px 0 #808080;

            cursor: default;

            appearance: none;
            -webkit-appearance: none;
        }

        .answer:hover {
            background: #c0c0c0;
        }

        .answer:active {
            border-color:
                #000000
                #ffffff
                #ffffff
                #000000;

            box-shadow:
                inset 1px 1px 0 #808080,
                inset -1px -1px 0 #dfdfdf;

            padding-left: 2px;
            padding-top: 2px;
        }

        .answer:focus {
            outline: 1px dotted #000000;
            outline-offset: -5px;
        }

        #no {
            left: 28px;
            width: 262px;
        }

        #none {
            left: 298px;
            width: 354px;
        }

        #yes {
            left: 660px;
            width: 244px;
        }

        /* ============================================================
           CUSTOM MESSAGE BOX
           ============================================================ */

        #popup-overlay {
            position: fixed;

            inset: 0;

            display: none;

            z-index: 100000;
        }

        #popup-overlay.visible {
            display: block;
        }

        #popup {
            position: fixed;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            min-width: 390px;
            max-width: min(500px, calc(100vw - 30px));

            background: #c0c0c0;

            border: 2px solid;
            border-color:
                #ffffff
                #000000
                #000000
                #ffffff;

            box-shadow:
                1px 1px 0 #dfdfdf,
                2px 2px 0 #808080;

            font-family:
                "MS Sans Serif",
                Tahoma,
                Arial,
                sans-serif;
        }

        #popup-titlebar {
            height: 25px;

            display: flex;
            align-items: center;

            padding-left: 5px;
            padding-right: 2px;

            background: #000080;

            color: #ffffff;

            font-size: 13px;
            font-weight: bold;
        }

        #popup-title {
            flex: 1;
        }

        #popup-close {
            width: 21px;
            height: 21px;

            padding: 0;

            background: #c0c0c0;

            border: 2px solid;
            border-color:
                #ffffff
                #000000
                #000000
                #ffffff;

            font-family: Arial, sans-serif;
            font-size: 12px;
            font-weight: bold;

            cursor: default;
        }

        #popup-close:active {
            border-color:
                #000000
                #ffffff
                #ffffff
                #000000;
        }

        #popup-content {
            min-height: 90px;

            display: flex;
            align-items: center;

            padding: 18px;
        }

        #popup-icon {
            width: 32px;
            min-width: 32px;
            height: 32px;

            margin-right: 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, sans-serif;
            font-size: 27px;
            font-weight: bold;
        }

        #popup-message {
            flex: 1;

            font-family:
                "MS Sans Serif",
                Tahoma,
                Arial,
                sans-serif;

            font-size: 13px;

            color: #000000;

            line-height: 1.35;
        }

        #popup-buttons {
            display: flex;
            justify-content: center;

            gap: 8px;

            padding: 0 12px 14px;
        }

        #popup-buttons button {
            min-width: 75px;
            height: 27px;

            padding: 2px 12px;

            background: #c0c0c0;

            border: 2px solid;
            border-color:
                #ffffff
                #000000
                #000000
                #ffffff;

            box-shadow:
                inset 1px 1px 0 #dfdfdf,
                inset -1px -1px 0 #808080;

            font-family:
                "MS Sans Serif",
                Tahoma,
                Arial,
                sans-serif;

            font-size: 12px;

            color: #000000;
        }

        #popup-buttons button:active {
            border-color:
                #000000
                #ffffff
                #ffffff
                #000000;

            box-shadow:
                inset 1px 1px 0 #808080,
                inset -1px -1px 0 #dfdfdf;
        }

        #popup-buttons button:focus {
            outline: 1px dotted #000000;
            outline-offset: -5px;
        }
    </style>
</head>

<body>

    <!-- ============================================================
         MAIN WINDOW
         ============================================================ -->

    <main id="question-window">

        <div id="titlebar">

            <span id="title">
                Are You An Idiot?
            </span>

            <button
                class="window-button"
                id="minimize"
                type="button"
                disabled
            >_</button>

            <button
                class="window-button"
                id="maximize"
                type="button"
                disabled
            >□</button>

            <button
                class="window-button"
                id="close"
                type="button"
            >×</button>

        </div>

        <img
            id="pictureBox1"
            src="media/idiot.gif"
            alt=""
            draggable="false"
        >

        <div id="question-area">
            <div id="question">
                Are You An Idiot ?
            </div>
        </div>

        <button
            class="answer"
            id="no"
            type="button"
        >
            No, I'm not.
        </button>

        <button
            class="answer"
            id="none"
            type="button"
        >
            I don't know =[
        </button>

        <button
            class="answer"
            id="yes"
            type="button"
        >
            Yes, I am.
        </button>

    </main>


    <!-- ============================================================
         CUSTOM MESSAGE BOX
         ============================================================ -->

    <div id="popup-overlay">

        <div id="popup">

            <div id="popup-titlebar">

                <span id="popup-title">
                    YouAreAnIdiot
                </span>

                <button
                    id="popup-close"
                    type="button"
                >×</button>

            </div>

            <div id="popup-content">

                <div id="popup-icon">!</div>

                <div id="popup-message"></div>

            </div>

            <div id="popup-buttons"></div>

        </div>

    </div>


    <!-- ============================================================
         AUDIO
         ============================================================ -->

    <audio
        id="idiot-audio"
        preload="auto"
        loop
    >
        <source
            src="/media/youare-long.mp3"
            type="audio/mpeg"
        >
    </audio>


    <script>
        "use strict";


        /* ============================================================
           ELEMENTS
           ============================================================ */

        const question =
            document.getElementById("question");

        const noButton =
            document.getElementById("no");

        const noneButton =
            document.getElementById("none");

        const yesButton =
            document.getElementById("yes");

        const closeButton =
            document.getElementById("close");

        const idiotAudio =
            document.getElementById("idiot-audio");

        const popupOverlay =
            document.getElementById("popup-overlay");

        const popupMessage =
            document.getElementById("popup-message");

        const popupButtons =
            document.getElementById("popup-buttons");

        const popupClose =
            document.getElementById("popup-close");

        const questionWindow =
            document.getElementById("question-window");

        const titlebar =
            document.getElementById("titlebar");


        /* ============================================================
           RESPONSIVE WINDOW SCALING
           ============================================================ */

        const BASE_WIDTH = 928;
        const BASE_HEIGHT = 929;

        let scale = 1;

        let windowX = 0;
        let windowY = 0;

        let manuallyPositioned = false;


        function updateScale() {

            const viewportWidth =
                window.innerWidth;

            const viewportHeight =
                window.innerHeight;

            const availableWidth =
                Math.max(1, viewportWidth - 4);

            const availableHeight =
                Math.max(1, viewportHeight - 4);

            scale = Math.min(
                availableWidth / BASE_WIDTH,
                availableHeight / BASE_HEIGHT
            );

            scale = Math.min(scale, 1);


            if (!manuallyPositioned) {

                questionWindow.style.left = "50%";
                questionWindow.style.top = "50%";

                questionWindow.style.transform =
                    `translate(-50%, -50%) scale(${scale})`;

            } else {

                questionWindow.style.transform =
                    `scale(${scale})`;

                const renderedWidth =
                    BASE_WIDTH * scale;

                const renderedHeight =
                    BASE_HEIGHT * scale;

                const maxX =
                    Math.max(
                        0,
                        viewportWidth - renderedWidth
                    );

                const maxY =
                    Math.max(
                        0,
                        viewportHeight - renderedHeight
                    );

                windowX =
                    Math.min(
                        Math.max(windowX, 0),
                        maxX
                    );

                windowY =
                    Math.min(
                        Math.max(windowY, 0),
                        maxY
                    );

                questionWindow.style.left =
                    `${windowX}px`;

                questionWindow.style.top =
                    `${windowY}px`;
            }
        }


        updateScale();

        window.addEventListener(
            "resize",
            updateScale
        );

        window.addEventListener(
            "orientationchange",
            () => {
                setTimeout(updateScale, 50);
            }
        );


        /* ============================================================
           POPUP BLOCKER TEST
           ============================================================

           Three popup windows are opened immediately and then closed.

           IMPORTANT:
           window.open() returns:
             - Window object -> popup was permitted
             - null          -> popup was blocked

           We deliberately do exactly THREE attempts.

           No retry loop is used.
           ============================================================ */

        let popupTestComplete = false;


        function testPopupPermission() {

            if (popupTestComplete) {
                return true;
            }

            popupTestComplete = true;

            let allAllowed = true;

            const testWindows = [];


            for (let i = 0; i < 3; i++) {

                let testWindow = null;

                try {

                    testWindow = window.open(
                        "about:blank",
                        `youare_popup_test_${i}`,
                        "width=1,height=1,left=-10000,top=-10000"
                    );

                } catch (_) {

                    testWindow = null;
                }


                if (!testWindow) {

                    allAllowed = false;

                } else {

                    testWindows.push(
                        testWindow
                    );
                }
            }


            /*
             * Close every successfully opened test window
             * immediately.
             */

            for (const testWindow of testWindows) {

                try {
                    testWindow.close();
                } catch (_) {
                    /*
                     * Ignore a browser refusing the close.
                     */
                }
            }


            return allAllowed;
        }


        /* ============================================================
           RAINBOW QUESTION
           ============================================================ */

        const fontColors = [
            "Indigo",
            "Ivory",
            "LightPink",
            "LightSkyBlue",
            "Lime",
            "MediumPurple",
            "MediumSpringGreen",
            "Pink",
            "Red",
            "Snow"
        ];

        let timerFT = 0;


        setInterval(() => {

            timerFT++;

            if (
                timerFT >= 1 &&
                timerFT <= 9
            ) {
                question.style.color =
                    fontColors[timerFT];
            }

            if (timerFT >= 9) {

                question.style.color =
                    "Snow";

                timerFT = 0;
            }

        }, 55);


        /* ============================================================
           AUDIO
           ============================================================ */

        function playAudio() {

            idiotAudio
                .play()
                .catch(() => {
                    /*
                     * Mobile browsers commonly block autoplay.
                     */
                });
        }


        playAudio();


        document.addEventListener(
            "pointerdown",
            () => {
                playAudio();
            },
            { once: true }
        );


        /* ============================================================
           CUSTOM MESSAGE BOX
           ============================================================ */

        let popupResolver = null;


        function showPopup(
            message,
            buttons,
            icon = "!"
        ) {

            popupMessage.textContent =
                message;

            document.getElementById(
                "popup-icon"
            ).textContent = icon;

            popupButtons.innerHTML = "";

            popupOverlay.classList.add(
                "visible"
            );


            return new Promise(resolve => {

                popupResolver = resolve;


                for (const text of buttons) {

                    const button =
                        document.createElement(
                            "button"
                        );

                    button.type = "button";

                    button.textContent =
                        text;

                    button.addEventListener(
                        "click",
                        () => {
                            closePopup(text);
                        }
                    );

                    popupButtons.appendChild(
                        button
                    );
                }


                const firstButton =
                    popupButtons.querySelector(
                        "button"
                    );

                if (firstButton) {
                    firstButton.focus();
                }
            });
        }


        function closePopup(
            result = "Close"
        ) {

            popupOverlay.classList.remove(
                "visible"
            );


            if (popupResolver) {

                const resolve =
                    popupResolver;

                popupResolver = null;

                resolve(result);
            }
        }


        popupClose.addEventListener(
            "click",
            () => {
                closePopup("Close");
            }
        );


        /* ============================================================
           POPUP BLOCKER MESSAGE
           ============================================================ */

        async function showPopupBlockedMessage() {

            await showPopup(
                "This recreation requires pop-up windows to be enabled in your browser. Please allow pop-ups for this site and reload the page.",
                ["OK"],
                "!"
            );
        }


        /*
         * Run the popup test as soon as the page has loaded.
         *
         * If all three test windows were successfully opened,
         * nothing else happens and the page continues normally.
         *
         * If even one was blocked, display the custom 95/98-style
         * message box.
         */

        window.addEventListener(
            "load",
            () => {

                const popupsAllowed =
                    testPopupPermission();

                if (!popupsAllowed) {

                    showPopupBlockedMessage();
                }
            },
            { once: true }
        );


        /* ============================================================
           REDIRECT
           ============================================================ */

        let redirecting = false;


        function redirectToDiscord() {

            if (redirecting) {
                return;
            }

            redirecting = true;

            window.location.href =
                "discord.html";
        }


        /* ============================================================
           NO / I DON'T KNOW
           ============================================================ */

        async function handleNo() {

            if (redirecting) {
                return;
            }

            await showPopup(
                "Oh... I think you are an idiot. XD",
                ["OK"],
                "!"
            );

            redirectToDiscord();
        }


        noButton.addEventListener(
            "click",
            handleNo
        );

        noneButton.addEventListener(
            "click",
            handleNo
        );


        /* ============================================================
           YES
           ============================================================ */

        yesButton.addEventListener(
            "click",
            async () => {

                if (redirecting) {
                    return;
                }

                await showPopup(
                    "Are you sure?",
                    ["Yes", "No"],
                    "?"
                );

                redirectToDiscord();
            }
        );


        /* ============================================================
           CLOSE
           ============================================================ */

        closeButton.addEventListener(
            "click",
            redirectToDiscord
        );


        /* ============================================================
           ESCAPE
           ============================================================ */

        document.addEventListener(
            "keydown",
            event => {

                if (event.key === "Escape") {
                    redirectToDiscord();
                }

            }
        );


        /* ============================================================
           RIGHT CLICK
           ============================================================ */

        document.addEventListener(
            "contextmenu",
            event => {
                event.preventDefault();
            }
        );


        /* ============================================================
           DRAGGABLE WINDOW
           ============================================================ */

        let dragging = false;

        let dragPointerId = null;

        let dragStartPointerX = 0;
        let dragStartPointerY = 0;

        let dragStartWindowX = 0;
        let dragStartWindowY = 0;


        titlebar.addEventListener(
            "pointerdown",
            event => {

                if (
                    event.target.closest(
                        ".window-button"
                    )
                ) {
                    return;
                }


                dragging = true;

                dragPointerId =
                    event.pointerId;


                if (!manuallyPositioned) {

                    const rect =
                        questionWindow.getBoundingClientRect();

                    windowX =
                        rect.left;

                    windowY =
                        rect.top;

                    manuallyPositioned = true;

                    questionWindow.style.left =
                        `${windowX}px`;

                    questionWindow.style.top =
                        `${windowY}px`;

                    questionWindow.style.transform =
                        `scale(${scale})`;
                }


                dragStartPointerX =
                    event.clientX;

                dragStartPointerY =
                    event.clientY;

                dragStartWindowX =
                    windowX;

                dragStartWindowY =
                    windowY;


                titlebar.setPointerCapture(
                    event.pointerId
                );

                event.preventDefault();
            }
        );


        titlebar.addEventListener(
            "pointermove",
            event => {

                if (
                    !dragging ||
                    event.pointerId !== dragPointerId
                ) {
                    return;
                }


                windowX =
                    dragStartWindowX +
                    (
                        event.clientX -
                        dragStartPointerX
                    );

                windowY =
                    dragStartWindowY +
                    (
                        event.clientY -
                        dragStartPointerY
                    );


                const renderedWidth =
                    BASE_WIDTH * scale;

                const renderedHeight =
                    BASE_HEIGHT * scale;


                const minVisible =
                    Math.min(
                        30,
                        renderedWidth
                    );

                const minVisibleY =
                    Math.min(
                        30,
                        renderedHeight
                    );


                const minX =
                    -renderedWidth +
                    minVisible;

                const maxX =
                    window.innerWidth -
                    minVisible;


                const minY =
                    -renderedHeight +
                    minVisibleY;

                const maxY =
                    window.innerHeight -
                    minVisibleY;


                windowX =
                    Math.min(
                        Math.max(windowX, minX),
                        maxX
                    );

                windowY =
                    Math.min(
                        Math.max(windowY, minY),
                        maxY
                    );


                questionWindow.style.left =
                    `${windowX}px`;

                questionWindow.style.top =
                    `${windowY}px`;

                questionWindow.style.transform =
                    `scale(${scale})`;
            }
        );


        function stopDragging(event) {

            if (
                !dragging ||
                event.pointerId !== dragPointerId
            ) {
                return;
            }


            dragging = false;

            dragPointerId = null;


            try {

                titlebar.releasePointerCapture(
                    event.pointerId
                );

            } catch (_) {
                /*
                 * Pointer capture may already have been released.
                 */
            }
        }


        titlebar.addEventListener(
            "pointerup",
            stopDragging
        );

        titlebar.addEventListener(
            "pointercancel",
            stopDragging
        );


        /* ============================================================
           PREVENT GIF DRAGGING
           ============================================================ */

        document
            .getElementById("pictureBox1")
            .addEventListener(
                "dragstart",
                event => {
                    event.preventDefault();
                }
            );

    </script>

</body>
</html>
