<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Popup Test</title>
</head>

<body>
<script>
"use strict";

(function () {
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");

    /*
     * Only send a result for one of the expected test IDs.
     */
    if (!["0", "1", "2"].includes(String(id))) {
        return;
    }

    function reportSuccess() {
        if (!window.opener || window.opener.closed) {
            return;
        }

        try {
            window.opener.postMessage(
                {
                    type: "YOUARE_POPUP_TEST_SUCCESS",
                    id: String(id)
                },
                window.location.origin
            );
        } catch (_) {
            return;
        }

        /*
         * This window has completed its job.
         * Close it so the user doesn't get three tiny windows.
         */
        setTimeout(() => {
            try {
                window.close();
            } catch (_) {
                /* Ignore close failures. */
            }
        }, 50);
    }

    /*
     * Wait until this popup has actually loaded.
     */
    if (document.readyState === "loading") {
        window.addEventListener(
            "DOMContentLoaded",
            reportSuccess,
            { once: true }
        );
    } else {
        reportSuccess();
    }
})();
</script>
</body>
</html>
