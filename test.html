<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8"><meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Popup Test</title>

</head><body><script>
"use strict";

/*
 * Read our assigned popup ID.
 */
const params =
    new URLSearchParams(
        window.location.search
    );

const id =
    params.get("id");


/*
 * Only valid popup-test windows
 * are allowed to report success.
 */
if (
    ["0", "1", "2"].includes(id) &&
    window.opener &&
    !window.opener.closed
) {

    /*
     * Tell the original page that this
     * particular popup successfully loaded.
     */
    window.opener.postMessage(
        {
            type:
                "YOUARE_POPUP_TEST_SUCCESS",

            id:
                id
        },

        window.location.origin
    );


    /*
     * First let the message get queued.
     *
     * Then try to close ourselves.
     *
     * The parent page also attempts to close
     * this exact window when it receives the
     * success message, so there are two chances
     * to close it.
     */
    setTimeout(
        () => {

            try {

                window.close();

            } catch (_) {

                /*
                 * Ignore close failures.
                 *
                 * The parent page will also try
                 * to close this exact window.
                 */

            }

        },
        0
    );

}
</script></body>
</html>
