<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Popup Test</title>
</head>

<body>
<script>
"use strict";

const params = new URLSearchParams(window.location.search);
const id = params.get("id");

/*
 * Only accept the IDs created by question.html.
 */
if (["0", "1", "2"].includes(String(id))) {

    /*
     * Tell the opener that this popup actually loaded.
     */
    if (window.opener && !window.opener.closed) {

        window.opener.postMessage(
            {
                type: "YOUARE_POPUP_TEST_SUCCESS",
                id: String(id)
            },
            window.location.origin
        );
    }

    /*
     * Give postMessage a moment to leave this document,
     * then try to close ourselves.
     */
    setTimeout(() => {

        try {
            window.close();
        } catch (_) {
            /* Parent page will try to close us as fallback. */
        }

    }, 50);
}
</script>
</body>
</html>
