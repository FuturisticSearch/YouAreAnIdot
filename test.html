<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Popup Test</title>
</head>
<body><script>
"use strict";

/*
 * Read the ID assigned by the parent page.
 */
const params = new URLSearchParams(window.location.search);
const id = params.get("id");

/*
 * Only report valid test IDs.
 */
if (["0", "1", "2"].includes(id)) {

    /*
     * Tell the opener that this popup actually loaded.
     *
     * opener.postMessage() is used instead of relying on
     * window.open() returning a usable Window object.
     */
    if (window.opener && !window.opener.closed) {

        window.opener.postMessage(
            {
                type: "YOUARE_POPUP_TEST_SUCCESS",
                id: id
            },
            window.location.origin
        );
    }

    /*
     * Do NOT immediately close this window.
     *
     * Some browsers, especially Firefox-based browsers,
     * may delay/reopen popup windows after the permission
     * is changed. Keeping this page alive allows the
     * communication above to complete reliably.
     */
}
</script></body>
</html>
