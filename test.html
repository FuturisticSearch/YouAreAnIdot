<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Popup Test</title>
</head><body><script>
"use strict";

const params = new URLSearchParams(
    window.location.search
);

const id = params.get("id");

if (
    ["0", "1", "2"].includes(id) &&
    window.opener &&
    !window.opener.closed
) {

    /*
     * First report successful loading to the
     * original window.
     */
    window.opener.postMessage(
        {
            type: "YOUARE_POPUP_TEST_SUCCESS",
            id: id
        },
        window.location.origin
    );

    /*
     * Close on the next event-loop turn.
     *
     * This lets the postMessage event get queued
     * before this popup disappears.
     */
    setTimeout(() => {

        try {
            window.close();
        } catch (_) {
            /* Ignore browsers that refuse the close. */
        }

    }, 0);
}
</script></body>
</html>
