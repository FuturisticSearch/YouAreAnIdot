<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>You Are An Idiot!</title>

<link rel="preload" href="/media/idiot.gif" as="image">
<link rel="preload" href="/media/youare-long.mp3" as="audio">

<script src="scripts/app.js" defer></script>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}
body{
    display:flex;
    align-items:center;
    justify-content:center;
}
img{
    width:100%;
    height:100%;
    object-fit:contain;
    user-select:none;
    -webkit-user-drag:none;
}
</style>
</head>

<body>

<img src="/media/idiot.gif" alt="You Are An Idiot!">

<audio id="youare-audio" preload="auto" loop hidden>
    <source src="/media/youare-long.mp3" type="audio/mpeg">
</audio>

<script>
"use strict";

const audio = document.getElementById("youare-audio");
const channel = new BroadcastChannel("youare-idiot-audio");

const id =
    Date.now().toString(36) +
    Math.random().toString(36).slice(2);

const HEARTBEAT = 20;
const TIMEOUT = 150;
const SYNC = 0.08;

let leader = null;
let lastBeat = 0;
let remoteTime = 0;
let remoteStamp = 0;
let isLeader = false;
let dead = false;
let beatTimer = null;


/* ================= AUDIO ================= */

audio.muted = true;
audio.volume = 0;

try {
    audio.load();
} catch (_) {}


function duration() {
    return Number.isFinite(audio.duration) && audio.duration > 0
        ? audio.duration
        : 0;
}


function now() {
    return Number.isFinite(audio.currentTime)
        ? audio.currentTime
        : 0;
}


function normalize(t) {
    const d = duration();

    return d
        ? ((t % d) + d) % d
        : Math.max(0, t);
}


function remotePosition() {
    return normalize(
        remoteTime +
        Math.min(
            1,
            Math.max(
                0,
                (performance.now() - remoteStamp) / 1000
            )
        )
    );
}


/* ================= PLAY SILENT ================= */

async function playSilent() {

    if (dead || !audio.paused)
        return;

    audio.muted = true;
    audio.volume = 0;

    try {
        await audio.play();
    } catch (_) {}
}


/* ================= SYNC ================= */

function sync() {

    if (
        isLeader ||
        leader === null ||
        !duration()
    )
        return;

    const target = remotePosition();
    const current = now();
    const d = duration();

    let diff = Math.abs(target - current);

    diff = Math.min(diff, d - diff);

    if (diff > SYNC) {
        try {
            audio.currentTime = target;
        } catch (_) {}
    }
}


/* ================= HEARTBEAT ================= */

function heartbeat() {

    if (dead || !isLeader)
        return;

    const stamp = performance.now();
    const time = now();

    remoteTime = time;
    remoteStamp = stamp;

    channel.postMessage({
        type: "beat",
        id,
        time,
        stamp
    });
}


function startHeartbeat() {

    clearInterval(beatTimer);

    heartbeat();

    beatTimer = setInterval(
        heartbeat,
        HEARTBEAT
    );
}


/* ================= LEADER ================= */

async function becomeLeader() {

    if (
        dead ||
        isLeader
    )
        return;

    /*
     * Tell everyone immediately.
     */
    channel.postMessage({
        type: "claim",
        id
    });

    leader = id;
    isLeader = true;

    /*
     * First window starts at 0.
     * A takeover uses the last known position.
     */
    if (duration() && remoteStamp) {
        try {
            audio.currentTime = remotePosition();
        } catch (_) {}
    }

    await playSilent();

    if (dead || !isLeader)
        return;

    audio.muted = false;
    audio.volume = 1;

    startHeartbeat();
}


function stopLeader() {

    if (!isLeader)
        return;

    isLeader = false;

    clearInterval(beatTimer);
    beatTimer = null;

    audio.muted = true;
    audio.volume = 0;
}


/* ================= MESSAGES ================= */

channel.onmessage = event => {

    const m = event.data;

    if (
        !m ||
        !m.type ||
        m.id === id
    )
        return;


    /* ---------- HEARTBEAT ---------- */

    if (m.type === "beat") {

        const other = String(m.id);

        /*
         * If two leaders exist, smaller ID wins.
         */
        if (isLeader) {

            if (other < id) {
                stopLeader();
            } else {
                heartbeat();
                return;
            }
        }

        leader = other;
        lastBeat = performance.now();

        remoteTime = Number(m.time) || 0;
        remoteStamp = Number(m.stamp) || performance.now();

        sync();
        playSilent();

        return;
    }


    /* ---------- CLAIM ---------- */

    if (m.type === "claim") {

        const other = String(m.id);

        /*
         * Deterministic winner if multiple windows claim.
         */
        if (isLeader) {

            if (other < id) {
                stopLeader();
            } else {
                heartbeat();
                return;
            }
        }

        leader = other;
        lastBeat = performance.now();

        audio.muted = true;
        audio.volume = 0;

        sync();
        playSilent();

        return;
    }


    /* ---------- DISCOVER ---------- */

    if (m.type === "discover") {

        if (isLeader)
            heartbeat();

        return;
    }


    /* ---------- LEADER CLOSED ---------- */

    if (m.type === "closing") {

        if (String(m.id) !== String(leader))
            return;

        remoteTime = Number(m.time) || 0;
        remoteStamp = Number(m.stamp) || performance.now();

        leader = null;
        lastBeat = 0;

        /*
         * Reuse the already loaded audio.
         */
        if (duration()) {
            try {
                audio.currentTime = remotePosition();
            } catch (_) {}
        }

        becomeLeader();
    }
};


/* ================= STARTUP ================= */

/*
 * Ask existing windows first.
 */
channel.postMessage({
    type: "discover",
    id
});


/*
 * If this is the first window, nobody answers.
 */
setTimeout(() => {

    if (
        !dead &&
        !isLeader &&
        (
            leader === null ||
            performance.now() - lastBeat > TIMEOUT
        )
    ) {
        leader = null;
        becomeLeader();
    }

}, 200);


/* ================= AUDIO ================= */

audio.addEventListener("play", () => {

    if (!isLeader) {
        audio.muted = true;
        audio.volume = 0;
    }

});


audio.addEventListener("playing", () => {

    if (isLeader)
        heartbeat();

});


audio.addEventListener("loadedmetadata", () => {

    if (!isLeader)
        sync();

});


audio.addEventListener("pause", () => {

    if (
        !dead &&
        !isLeader &&
        leader !== null
    ) {
        sync();
        playSilent();
    }

});


/* ================= CLEANUP ================= */

function cleanup() {

    if (dead)
        return;

    dead = true;

    if (isLeader) {

        channel.postMessage({
            type: "closing",
            id,
            time: now(),
            stamp: performance.now()
        });
    }

    clearInterval(beatTimer);

    try {
        audio.pause();
    } catch (_) {}

    try {
        channel.close();
    } catch (_) {}
}


window.addEventListener(
    "pagehide",
    cleanup,
    { once: true }
);

window.addEventListener(
    "beforeunload",
    cleanup,
    { once: true }
);

</script>

</body>
</html>
