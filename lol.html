<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>You Are An Idiot!</title>

<link rel="preload" href="/media/idiot.gif" as="image">
<link rel="preload" href="/media/youare-long.mp3" as="audio">
<script src="scripts/app.js" defer></script>

<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
body{display:flex;align-items:center;justify-content:center}
img{width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}
</style>
</head>

<body>
<img src="/media/idiot.gif" alt="You Are An Idiot!">

<audio id="youare-audio" preload="auto" loop muted hidden>
<source src="/media/youare-long.mp3" type="audio/mpeg">
</audio>

<script>
"use strict";

const audio=document.getElementById("youare-audio");
const ch=new BroadcastChannel("youare-idiot-audio");
const id=crypto.randomUUID();

const HB=50;
const TIMEOUT=300;
const SYNC=100;
const THRESHOLD=.12;

let leader=null,lastBeat=0,lastTime=0,lastStamp=0;
let isLeader=false,claiming=false,dead=false;

audio.preload="auto";
audio.muted=true;
audio.volume=0;
audio.load();

function now(){return performance.now()}

function norm(t){
    const d=audio.duration;
    if(!Number.isFinite(t)||t<0)return 0;
    return d>0?t%d:t;
}

function time(){return norm(audio.currentTime)}

function estimate(){
    let t=lastTime;
    if(Number.isFinite(lastStamp))
        t+=Math.min(2,Math.max(0,(now()-lastStamp)/1000));
    return norm(t);
}

function remember(t,s){
    if(Number.isFinite(t)&&t>=0){
        lastTime=norm(t);
        lastStamp=Number.isFinite(s)?s:now();
    }
}

function silent(){
    audio.muted=true;
    audio.volume=0;
}

function audible(){
    audio.muted=false;
    audio.volume=1;
}

function hb(){
    if(!isLeader||dead)return;
    const t=now(),p=time();
    remember(p,t);
    ch.postMessage({type:"hb",id,time:p,stamp:t});
}

function startHB(){
    clearInterval(startHB.t);
    hb();
    startHB.t=setInterval(hb,HB);
}

async function startSilent(){
    silent();
    try{
        await audio.play();
        return !audio.paused;
    }catch{
        return false;
    }
}

function sync(){
    if(!leader||isLeader||dead)return;

    if(audio.paused){
        startSilent();
        return;
    }

    const target=estimate(),cur=time(),d=audio.duration;
    if(!Number.isFinite(d)||d<=0)return;

    let diff=Math.abs(target-cur);
    diff=Math.min(diff,d-diff);

    if(diff>THRESHOLD){
        try{audio.currentTime=target}catch{}
    }
}

async function becomeLeader(){
    if(isLeader||claiming||dead)return;

    claiming=true;

    if(
        leader &&
        now()-lastBeat<=TIMEOUT
    ){
        claiming=false;
        return;
    }

    ch.postMessage({
        type:"claim",
        id,
        time:estimate(),
        stamp:now()
    });

    leader=id;
    isLeader=true;
    claiming=false;

    await startSilent();
    sync();

    audible();

    if(audio.paused){
        try{await audio.play()}
        catch{
            isLeader=false;
            leader=null;
            silent();
            return;
        }
    }

    startHB();
}

function loseLeader(){
    if(isLeader)remember(time(),now());

    isLeader=false;
    clearInterval(startHB.t);
    silent();

    if(leader===id)leader=null;
}

function takeover(){
    if(claiming||isLeader||dead)return;

    claiming=true;

    setTimeout(()=>{
        claiming=false;

        if(
            !dead &&
            !isLeader &&
            (!leader||now()-lastBeat>TIMEOUT)
        )
            becomeLeader();

    },Math.random()*30);
}

ch.onmessage=e=>{
    const d=e.data;
    if(!d||!d.type||d.id===id)return;

    if(d.type==="hb"){
        remember(Number(d.time),Number(d.stamp));

        const remote=String(d.id);
        leader=remote;
        lastBeat=now();
        claiming=false;

        if(isLeader){
            if(remote<id)loseLeader();
            else{
                leader=id;
                hb();
            }
        }else{
            silent();
            sync();
        }
        return;
    }

    if(d.type==="claim"){
        remember(Number(d.time),Number(d.stamp));

        const remote=String(d.id);

        if(isLeader){
            if(remote<id)loseLeader();
            else{
                leader=id;
                hb();
            }
        }else{
            leader=remote;
            lastBeat=now();
            claiming=false;
            silent();
            sync();
        }
        return;
    }

    if(d.type==="close"&&String(d.id)===String(leader)){
        remember(Number(d.time),Number(d.stamp));
        leader=null;
        lastBeat=0;
        takeover();
    }

    if(d.type==="discover"&&isLeader)hb();
};

audio.onplay=()=>{
    if(!isLeader)silent();
};

audio.onpause=()=>{
    if(!dead&&!isLeader)
        setTimeout(()=>{
            if(!dead&&!isLeader&&audio.paused)startSilent();
        },10);
};

audio.onplaying=()=>{if(isLeader)hb()};

audio.ontimeupdate=()=>{
    if(isLeader)remember(time(),now());
};

audio.onwaiting=()=>{
    if(isLeader)hb();
};

audio.onended=()=>{
    if(isLeader){
        lastTime=0;
        lastStamp=now();
        hb();
    }
};

document.addEventListener("visibilitychange",()=>{
    if(isLeader)hb();
    else if(!document.hidden&&audio.paused)startSilent();
});

ch.postMessage({type:"discover",id});

startSilent();

setInterval(()=>{
    if(dead||isLeader)return;

    if(!leader||now()-lastBeat>TIMEOUT){
        leader=null;
        takeover();
    }
},HB);

setInterval(sync,SYNC);

setTimeout(()=>{
    if(!leader&&!isLeader)takeover();
},150);

function cleanup(){
    if(dead)return;
    dead=true;

    if(isLeader){
        remember(time(),now());
        ch.postMessage({
            type:"close",
            id,
            time:lastTime,
            stamp:lastStamp
        });
    }

    clearInterval(startHB.t);
    silent();
    ch.close();
}

addEventListener("beforeunload",cleanup,{once:true});
addEventListener("pagehide",cleanup,{once:true});
</script>
</body>
</html>
