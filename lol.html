<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>You Are An Idiot!</title>

<link rel="preload" href="/media/idiot.gif" as="image">
<link rel="preload" href="/media/youare-long.mp3" as="audio">

<script src="scripts/app.js" defer></script>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}
body{
    display:flex;
    align-items:center;
    justify-content:center;
}
img{
    width:100%;
    height:100%;
    object-fit:contain;
    user-select:none;
    -webkit-user-drag:none;
}
</style>
</head>

<body>

<img src="/media/idiot.gif" alt="You Are An Idiot!">

<audio id="youare-audio" preload="auto" loop muted hidden>
    <source src="/media/youare-long.mp3" type="audio/mpeg">
</audio>

<script>
"use strict";

const audio = document.getElementById("youare-audio");
const bc = new BroadcastChannel("youare-idiot-audio");

const id =
    Date.now().toString(36) + "-" +
    Math.random().toString(36).slice(2);

const HEARTBEAT = 100;
const TIMEOUT = 500;
const SYNC = 200;
const THRESHOLD = 0.12;

let leader = null;
let lastBeat = 0;
let remoteTime = 0;
let remoteStamp = 0;
let isLeader = false;
let claiming = false;
let dead = false;

audio.preload = "auto";
audio.muted = true;
audio.volume = 0;

try {
    audio.load();
} catch (_) {}


/* ---------------- AUDIO ---------------- */

function time() {
    return Number.isFinite(audio.currentTime)
        ? audio.currentTime
        : 0;
}

function duration() {
    return Number.isFinite(audio.duration) && audio.duration > 0
        ? audio.duration
        : 0;
}

function normalize(t) {
    const d = duration();
    if (!d) return Math.max(0, t);
    return ((t % d) + d) % d;
}

function estimatedTime() {
    let t = remoteTime;

    if (remoteStamp) {
        t += Math.min(
            2,
            Math.max(0, performance.now() - remoteStamp) / 1000
        );
    }

    return normalize(t);
}

async function silentPlay() {
    if (dead) return;

    audio.muted = true;
    audio.volume = 0;

    if (!audio.paused) return;

    try {
        await audio.play();
    } catch (_) {}
}

function sync() {
    if (isLeader || leader === null) return;

    const target = estimatedTime();
    const current = time();
    const d = duration();

    if (!d) return;

    let diff = Math.abs(target - current);
    diff = Math.min(diff, d - diff);

    if (diff > THRESHOLD) {
        try {
            audio.currentTime = target;
        } catch (_) {}
    }

    silentPlay();
}


/* ---------------- HEARTBEAT ---------------- */

function beat() {
    if (!isLeader || dead) return;

    const now = performance.now();
    const t = time();

    remoteTime = t;
    remoteStamp = now;

    bc.postMessage({
        type: "beat",
        id,
        time: t,
        stamp: now
    });
}


/* ---------------- BECOME LEADER ---------------- */

async function becomeLeader() {
    if (dead || isLeader || claiming) return;

    claiming = true;

    /*
     * Wait a tiny random amount so several surviving windows
     * don't all claim simultaneously.
     */
    await new Promise(r =>
        setTimeout(r, Math.random() * 40)
    );

    if (dead || isLeader) {
        claiming = false;
        return;
    }

    /*
     * Someone else became leader while we waited.
     */
    if (
        leader &&
        performance.now() - lastBeat < TIMEOUT
    ) {
        claiming = false;
        return;
    }

    /*
     * Tell everybody who won.
     */
    bc.postMessage({
        type: "claim",
        id,
        time: estimatedTime(),
        stamp: performance.now()
    });

    leader = id;
    isLeader = true;
    claiming = false;

    /*
     * Synchronize BEFORE making sound.
     */
    const t = estimatedTime();

    if (duration()) {
        try {
            audio.currentTime = t;
        } catch (_) {}
    }

    await silentPlay();

    /*
     * Only now become audible.
     */
    audio.muted = false;
    audio.volume = 1;

    beat();
}


/* ---------------- MESSAGES ---------------- */

bc.onmessage = e => {
    const m = e.data;

    if (!m || !m.type || m.id === id) return;


    /* Leader heartbeat */

    if (m.type === "beat") {

        /*
         * If another leader is already alive, keep it.
         */
        if (
            !isLeader ||
            String(m.id) < String(id)
        ) {
            if (isLeader) {
                isLeader = false;
                audio.muted = true;
                audio.volume = 0;
            }

            leader = String(m.id);
            lastBeat = performance.now();

            remoteTime = Number(m.time) || 0;
            remoteStamp = Number(m.stamp) || performance.now();

            claiming = false;

            sync();
        }

        return;
    }


    /* Somebody claims leadership */

    if (m.type === "claim") {

        const other = String(m.id);

        /*
         * Deterministic winner.
         * Smaller ID wins if two windows claim simultaneously.
         */
        if (
            !isLeader ||
            other < String(id)
        ) {

            if (isLeader) {
                isLeader = false;
                audio.muted = true;
                audio.volume = 0;
            }

            leader = other;
            lastBeat = performance.now();

            remoteTime = Number(m.time) || 0;
            remoteStamp = Number(m.stamp) || performance.now();

            claiming = false;

            sync();
        }

        else if (isLeader) {

            /*
             * We won the tie.
             */
            beat();
        }

        return;
    }


    /* New popup asks who is leader */

    if (m.type === "discover") {

        if (isLeader) beat();

        return;
    }
};


/* ---------------- STARTUP ---------------- */

/*
 * Every popup immediately starts its own silent decoder.
 */
silentPlay();

/*
 * Ask existing popups who the leader is.
 */
bc.postMessage({
    type: "discover",
    id
});


/*
 * If nobody answers, become leader.
 */
setTimeout(() => {
    if (
        !dead &&
        leader === null &&
        !isLeader
    ) {
        becomeLeader();
    }
}, TIMEOUT);


/* ---------------- TIMERS ---------------- */

setInterval(() => {

    if (dead) return;

    if (isLeader) {
        beat();
        return;
    }

    /*
     * Leader hasn't been heard from.
     */
    if (
        leader === null ||
        performance.now() - lastBeat > TIMEOUT
    ) {

        leader = null;

        becomeLeader();

    }

}, HEARTBEAT);


/*
 * Keep every silent popup synchronized.
 */
setInterval(sync, SYNC);


/* ---------------- AUDIO EVENTS ---------------- */

audio.addEventListener("play", () => {

    if (!isLeader) {
        audio.muted = true;
        audio.volume = 0;
    }

});


audio.addEventListener("pause", () => {

    if (!dead && !isLeader) {
        setTimeout(silentPlay, 20);
    }

});


audio.addEventListener("playing", () => {

    if (isLeader) beat();

});


audio.addEventListener("waiting", () => {

    /*
     * Do NOT surrender leadership just because buffering occurs.
     */
    if (isLeader) beat();

});


audio.addEventListener("timeupdate", () => {

    if (isLeader) {
        remoteTime = time();
        remoteStamp = performance.now();
    }

});


audio.addEventListener("loadedmetadata", () => {

    silentPlay();

});


/* ---------------- CLEANUP ---------------- */

function cleanup() {

    if (dead) return;

    dead = true;

    if (isLeader) {

        /*
         * Give the surviving popups the latest position.
         */
        bc.postMessage({
            type: "closing",
            id,
            time: time(),
            stamp: performance.now()
        });

    }

    try {
        audio.pause();
    } catch (_) {}

    try {
        bc.close();
    } catch (_) {}
}

window.addEventListener("pagehide", cleanup);
window.addEventListener("beforeunload", cleanup);


/* ---------------- IMMEDIATE HANDOFF ---------------- */

bc.addEventListener("message", e => {

    const m = e.data;

    if (!m || m.type !== "closing") return;

    if (String(m.id) !== String(leader)) return;

    remoteTime = Number(m.time) || 0;
    remoteStamp = Number(m.stamp) || performance.now();

    leader = null;
    lastBeat = 0;

    /*
     * The audio is already loaded and playing silently,
     * so takeover can happen immediately.
     */
    becomeLeader();

});
</script>

</body>
</html>
