<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>You Are An Idiot!</title>

<link rel="preload" href="/media/idiot.gif" as="image">
<link rel="preload" href="/media/youare-long.mp3" as="audio">

<script src="scripts/app.js" defer></script>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}
body{
    display:flex;
    align-items:center;
    justify-content:center;
}
img{
    width:100%;
    height:100%;
    object-fit:contain;
    user-select:none;
    -webkit-user-drag:none;
}
</style>
</head>

<body>

<img src="/media/idiot.gif" alt="You Are An Idiot!">

<audio id="youare-audio" preload="auto" loop hidden>
    <source src="/media/youare-long.mp3" type="audio/mpeg">
</audio>

<script>
"use strict";

const audio = document.getElementById("youare-audio");
const channel = new BroadcastChannel("youare-idiot-audio");

const id =
    Date.now().toString(36) +
    Math.random().toString(36).slice(2);

const HEARTBEAT = 20;
const TIMEOUT = 300;
const SYNC_THRESHOLD = 0.03;

let leader = null;
let lastBeat = 0;
let remoteTime = 0;
let remoteStamp = 0;
let heartbeatTimer = null;
let claiming = false;
let dead = false;


/* ================= AUDIO ================= */

audio.volume = 1;
audio.muted = false;

try {
    audio.load();
} catch (_) {}

function playAudio() {
    if (dead || !audio.paused)
        return;

    audio.play().catch(() => {});
}


/* ================= TIME ================= */

function getDuration() {
    return Number.isFinite(audio.duration) && audio.duration > 0
        ? audio.duration
        : 0;
}

function normalize(t) {
    const d = getDuration();

    if (!d)
        return Math.max(0, t);

    return ((t % d) + d) % d;
}

function getTargetTime() {
    let t = remoteTime;

    if (remoteStamp) {
        t += (
            performance.now() -
            remoteStamp
        ) / 1000;
    }

    return normalize(t);
}


/* ================= SYNC ================= */

function syncAudio() {

    if (leader === id)
        return;

    const d = getDuration();

    if (!d)
        return;

    const target = getTargetTime();
    const current = audio.currentTime;

    let diff = Math.abs(target - current);

    diff = Math.min(
        diff,
        d - diff
    );

    if (diff > SYNC_THRESHOLD) {

        try {
            audio.currentTime = target;
        } catch (_) {}

    }

    audio.muted = false;
    audio.volume = 1;

    playAudio();
}


/* ================= HEARTBEAT ================= */

function sendHeartbeat() {

    if (
        dead ||
        leader !== id
    )
        return;

    const stamp = performance.now();
    const time = audio.currentTime;

    remoteTime = time;
    remoteStamp = stamp;

    channel.postMessage({
        type: "beat",
        id,
        time,
        stamp
    });
}


function startHeartbeat() {

    clearInterval(heartbeatTimer);

    sendHeartbeat();

    heartbeatTimer =
        setInterval(
            sendHeartbeat,
            HEARTBEAT
        );
}


/* ================= LEADER ================= */

async function becomeLeader() {

    if (
        dead ||
        leader === id ||
        claiming
    )
        return;

    claiming = true;

    await new Promise(resolve =>
        setTimeout(
            resolve,
            Math.random() * 20
        )
    );

    if (
        dead ||
        leader === id
    ) {
        claiming = false;
        return;
    }

    if (
        leader !== null &&
        performance.now() - lastBeat < TIMEOUT
    ) {
        claiming = false;
        return;
    }

    const time = getTargetTime();
    const stamp = performance.now();

    channel.postMessage({
        type: "claim",
        id,
        time,
        stamp
    });

    leader = id;
    claiming = false;

    if (getDuration()) {
        try {
            audio.currentTime = time;
        } catch (_) {}
    }

    audio.muted = false;
    audio.volume = 1;

    playAudio();

    startHeartbeat();
}


/* ================= MESSAGES ================= */

channel.onmessage = event => {

    const m = event.data;

    if (!m || m.id === id)
        return;


    /* ---------- HEARTBEAT ---------- */

    if (m.type === "beat") {

        const other = String(m.id);

        if (leader === id) {

            if (other < id) {

                leader = other;

                clearInterval(
                    heartbeatTimer
                );

            } else {

                sendHeartbeat();

                return;
            }
        }

        leader = other;
        lastBeat = performance.now();

        remoteTime =
            Number(m.time) || 0;

        remoteStamp =
            Number(m.stamp) ||
            performance.now();

        claiming = false;

        syncAudio();

        return;
    }


    /* ---------- CLAIM ---------- */

    if (m.type === "claim") {

        const other = String(m.id);

        if (
            leader === id &&
            other >= id
        ) {
            sendHeartbeat();
            return;
        }

        leader = other;
        lastBeat = performance.now();

        remoteTime =
            Number(m.time) || 0;

        remoteStamp =
            Number(m.stamp) ||
            performance.now();

        claiming = false;

        syncAudio();

        return;
    }


    /* ---------- DISCOVERY ---------- */

    if (m.type === "discover") {

        if (leader === id)
            sendHeartbeat();

        return;
    }


    /* ---------- LEADER CLOSED ---------- */

    if (m.type === "closing") {

        if (
            String(m.id) !==
            String(leader)
        )
            return;

        remoteTime =
            Number(m.time) || 0;

        remoteStamp =
            Number(m.stamp) ||
            performance.now();

        leader = null;
        lastBeat = 0;

        becomeLeader();
    }
};


/* ================= STARTUP ================= */

audio.addEventListener(
    "loadedmetadata",
    () => {

        syncAudio();
        playAudio();

    }
);


audio.addEventListener(
    "play",
    () => {

        audio.muted = false;
        audio.volume = 1;

    }
);


audio.addEventListener(
    "pause",
    () => {

        if (!dead)
            playAudio();

    }
);


audio.addEventListener(
    "playing",
    () => {

        if (leader === id)
            sendHeartbeat();

    }
);


audio.addEventListener(
    "waiting",
    () => {

        if (leader === id)
            sendHeartbeat();

    }
);


/* Ask existing windows who the leader is. */

channel.postMessage({
    type: "discover",
    id
});


/* Start audio immediately. */

playAudio();


/* Elect a leader if nobody answers. */

setTimeout(() => {

    if (
        !dead &&
        leader === null
    ) {
        becomeLeader();
    }

}, TIMEOUT);


/* ================= WATCHDOG ================= */

setInterval(() => {

    if (
        !dead &&
        leader !== id &&
        (
            leader === null ||
            performance.now() -
            lastBeat >
            TIMEOUT
        )
    ) {

        leader = null;
        becomeLeader();

    }

}, 100);


/* ================= CLEANUP ================= */

function cleanup() {

    if (dead)
        return;

    dead = true;

    if (leader === id) {

        channel.postMessage({
            type: "closing",
            id,
            time: audio.currentTime,
            stamp: performance.now()
        });

    }

    clearInterval(heartbeatTimer);

    try {
        audio.pause();
        channel.close();
    } catch (_) {}

}

window.addEventListener(
    "pagehide",
    cleanup,
    {once:true}
);

window.addEventListener(
    "beforeunload",
    cleanup,
    {once:true}
);

</script>

</body>
</html>
