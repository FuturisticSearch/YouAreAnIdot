<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChomeNS Discord</title>
<link rel="icon" type="image/png" href="/media/chomens-discord-icon-1024.png">

<style>
:root {
    --bg: #0b0f1a;
    --accent: #5865F2;
    --text: #e5e7eb;
    --muted: #9ca3af;
    --glass: rgba(255,255,255,0.06);
    --border: rgba(255,255,255,0.14);
}

* {
    box-sizing: border-box;
    font-family: Inter, system-ui, sans-serif;
}

body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(
        1200px 600px at 50% -200px,
        #1e293b,
        var(--bg)
    );
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
}

.card {
    width: 100%;
    max-width: 460px;
    padding: 2.4rem;
    background: linear-gradient(
        180deg,
        var(--glass),
        rgba(255,255,255,0.02)
    );
    border: 1px solid var(--border);
    border-radius: 22px;
    backdrop-filter: blur(14px);
    box-shadow: 0 40px 90px rgba(0,0,0,.6);
    animation: fadeUp .6s ease;
}

@keyframes fadeUp {
    from {
        opacity: 0;
        transform: translateY(20px);
    }

    to {
        opacity: 1;
        transform: none;
    }
}

.logo {
    display: flex;
    justify-content: center;
    margin-bottom: 1.2rem;
}

.logo img {
    width: 72px;
    height: 72px;
    border-radius: 18px;
    box-shadow: 0 0 25px rgba(255,0,255,.35);
}

h1 {
    text-align: center;
    font-size: 1.6rem;
    margin-bottom: .4rem;
}

p {
    text-align: center;
    color: var(--muted);
    font-size: .95rem;
    margin-bottom: 2rem;
}

.actions {
    display: grid;
    gap: .9rem;
}

button {
    border: none;
    border-radius: 14px;
    padding: 1rem;
    font-size: .95rem;
    font-weight: 600;
    cursor: pointer;
    transition: all .25s ease;
}

.btn-discord {
    background: linear-gradient(
        135deg,
        var(--accent),
        #4752c4
    );
    color: #fff;
}

.btn-discord:hover {
    transform: translateY(-1px);
    box-shadow: 0 10px 30px rgba(88,101,242,.45);
}

.btn-nah {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
}

.btn-nah:hover {
    background: rgba(255,255,255,.05);
    color: var(--text);
}

.spinner {
    margin: 1.6rem auto 0;
    width: 46px;
    display: flex;
    justify-content: space-between;
}

.spinner div {
    width: 8px;
    height: 8px;
    background: #fff;
    border-radius: 50%;
    animation: bounce 1.4s infinite ease-in-out both;
}

.spinner div:nth-child(1) {
    animation-delay: -.32s;
}

.spinner div:nth-child(2) {
    animation-delay: -.16s;
}

@keyframes bounce {
    0%, 80%, 100% {
        transform: scale(0);
    }

    40% {
        transform: scale(1);
    }
}

.popup-warning {
    margin-top: 1.5rem;
    padding: 1.1rem 1.2rem;
    border-radius: 14px;
    background: linear-gradient(
        180deg,
        rgba(239,68,68,.22),
        rgba(239,68,68,.1)
    );
    border: 1px solid rgba(239,68,68,.5);
    color: #fee2e2;
    font-size: .92rem;
    text-align: center;
    display: none;
    animation: shakeIn .35s ease;
}

.popup-warning strong {
    display: block;
    font-size: 1rem;
    margin-bottom: .25rem;
}

.popup-warning span {
    display: block;
    margin-top: .35rem;
    font-size: .85rem;
    color: #fca5a5;
}

@keyframes shakeIn {
    0% {
        transform: none;
    }

    25% {
        transform: translateX(-4px);
    }

    50% {
        transform: translateX(4px);
    }

    75% {
        transform: translateX(-2px);
    }

    100% {
        transform: none;
    }
}
</style>
</head>

<body>

<div class="card">

    <div class="logo">
        <img
            src="/media/chomens-discord-icon-1024.png"
            alt="ChomeNS icon"
        >
    </div>

    <h1>ChomeNS Discord</h1>

    <p>
        Click below to join our Discord server.
    </p>

    <div class="actions">

        <button class="btn-discord" id="discord_btn">
            Join Discord
        </button>

        <button class="btn-nah" id="nah_btn">
            Maybe later
        </button>

    </div>

    <div id="spinner_holder"></div>

    <div id="popup_needed" class="popup-warning">
        <strong>Popup blocked</strong>

        Your browser blocked the new window used to open the Discord invite.

        <span>
            Please allow pop-ups for this site and try again.
        </span>
    </div>

</div>

<script>

let joinLocked = false;
let discordOpened = false;
let redirecting = false;
let discordWindow = null;


// ============================================================
// REDIRECT
// Only called by mouse movement.
// ============================================================

function redirectToDiscordPage() {

    if (redirecting) {
        return;
    }

    redirecting = true;

    window.location.href = "discord.html";
}


// ============================================================
// POPUP PERMISSION CHECK
//
// Uses the same test.html mechanism as question.html.
//
// Late success messages are accepted indefinitely.
// ============================================================

const POPUP_TEST_COUNT = 3;

const popupResults = new Set();

let popupTestStarted = false;
let popupAllowed = false;


// ============================================================
// RECEIVE TEST.HTML SUCCESS
// ============================================================

window.addEventListener(
    "message",
    event => {

        if (
            event.origin !==
            window.location.origin
        ) {
            return;
        }

        const data = event.data;

        if (
            !data ||
            data.type !==
            "YOUARE_POPUP_TEST_SUCCESS"
        ) {
            return;
        }

        const id =
            String(data.id);

        if (
            ![
                "0",
                "1",
                "2"
            ].includes(id)
        ) {
            return;
        }

        popupResults.add(id);

        if (
            popupResults.size >=
            POPUP_TEST_COUNT
        ) {

            popupAllowed = true;

            /*
             * A delayed Firefox popup can report success
             * several seconds after the original check.
             *
             * Hide the warning immediately.
             */
            const popup =
                document.getElementById(
                    "popup_needed"
                );

            if (popup) {
                popup.style.display = "none";
            }

            const spinner =
                document.getElementById(
                    "spinner_holder"
                );

            if (
                spinner &&
                !joinLocked
            ) {
                spinner.innerHTML = "";
            }
        }

    }
);


// ============================================================
// START POPUP TEST
// ============================================================

function testPopupPermission() {

    if (popupTestStarted) {
        return popupAllowed;
    }

    popupTestStarted = true;

    popupResults.clear();

    for (
        let i = 0;
        i < POPUP_TEST_COUNT;
        i++
    ) {

        try {

            const popup =
                window.open(
                    `test.html?id=${i}`,
                    `youare_popup_test_${i}`,
                    [
                        "width=1",
                        "height=1",
                        "left=-10000",
                        "top=-10000"
                    ].join(",")
                );

            /*
             * Do not close the popup here.
             *
             * test.html closes itself after sending
             * the success message.
             */
            void popup;

        } catch (_) {

            /*
             * No confirmation will arrive if blocked.
             */

        }

    }

    return popupAllowed;
}


// ============================================================
// JOIN DISCORD
// ============================================================

async function handleJoinClick(e) {

    e.preventDefault();

    if (joinLocked) {
        return;
    }

    const popup =
        document.getElementById(
            "popup_needed"
        );

    const spinner =
        document.getElementById(
            "spinner_holder"
        );

    popup.style.display = "none";

    spinner.innerHTML = `
        <div class="spinner">
            <div></div>
            <div></div>
            <div></div>
        </div>
    `;


    /*
     * Start the asynchronous popup test.
     */
    testPopupPermission();


    /*
     * Give normal browsers a short opportunity
     * to report the results.
     *
     * Firefox can report them later; the message
     * listener above remains active.
     */
    await new Promise(
        resolve => {

            setTimeout(
                resolve,
                300
            );

        }
    );


    if (!popupAllowed) {

        spinner.innerHTML = "";
        popup.style.display = "block";

        /*
         * A late test.html success message can still
         * hide this warning.
         */

        return;
    }


    discordWindow =
        window.open(
            "https://discord.gg/bsaT7dmRP",
            "discordPopup",
            "width=400,height=600,left=" +
            ((screen.width - 400) / 2) +
            ",top=" +
            ((screen.height - 600) / 2) +
            ",scrollbars=no,resizable=no"
        );


    if (!discordWindow) {

        spinner.innerHTML = "";
        popup.style.display = "block";

        return;
    }


    joinLocked = true;
    discordOpened = true;

    spinner.innerHTML = "";
}


// ============================================================
// MOUSE MOVEMENT
//
// This is the ONLY thing that redirects to discord.html.
// Closing Discord does NOT redirect.
// ============================================================

document.addEventListener(
    "mousemove",
    () => {

        if (
            !discordOpened ||
            redirecting
        ) {
            return;
        }

        redirectToDiscordPage();

    },
    {
        passive: true
    }
);


// ============================================================
// BUTTONS
// ============================================================

document
    .getElementById("discord_btn")
    .addEventListener(
        "click",
        handleJoinClick
    );


document
    .getElementById("nah_btn")
    .addEventListener(
        "click",
        e => {

            e.preventDefault();

            history.back();

        }
    );

</script>

</body>
</html>
