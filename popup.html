<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Are You An Idiot?</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            background: transparent;
            overflow: hidden;

            font-family:
                "MS Sans Serif",
                "Microsoft Sans Serif",
                Tahoma,
                Arial,
                sans-serif;

            font-size: 11px;

            user-select: none;
            -webkit-user-select: none;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        #question-window {
            position: absolute;

            width: 928px;
            height: 929px;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%)
                scale(1);

            transform-origin: center center;

            background: #c0c0c0;

            border: 2px solid;
            border-color:
                #ffffff
                #000000
                #000000
                #ffffff;

            box-shadow:
                inset 1px 1px 0 #dfdfdf,
                inset -1px -1px 0 #808080;

            overflow: hidden;
        }

        #titlebar {
            position: absolute;

            left: 3px;
            right: 3px;
            top: 3px;

            height: 22px;

            display: flex;
            align-items: center;

            padding-left: 4px;

            background: #000080;
            color: #ffffff;

            font-size: 13px;
            font-weight: bold;

            line-height: 18px;

            cursor: move;
            touch-action: none;
        }

        #title {
            pointer-events: none;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #pictureBox1 {
            position: absolute;

            left: 3px;
            top: 28px;

            width: 918px;
            height: 714px;

            display: block;

            object-fit: fill;
            pointer-events: none;
        }

        #question-area {
            position: absolute;

            left: 3px;
            right: 3px;

            top: 750px;
            height: 90px;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        #question {
            margin: 0;

            font-family:
                "MS Sans Serif",
                "Microsoft Sans Serif",
                Tahoma,
                Arial,
                sans-serif;

            font-size: 20px;
            font-weight: normal;

            line-height: 1.2;

            white-space: nowrap;

            color: Indigo;

            text-align: center;
        }

        .answer {
            position: absolute;

            top: 860px;
            height: 57px;

            padding: 0;

            background: #c0c0c0;
            color: #000000;

            font-family:
                "MS Sans Serif",
                "Microsoft Sans Serif",
                Tahoma,
                Arial,
                sans-serif;

            font-size: 12px;

            border: 2px solid;
            border-color:
                #ffffff
                #000000
                #000000
                #ffffff;

            border-radius: 0;

            box-shadow:
                inset 1px 1px 0 #dfdfdf,
                inset -1px -1px 0 #808080;

            cursor: default;

            appearance: none;
            -webkit-appearance: none;
        }

        .answer:active {
            border-color:
                #000000
                #ffffff
                #ffffff
                #000000;

            box-shadow:
                inset 1px 1px 0 #808080,
                inset -1px -1px 0 #dfdfdf;

            padding-left: 2px;
            padding-top: 2px;
        }

        .answer:focus {
            outline: 1px dotted #000000;
            outline-offset: -5px;
        }

        #no {
            left: 28px;
            width: 262px;
        }

        #none {
            left: 298px;
            width: 354px;
        }

        #yes {
            left: 660px;
            width: 244px;
        }

        #popup-overlay {
            position: fixed;

            inset: 0;

            display: none;

            z-index: 100000;
        }

        #popup-overlay.visible {
            display: block;
        }

        #popup {
            position: fixed;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%);

            min-width: 390px;

            max-width:
                min(
                    500px,
                    calc(100vw - 30px)
                );

            background: #c0c0c0;

            border: 2px solid;
            border-color:
                #ffffff
                #000000
                #000000
                #ffffff;

            box-shadow:
                inset 1px 1px 0 #dfdfdf,
                inset -1px -1px 0 #808080;
        }

        #popup-titlebar {
            height: 22px;

            display: flex;
            align-items: center;

            padding-left: 4px;
            padding-right: 2px;

            background: #000080;

            color: #ffffff;

            font-size: 13px;
            font-weight: bold;
        }

        #popup-title {
            flex: 1;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #popup-close {
            width: 19px;
            height: 18px;

            padding: 0;

            background: #c0c0c0;

            border: 2px solid;
            border-color:
                #ffffff
                #000000
                #000000
                #ffffff;

            box-shadow:
                inset 1px 1px 0 #dfdfdf,
                inset -1px -1px 0 #808080;

            font-family: Arial, sans-serif;

            font-size: 11px;
            font-weight: bold;

            line-height: 13px;
        }

        #popup-close:active {
            border-color:
                #000000
                #ffffff
                #ffffff
                #000000;
        }

        #popup-content {
            min-height: 90px;

            display: flex;
            align-items: center;

            padding: 18px;
        }

        #popup-icon {
            width: 32px;
            min-width: 32px;

            height: 32px;

            margin-right: 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #000000;

            font-family: Arial, sans-serif;

            font-size: 26px;
            font-weight: bold;
        }

        #popup-message {
            flex: 1;

            font-size: 13px;

            color: #000000;

            line-height: 1.35;
        }

        #popup-buttons {
            display: flex;

            justify-content: center;

            gap: 8px;

            padding:
                0
                12px
                14px;
        }

        #popup-buttons button {
            min-width: 75px;

            height: 27px;

            padding:
                2px
                12px;

            background: #c0c0c0;

            border: 2px solid;

            border-color:
                #ffffff
                #000000
                #000000
                #ffffff;

            box-shadow:
                inset 1px 1px 0 #dfdfdf,
                inset -1px -1px 0 #808080;

            font-family:
                "MS Sans Serif",
                "Microsoft Sans Serif",
                Tahoma,
                Arial,
                sans-serif;

            font-size: 12px;

            color: #000000;
        }

        #popup-buttons button:active {
            border-color:
                #000000
                #ffffff
                #ffffff
                #000000;
        }
    </style>
</head>

<body>

<main id="question-window">

    <div id="titlebar">
        <span id="title">
            Are You An Idiot?
        </span>
    </div>

    <img
        id="pictureBox1"
        src="media/idiot.gif"
        alt=""
        draggable="false"
    >

    <div id="question-area">
        <div id="question">
            Are You An Idiot ?
        </div>
    </div>

    <button
        class="answer"
        id="no"
        type="button"
    >
        No, I'm not.
    </button>

    <button
        class="answer"
        id="none"
        type="button"
    >
        I don't know =[
    </button>

    <button
        class="answer"
        id="yes"
        type="button"
    >
        Yes, I am.
    </button>

</main>


<div id="popup-overlay">

    <div id="popup">

        <div id="popup-titlebar">

            <span id="popup-title">
                YouAreAnIdiot
            </span>

            <button
                id="popup-close"
                type="button"
            >×</button>

        </div>

        <div id="popup-content">

            <div id="popup-icon">
                !
            </div>

            <div id="popup-message"></div>

        </div>

        <div id="popup-buttons"></div>

    </div>

</div>


<audio
    id="idiot-audio"
    preload="auto"
    loop
>
    <source
        src="/media/youare-long.mp3"
        type="audio/mpeg"
    >
</audio>


<script>
"use strict";


/* ============================================================
   ELEMENTS
   ============================================================ */

const question =
    document.getElementById("question");

const noButton =
    document.getElementById("no");

const noneButton =
    document.getElementById("none");

const yesButton =
    document.getElementById("yes");

const idiotAudio =
    document.getElementById("idiot-audio");

const popupOverlay =
    document.getElementById("popup-overlay");

const popupMessage =
    document.getElementById("popup-message");

const popupButtons =
    document.getElementById("popup-buttons");

const popupClose =
    document.getElementById("popup-close");

const popupIcon =
    document.getElementById("popup-icon");

const questionWindow =
    document.getElementById("question-window");

const titlebar =
    document.getElementById("titlebar");


/* ============================================================
   RESPONSIVE SCALING
   ============================================================ */

const BASE_WIDTH = 928;
const BASE_HEIGHT = 929;

let scale = 1;

let windowX = 0;
let windowY = 0;

let manuallyPositioned = false;


function updateScale() {

    const viewportWidth =
        window.innerWidth;

    const viewportHeight =
        window.innerHeight;


    scale = Math.min(
        viewportWidth / BASE_WIDTH,
        viewportHeight / BASE_HEIGHT
    );


    scale = Math.min(
        scale,
        1
    );


    scale = Math.max(
        scale,
        0.1
    );


    if (!manuallyPositioned) {

        questionWindow.style.left =
            "50%";

        questionWindow.style.top =
            "50%";

        questionWindow.style.transform =
            `translate(-50%, -50%) scale(${scale})`;

    } else {

        questionWindow.style.transform =
            `scale(${scale})`;

    }

}


updateScale();


window.addEventListener(
    "resize",
    updateScale
);


window.addEventListener(
    "orientationchange",
    () => {

        setTimeout(
            updateScale,
            50
        );

    }
);


/* ============================================================
   CALCULATE THE SAME SIZE USED BY discord.html POPUPS
   ============================================================ */

function getDiscordPopupSize() {

    /*
     * These are the exact proportions used by
     * the discord.html openWindow() function.
     */

    const rawWidth =
        Math.round(
            window.screen.width * 0.1875
        );

    const rawHeight =
        Math.round(
            window.screen.height * 0.2222
        );


    /*
     * Keep the values valid.
     */

    const width =
        Math.max(
            1,
            rawWidth
        );

    const height =
        Math.max(
            1,
            rawHeight
        );


    return {
        width,
        height
    };

}


/* ============================================================
   SEND RESIZE REQUEST TO OPENER
   ============================================================ */

function requestOpenerResize() {

    const size =
        getDiscordPopupSize();


    const message = {

        type:
            "YOUARE_REQUEST_DISCORD_SIZE",

        width:
            size.width,

        height:
            size.height,

        source:
            "popup.html",

        timestamp:
            Date.now()

    };


    /*
     * Always send this request.
     *
     * It does NOT matter whether our own
     * resizeTo() succeeds.
     */

    try {

        if (
            window.opener &&
            !window.opener.closed
        ) {

            window.opener.postMessage(
                message,
                window.location.origin
            );

        }

    } catch (_) {

        /*
         * Cross-browser failure is ignored.
         */

    }

}


/* ============================================================
   SELF RESIZE
   ============================================================ */

let resizeInProgress = false;


function resizeSelfToDiscordSize() {

    const size =
        getDiscordPopupSize();


    if (
        typeof window.resizeTo !==
        "function"
    ) {

        requestOpenerResize();

        return false;

    }


    try {

        /*
         * First try resizing ourselves.
         */

        window.resizeTo(
            size.width,
            size.height
        );


    } catch (_) {

        /*
         * Ignore and let opener handle it.
         */

    }


    /*
     * IMPORTANT:
     *
     * The opener request is ALWAYS sent,
     * even if resizeTo() above worked.
     */

    requestOpenerResize();


    /*
     * We cannot reliably know whether the
     * browser actually honored resizeTo().
     *
     * Check the result after the browser gets
     * a chance to apply it.
     */

    setTimeout(
        () => {

            const widthDifference =
                Math.abs(
                    window.outerWidth -
                    size.width
                );

            const heightDifference =
                Math.abs(
                    window.outerHeight -
                    size.height
                );


            if (
                widthDifference > 5 ||
                heightDifference > 5
            ) {

                /*
                 * It did not resize correctly.
                 * Ask opener again.
                 */

                requestOpenerResize();

            }

        },
        80
    );


    return true;

}


/* ============================================================
   INITIAL RESIZE
   ============================================================ */

function initialPopupResize() {

    requestAnimationFrame(
        () => {

            requestAnimationFrame(
                () => {

                    resizeSelfToDiscordSize();

                }
            );

        }
    );

}


initialPopupResize();


window.addEventListener(
    "load",
    () => {

        updateScale();

        initialPopupResize();

    },
    {
        once: true
    }
);


/* ============================================================
   CUSTOM MESSAGE BOX
   ============================================================ */

let popupResolver = null;


function showPopup(
    message,
    buttons,
    icon = "!"
) {

    popupMessage.textContent =
        message;

    popupIcon.textContent =
        icon;

    popupButtons.innerHTML =
        "";

    popupOverlay.classList.add(
        "visible"
    );


    return new Promise(
        resolve => {

            popupResolver =
                resolve;


            for (
                const text of buttons
            ) {

                const button =
                    document.createElement(
                        "button"
                    );


                button.type =
                    "button";


                button.textContent =
                    text;


                button.addEventListener(
                    "click",
                    () => {

                        closePopup(
                            text
                        );

                    }
                );


                popupButtons.appendChild(
                    button
                );

            }


            const firstButton =
                popupButtons.querySelector(
                    "button"
                );


            if (firstButton) {

                firstButton.focus();

            }

        }
    );

}


function closePopup(
    result = "Close"
) {

    popupOverlay.classList.remove(
        "visible"
    );


    if (popupResolver) {

        const resolve =
            popupResolver;

        popupResolver =
            null;

        resolve(result);

    }

}


popupClose.addEventListener(
    "click",
    () => {

        closePopup(
            "Close"
        );

    }
);


/* ============================================================
   AUDIO
   ============================================================ */

function playAudio() {

    const promise =
        idiotAudio.play();


    if (
        promise &&
        typeof promise.catch ===
        "function"
    ) {

        promise.catch(() => {

            /*
             * Browser blocked autoplay.
             */

        });

    }

}


playAudio();


document.addEventListener(
    "pointerdown",
    () => {

        playAudio();

    },
    {
        once: true
    }
);


/* ============================================================
   RAINBOW QUESTION
   ============================================================ */

const fontColors = [

    "Indigo",
    "Ivory",
    "LightPink",
    "LightSkyBlue",
    "Lime",
    "MediumPurple",
    "MediumSpringGreen",
    "Pink",
    "Red",
    "Snow"

];


let timerFT = 0;


setInterval(
    () => {

        timerFT++;


        if (
            timerFT >= 1 &&
            timerFT <= 9
        ) {

            question.style.color =
                fontColors[timerFT];

        }


        if (
            timerFT >= 9
        ) {

            question.style.color =
                "Snow";

            timerFT = 0;

        }

    },
    55
);


/* ============================================================
   REDIRECT
   ============================================================ */

let redirecting = false;


function redirectToDiscord() {

    if (redirecting) {
        return;
    }


    redirecting = true;


    /*
     * Resize BEFORE navigating away.
     *
     * Send to opener immediately, then give
     * the browser a short amount of time to
     * perform the resize.
     */

    resizeSelfToDiscordSize();


    setTimeout(
        () => {

            window.location.href =
                "discord.html";

        },
        180
    );

}


/* ============================================================
   NO / I DON'T KNOW
   ============================================================ */

async function handleNo() {

    if (redirecting) {
        return;
    }


    await showPopup(
        "Oh... I think you are an idiot. XD",
        ["OK"],
        "!"
    );


    redirectToDiscord();

}


noButton.addEventListener(
    "click",
    handleNo
);


noneButton.addEventListener(
    "click",
    handleNo
);


/* ============================================================
   YES
   ============================================================ */

yesButton.addEventListener(
    "click",
    async () => {

        if (redirecting) {
            return;
        }


        const result =
            await showPopup(
                "Are you sure?",
                ["Yes", "No"],
                "?"
            );


        if (
            result === "Yes" ||
            result === "No" ||
            result === "Close"
        ) {

            redirectToDiscord();

        }

    }
);


/* ============================================================
   ESCAPE
   ============================================================ */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape"
        ) {

            redirectToDiscord();

        }

    }
);


/* ============================================================
   RIGHT CLICK
   ============================================================ */

document.addEventListener(
    "contextmenu",
    event => {

        event.preventDefault();

    }
);


/* ============================================================
   DRAGGING
   ============================================================ */

let dragging = false;

let dragPointerId = null;

let dragStartPointerX = 0;
let dragStartPointerY = 0;

let dragStartWindowX = 0;
let dragStartWindowY = 0;


titlebar.addEventListener(
    "pointerdown",
    event => {

        dragging = true;

        dragPointerId =
            event.pointerId;


        if (
            !manuallyPositioned
        ) {

            const rect =
                questionWindow
                    .getBoundingClientRect();


            windowX =
                rect.left;

            windowY =
                rect.top;


            manuallyPositioned =
                true;

        }


        dragStartPointerX =
            event.clientX;

        dragStartPointerY =
            event.clientY;


        dragStartWindowX =
            windowX;

        dragStartWindowY =
            windowY;


        titlebar.setPointerCapture(
            event.pointerId
        );


        event.preventDefault();

    }
);


titlebar.addEventListener(
    "pointermove",
    event => {

        if (
            !dragging ||
            event.pointerId !==
            dragPointerId
        ) {

            return;

        }


        windowX =
            dragStartWindowX +
            (
                event.clientX -
                dragStartPointerX
            );


        windowY =
            dragStartWindowY +
            (
                event.clientY -
                dragStartPointerY
            );


        const renderedWidth =
            BASE_WIDTH * scale;

        const renderedHeight =
            BASE_HEIGHT * scale;


        const minVisible =
            30;


        windowX =
            Math.min(
                Math.max(
                    windowX,
                    -renderedWidth +
                    minVisible
                ),
                window.innerWidth -
                minVisible
            );


        windowY =
            Math.min(
                Math.max(
                    windowY,
                    -renderedHeight +
                    minVisible
                ),
                window.innerHeight -
                minVisible
            );


        questionWindow.style.left =
            `${windowX}px`;

        questionWindow.style.top =
            `${windowY}px`;

        questionWindow.style.transform =
            `scale(${scale})`;

    }
);


function stopDragging(event) {

    if (
        !dragging ||
        event.pointerId !==
        dragPointerId
    ) {

        return;

    }


    dragging = false;

    dragPointerId = null;


    try {

        titlebar.releasePointerCapture(
            event.pointerId
        );

    } catch (_) {}

}


titlebar.addEventListener(
    "pointerup",
    stopDragging
);


titlebar.addEventListener(
    "pointercancel",
    stopDragging
);


/* ============================================================
   PREVENT GIF DRAGGING
   ============================================================ */

document
    .getElementById("pictureBox1")
    .addEventListener(
        "dragstart",
        event => {

            event.preventDefault();

        }
    );

</script>

</body>
</html>
