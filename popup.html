<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Are You An Idiot?</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            background: transparent;
            overflow: hidden;

            font-family:
                "MS Sans Serif",
                "Microsoft Sans Serif",
                Tahoma,
                Arial,
                sans-serif;

            font-size: 11px;

            user-select: none;
            -webkit-user-select: none;

            display: flex;
            align-items: center;
            justify-content: center;
        }


        /* =====================================================
           MAIN WINDOW
           ===================================================== */

        #question-window {
            position: absolute;

            width: 928px;
            height: 929px;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%)
                scale(1);

            transform-origin: center center;

            background: #c0c0c0;

            border: 2px solid;

            border-color:
                #ffffff
                #000000
                #000000
                #ffffff;

            box-shadow:
                inset 1px 1px 0 #dfdfdf,
                inset -1px -1px 0 #808080;

            overflow: hidden;
        }


        /* =====================================================
           MAIN WINDOW TITLE BAR
           ===================================================== */

        #titlebar {
            position: absolute;

            left: 3px;
            right: 3px;
            top: 3px;

            height: 22px;

            display: flex;
            align-items: center;

            padding-left: 4px;
            padding-right: 2px;

            background: #000080;
            color: #ffffff;

            font-size: 13px;
            font-weight: bold;

            line-height: 18px;

            cursor: move;
            touch-action: none;
        }

        #title {
            flex: 1;

            pointer-events: none;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .window-button {
            width: 19px;
            height: 18px;

            padding: 0;
            margin-left: 2px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #c0c0c0;
            color: #000000;

            border: 2px solid;

            border-color:
                #ffffff
                #000000
                #000000
                #ffffff;

            box-shadow:
                inset 1px 1px 0 #dfdfdf,
                inset -1px -1px 0 #808080;

            font-family: Arial, sans-serif;
            font-size: 11px;
            font-weight: bold;
            line-height: 13px;

            appearance: none;
            -webkit-appearance: none;
        }

        .window-button:active {
            border-color:
                #000000
                #ffffff
                #ffffff
                #000000;

            box-shadow:
                inset 1px 1px 0 #808080,
                inset -1px -1px 0 #dfdfdf;
        }


        /* =====================================================
           GIF
           ===================================================== */

        #pictureBox1 {
            position: absolute;

            left: 3px;
            top: 28px;

            width: 918px;
            height: 714px;

            display: block;

            object-fit: fill;
            pointer-events: none;
        }


        /* =====================================================
           QUESTION
           ===================================================== */

        #question-area {
            position: absolute;

            left: 3px;
            right: 3px;

            top: 750px;
            height: 90px;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        #question {
            margin: 0;

            font-family:
                "MS Sans Serif",
                "Microsoft Sans Serif",
                Tahoma,
                Arial,
                sans-serif;

            font-size: 20px;
            font-weight: normal;

            line-height: 1.2;

            white-space: nowrap;

            color: Indigo;
            text-align: center;
        }


        /* =====================================================
           ANSWER BUTTONS
           ===================================================== */

        .answer {
            position: absolute;

            top: 860px;
            height: 57px;

            padding: 0;

            background: #c0c0c0;
            color: #000000;

            font-family:
                "MS Sans Serif",
                "Microsoft Sans Serif",
                Tahoma,
                Arial,
                sans-serif;

            font-size: 12px;

            border: 2px solid;

            border-color:
                #ffffff
                #000000
                #000000
                #ffffff;

            border-radius: 0;

            box-shadow:
                inset 1px 1px 0 #dfdfdf,
                inset -1px -1px 0 #808080;

            cursor: default;

            appearance: none;
            -webkit-appearance: none;
        }

        .answer:hover {
            background: #c0c0c0;
        }

        .answer:active {
            border-color:
                #000000
                #ffffff
                #ffffff
                #000000;

            box-shadow:
                inset 1px 1px 0 #808080,
                inset -1px -1px 0 #dfdfdf;

            padding-left: 2px;
            padding-top: 2px;
        }

        .answer:focus {
            outline: 1px dotted #000000;
            outline-offset: -5px;
        }

        #no {
            left: 28px;
            width: 262px;
        }

        #none {
            left: 298px;
            width: 354px;
        }

        #yes {
            left: 660px;
            width: 244px;
        }


        /* =====================================================
           POPUP OVERLAY
           ===================================================== */

        #popup-overlay {
            position: fixed;

            inset: 0;

            display: none;

            z-index: 100000;

            /*
             * Do not create a visible background here.
             * The page behind the popup remains untouched.
             */
            background: transparent;
        }

        #popup-overlay.visible {
            display: block;
        }


        /* =====================================================
           POPUP
           
           No custom titlebar.
           No X button.
           The popup itself is the window.
           ===================================================== */

        #popup {
            position: fixed;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%);

            /*
             * Dynamic sizing:
             *
             * - Never larger than 430px.
             * - Never wider than 86vw.
             * - Never taller than 70vh.
             * - On tiny screens it automatically shrinks.
             */
            width: min(
                430px,
                86vw,
                calc(100vw - 24px)
            );

            max-height: 70vh;

            background: #c0c0c0;

            border: 2px solid;

            border-color:
                #ffffff
                #000000
                #000000
                #ffffff;

            box-shadow:
                inset 1px 1px 0 #dfdfdf,
                inset -1px -1px 0 #808080;

            overflow: hidden;

            /*
             * Make the popup behave like a compact
             * classic Windows dialog rather than
             * a huge browser-sized window.
             */
            display: flex;
            flex-direction: column;
        }


        /* =====================================================
           POPUP CONTENT
           ===================================================== */

        #popup-content {
            min-height: 76px;

            display: flex;
            align-items: center;

            padding: 14px;
        }


        /* =====================================================
           POPUP ICON
           ===================================================== */

        #popup-icon {
            width: 32px;
            min-width: 32px;

            height: 32px;

            margin-right: 14px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #000000;

            font-family: Arial, sans-serif;

            font-size: 26px;
            font-weight: bold;
            line-height: 32px;

            text-align: center;
        }


        /* =====================================================
           POPUP MESSAGE
           ===================================================== */

        #popup-message {
            flex: 1;

            min-width: 0;

            font-size: 13px;

            color: #000000;

            line-height: 1.35;

            overflow-wrap: break-word;
        }


        /* =====================================================
           POPUP BUTTONS
           ===================================================== */

        #popup-buttons {
            display: flex;

            justify-content: center;

            align-items: center;

            flex-wrap: wrap;

            gap: 8px;

            padding:
                0
                12px
                12px;
        }

        #popup-buttons button {
            min-width: 75px;

            height: 27px;

            padding:
                2px
                12px;

            background: #c0c0c0;

            border: 2px solid;

            border-color:
                #ffffff
                #000000
                #000000
                #ffffff;

            box-shadow:
                inset 1px 1px 0 #dfdfdf,
                inset -1px -1px 0 #808080;

            font-family:
                "MS Sans Serif",
                "Microsoft Sans Serif",
                Tahoma,
                Arial,
                sans-serif;

            font-size: 12px;

            color: #000000;

            appearance: none;
            -webkit-appearance: none;
        }

        #popup-buttons button:hover {
            background: #c0c0c0;
        }

        #popup-buttons button:active {
            border-color:
                #000000
                #ffffff
                #ffffff
                #000000;

            box-shadow:
                inset 1px 1px 0 #808080,
                inset -1px -1px 0 #dfdfdf;
        }

        #popup-buttons button:focus {
            outline: 1px dotted #000000;
            outline-offset: -5px;
        }


        /* =====================================================
           SMALL VIEWPORT ADJUSTMENTS
           ===================================================== */

        @media (max-width: 450px) {

            #popup {
                width: calc(100vw - 20px);
                max-height: 65vh;
            }

            #popup-content {
                min-height: 68px;
                padding: 11px;
            }

            #popup-icon {
                width: 28px;
                min-width: 28px;

                height: 28px;

                margin-right: 10px;

                font-size: 23px;
                line-height: 28px;
            }

            #popup-message {
                font-size: 12px;
            }

            #popup-buttons {
                gap: 6px;

                padding:
                    0
                    8px
                    9px;
            }

            #popup-buttons button {
                min-width: 68px;
                height: 25px;

                padding:
                    2px
                    9px;

                font-size: 11px;
            }

        }


        @media (max-height: 450px) {

            #popup {
                max-height: calc(100vh - 20px);
            }

            #popup-content {
                padding: 10px;
                min-height: 60px;
            }

            #popup-buttons {
                padding-bottom: 8px;
            }

        }

    </style>
</head>

<body>


<main id="question-window">

    <div id="titlebar">

        <span id="title">
            Are You An Idiot?
        </span>

        <button
            class="window-button"
            id="minimize"
            type="button"
            disabled
        >_</button>

        <button
            class="window-button"
            id="maximize"
            type="button"
            disabled
        >□</button>

        <button
            class="window-button"
            id="close"
            type="button"
        >×</button>

    </div>


    <img
        id="pictureBox1"
        src="media/idiot.gif"
        alt=""
        draggable="false"
    >


    <div id="question-area">

        <div id="question">
            Are You An Idiot ?
        </div>

    </div>


    <button
        class="answer"
        id="no"
        type="button"
    >
        No, I'm not.
    </button>


    <button
        class="answer"
        id="none"
        type="button"
    >
        I don't know =[
    </button>


    <button
        class="answer"
        id="yes"
        type="button"
    >
        Yes, I am.
    </button>

</main>


<!-- =========================================================
     POPUP
     
     IMPORTANT:
     There is intentionally NO popup titlebar here.
     The popup is only the grey Windows-style dialog itself.
     ========================================================= -->

<div id="popup-overlay">

    <div
        id="popup"
        role="dialog"
        aria-modal="true"
        aria-live="assertive"
    >

        <div id="popup-content">

            <div id="popup-icon">
                !
            </div>

            <div id="popup-message"></div>

        </div>

        <div id="popup-buttons"></div>

    </div>

</div>


<audio
    id="idiot-audio"
    preload="auto"
    loop
>
    <source
        src="/media/youare-long.mp3"
        type="audio/mpeg"
    >
</audio>


<script>

"use strict";


/* ============================================================
   ELEMENTS
   ============================================================ */

const question =
    document.getElementById("question");

const noButton =
    document.getElementById("no");

const noneButton =
    document.getElementById("none");

const yesButton =
    document.getElementById("yes");

const closeButton =
    document.getElementById("close");

const idiotAudio =
    document.getElementById("idiot-audio");

const popupOverlay =
    document.getElementById("popup-overlay");

const popup =
    document.getElementById("popup");

const popupMessage =
    document.getElementById("popup-message");

const popupButtons =
    document.getElementById("popup-buttons");

const popupIcon =
    document.getElementById("popup-icon");

const questionWindow =
    document.getElementById("question-window");

const titlebar =
    document.getElementById("titlebar");


/* ============================================================
   RESPONSIVE SCALING
   ============================================================ */

const BASE_WIDTH = 928;
const BASE_HEIGHT = 929;

let scale = 1;

let windowX = 0;
let windowY = 0;

let manuallyPositioned = false;


function updateScale() {

    const viewportWidth =
        Math.max(
            1,
            window.innerWidth
        );

    const viewportHeight =
        Math.max(
            1,
            window.innerHeight
        );

    scale = Math.min(
        viewportWidth / BASE_WIDTH,
        viewportHeight / BASE_HEIGHT
    );

    scale = Math.min(
        scale,
        1
    );

    scale = Math.max(
        scale,
        0.1
    );


    if (!manuallyPositioned) {

        questionWindow.style.left =
            "50%";

        questionWindow.style.top =
            "50%";

        questionWindow.style.transform =
            `translate(-50%, -50%) scale(${scale})`;

    } else {

        questionWindow.style.transform =
            `scale(${scale})`;

        const renderedWidth =
            BASE_WIDTH * scale;

        const renderedHeight =
            BASE_HEIGHT * scale;

        const maxX =
            Math.max(
                0,
                window.innerWidth -
                renderedWidth
            );

        const maxY =
            Math.max(
                0,
                window.innerHeight -
                renderedHeight
            );

        windowX =
            Math.min(
                Math.max(
                    windowX,
                    0
                ),
                maxX
            );

        windowY =
            Math.min(
                Math.max(
                    windowY,
                    0
                ),
                maxY
            );

        questionWindow.style.left =
            `${windowX}px`;

        questionWindow.style.top =
            `${windowY}px`;

    }

}


updateScale();


window.addEventListener(
    "resize",
    updateScale
);


window.addEventListener(
    "orientationchange",
    () => {

        setTimeout(
            updateScale,
            50
        );

    }
);


/* ============================================================
   POPUP DYNAMIC POSITION / SIZE
   ============================================================ */

/*
 * CSS already handles the main sizing.
 *
 * This function is intentionally lightweight.
 * It only makes sure that an unusually small viewport
 * can never leave the dialog outside the visible area.
 */

function updatePopupBounds() {

    if (
        !popupOverlay.classList.contains(
            "visible"
        )
    ) {

        return;

    }

    const margin = 10;

    const maxWidth =
        Math.max(
            120,
            window.innerWidth -
            margin * 2
        );

    const maxHeight =
        Math.max(
            60,
            window.innerHeight -
            margin * 2
        );

    popup.style.maxWidth =
        `${maxWidth}px`;

    popup.style.maxHeight =
        `${maxHeight}px`;

}


window.addEventListener(
    "resize",
    updatePopupBounds
);

window.addEventListener(
    "orientationchange",
    () => {

        setTimeout(
            updatePopupBounds,
            50
        );

    }
);


/* ============================================================
   DISCORD SIZE CALCULATION
   ============================================================ */

function getDiscordPopupSize() {

    const screenWidth =
        Number(window.screen.width);

    const screenHeight =
        Number(window.screen.height);


    if (
        !Number.isFinite(screenWidth) ||
        !Number.isFinite(screenHeight) ||
        screenWidth <= 0 ||
        screenHeight <= 0
    ) {

        return {
            width: 320,
            height: 320
        };

    }


    return {

        width: Math.max(
            1,
            Math.round(
                screenWidth * 0.1875
            )
        ),

        height: Math.max(
            1,
            Math.round(
                screenHeight * 0.2222
            )
        )

    };

}


/* ============================================================
   OPENER RESIZE HANDSHAKE
   ============================================================ */

function requestOpenerResize() {

    const opener =
        window.opener;


    if (
        !opener ||
        opener.closed
    ) {

        return false;

    }


    const size =
        getDiscordPopupSize();


    try {

        opener.postMessage(
            {
                type:
                    "YOUARE_REQUEST_DISCORD_SIZE",

                width:
                    size.width,

                height:
                    size.height,

                source:
                    "popup.html",

                timestamp:
                    Date.now()
            },
            "*"
        );

        return true;

    } catch (_) {

        return false;

    }

}


function resizeSelfToDiscordSize() {

    const size =
        getDiscordPopupSize();


    requestOpenerResize();


    try {

        if (
            typeof window.resizeTo ===
            "function"
        ) {

            window.resizeTo(
                size.width,
                size.height
            );

        }

    } catch (_) {}


    requestOpenerResize();


    return size;

}


/* ============================================================
   MESSAGE BOX
   ============================================================ */

let popupResolver = null;


function showPopup(
    message,
    buttons,
    icon = "!"
) {

    popupMessage.textContent =
        message;

    popupIcon.textContent =
        icon;

    popupButtons.innerHTML =
        "";


    popupOverlay.classList.add(
        "visible"
    );


    updatePopupBounds();


    return new Promise(
        resolve => {

            popupResolver =
                resolve;


            for (
                const text of buttons
            ) {

                const button =
                    document.createElement(
                        "button"
                    );


                button.type =
                    "button";


                button.textContent =
                    text;


                button.addEventListener(
                    "click",
                    () => {

                        closePopup(
                            text
                        );

                    }
                );


                popupButtons.appendChild(
                    button
                );

            }


            const firstButton =
                popupButtons.querySelector(
                    "button"
                );


            if (firstButton) {

                /*
                 * Focus after the button has actually
                 * been inserted into the visible dialog.
                 */
                requestAnimationFrame(
                    () => {

                        try {

                            firstButton.focus();

                        } catch (_) {}

                    }
                );

            }

        }
    );

}


function closePopup(
    result = "Close"
) {

    popupOverlay.classList.remove(
        "visible"
    );


    if (popupResolver) {

        const resolve =
            popupResolver;

        popupResolver =
            null;

        resolve(result);

    }

}


/*
 * There is intentionally no popup X button anymore.
 *
 * The original behavior of closing through the
 * popup titlebar is therefore removed.
 */


/* ============================================================
   AUDIO
   ============================================================ */

function playAudio() {

    try {

        const playPromise =
            idiotAudio.play();


        if (
            playPromise &&
            typeof playPromise.catch ===
            "function"
        ) {

            playPromise.catch(
                () => {}
            );

        }

    } catch (_) {}

}


playAudio();


document.addEventListener(
    "pointerdown",
    playAudio,
    {
        once: true
    }
);


/* ============================================================
   RAINBOW QUESTION
   ============================================================ */

const fontColors = [

    "Indigo",
    "Ivory",
    "LightPink",
    "LightSkyBlue",
    "Lime",
    "MediumPurple",
    "MediumSpringGreen",
    "Pink",
    "Red",
    "Snow"

];


let timerFT = 0;


setInterval(
    () => {

        timerFT++;


        if (
            timerFT >= 1 &&
            timerFT <= 9
        ) {

            question.style.color =
                fontColors[timerFT];

        }


        if (
            timerFT >= 9
        ) {

            question.style.color =
                "Snow";

            timerFT = 0;

        }

    },
    55
);


/* ============================================================
   REDIRECT
   ============================================================ */

let redirecting = false;


function redirectToDiscord() {

    if (redirecting) {

        return;

    }


    redirecting = true;


    /*
     * Resize only as part of the user's
     * continuation action.
     */

    resizeSelfToDiscordSize();


    /*
     * Navigate immediately.
     */

    window.location.href =
        "discord.html";

}


/* ============================================================
   NO / I DON'T KNOW
   ============================================================ */

async function handleNo() {

    if (redirecting) {

        return;

    }


    await showPopup(
        "Oh... I think you are an idiot. XD",
        ["OK"],
        "!"
    );


    redirectToDiscord();

}


noButton.addEventListener(
    "click",
    handleNo
);


noneButton.addEventListener(
    "click",
    handleNo
);


/* ============================================================
   YES
   ============================================================ */

yesButton.addEventListener(
    "click",
    async () => {

        if (redirecting) {

            return;

        }


        const result =
            await showPopup(
                "Are you sure?",
                ["Yes", "No"],
                "?"
            );


        /*
         * Both choices continue to Discord.
         */

        if (
            result === "Yes" ||
            result === "No" ||
            result === "Close"
        ) {

            redirectToDiscord();

        }

    }
);


/* ============================================================
   CLOSE BUTTON
   ============================================================ */

closeButton.addEventListener(
    "click",
    redirectToDiscord
);


/* ============================================================
   ESCAPE
   ============================================================ */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape"
        ) {

            redirectToDiscord();

        }

    }
);


/* ============================================================
   RIGHT CLICK
   ============================================================ */

document.addEventListener(
    "contextmenu",
    event => {

        event.preventDefault();

    }
);


/* ============================================================
   DRAGGING
   ============================================================ */

let dragging = false;

let dragPointerId = null;

let dragStartPointerX = 0;
let dragStartPointerY = 0;

let dragStartWindowX = 0;
let dragStartWindowY = 0;


titlebar.addEventListener(
    "pointerdown",
    event => {

        if (
            event.target.closest(
                ".window-button"
            )
        ) {

            return;

        }


        dragging = true;

        dragPointerId =
            event.pointerId;


        if (
            !manuallyPositioned
        ) {

            const rect =
                questionWindow.getBoundingClientRect();


            windowX =
                rect.left;

            windowY =
                rect.top;


            manuallyPositioned =
                true;


            questionWindow.style.left =
                `${windowX}px`;

            questionWindow.style.top =
                `${windowY}px`;


            questionWindow.style.transform =
                `scale(${scale})`;

        }


        dragStartPointerX =
            event.clientX;

        dragStartPointerY =
            event.clientY;


        dragStartWindowX =
            windowX;

        dragStartWindowY =
            windowY;


        titlebar.setPointerCapture(
            event.pointerId
        );


        event.preventDefault();

    }
);


titlebar.addEventListener(
    "pointermove",
    event => {

        if (
            !dragging ||
            event.pointerId !==
            dragPointerId
        ) {

            return;

        }


        windowX =
            dragStartWindowX +
            (
                event.clientX -
                dragStartPointerX
            );


        windowY =
            dragStartWindowY +
            (
                event.clientY -
                dragStartPointerY
            );


        const renderedWidth =
            BASE_WIDTH * scale;

        const renderedHeight =
            BASE_HEIGHT * scale;


        const minVisible =
            Math.min(
                30,
                renderedWidth
            );


        const minVisibleY =
            Math.min(
                30,
                renderedHeight
            );


        const minX =
            -renderedWidth +
            minVisible;


        const maxX =
            window.innerWidth -
            minVisible;


        const minY =
            -renderedHeight +
            minVisibleY;


        const maxY =
            window.innerHeight -
            minVisibleY;


        windowX =
            Math.min(
                Math.max(
                    windowX,
                    minX
                ),
                maxX
            );


        windowY =
            Math.min(
                Math.max(
                    windowY,
                    minY
                ),
                maxY
            );


        questionWindow.style.left =
            `${windowX}px`;

        questionWindow.style.top =
            `${windowY}px`;

        questionWindow.style.transform =
            `scale(${scale})`;

    }
);


function stopDragging(event) {

    if (
        !dragging ||
        event.pointerId !==
        dragPointerId
    ) {

        return;

    }


    dragging = false;

    dragPointerId = null;


    try {

        titlebar.releasePointerCapture(
            event.pointerId
        );

    } catch (_) {}

}


titlebar.addEventListener(
    "pointerup",
    stopDragging
);


titlebar.addEventListener(
    "pointercancel",
    stopDragging
);


/* ============================================================
   PREVENT GIF DRAGGING
   ============================================================ */

document
    .getElementById("pictureBox1")
    .addEventListener(
        "dragstart",
        event => {

            event.preventDefault();

        }
    );

</script>
