<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Are You An Idiot?</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/98.css"
    >

    <style>

        /* ====================================================
           98.css does all the chrome (windows, title bars,
           buttons, bevels, fonts). Only layout / scaling /
           the original fixed 928x929 geometry lives here.
           ==================================================== */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            background: transparent;
            overflow: hidden;

            user-select: none;
            -webkit-user-select: none;

            display: flex;
            align-items: center;
            justify-content: center;
        }


        /* ---------- main window (98.css .window) ---------- */

        #question-window {
            position: absolute;

            width: 928px;
            height: 929px;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%)
                scale(1);

            transform-origin: center center;

            padding: 3px;

            overflow: hidden;
        }

        /* the window is rendered at ~0.5 scale, so the
           98.css chrome is scaled up to stay readable */

        /* fake decorative title bar: no controls, not interactive */

        #question-window > .title-bar {
            height: 25px;

            pointer-events: none;
            cursor: default;
            touch-action: none;
        }

        /* only the close button is clickable on the fake title bar */

        #question-window > .title-bar .title-bar-controls {
            pointer-events: auto;
        }

        #question-window > .title-bar .title-bar-controls button {
            width: 32px;
            height: 21px;
        }

        #question-window > .title-bar .title-bar-text {
            font-size: 15px;
            line-height: 25px;
        }

        #question-window > .window-body {
            position: absolute;

            left: 3px;
            right: 3px;
            top: 28px;
            bottom: 3px;

            margin: 0;
        }

        #pictureBox1 {
            position: absolute;

            left: 0;
            top: 0;

            width: 918px;
            height: 714px;

            display: block;

            object-fit: fill;
            pointer-events: none;
        }

        #question-area {
            position: absolute;

            left: 0;
            right: 0;

            top: 722px;
            height: 90px;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        #question {
            margin: 0;

            font-family:
                "Verdana",
                sans-serif;

            font-size: 20pt;
            font-weight: normal;

            line-height: 1.2;

            white-space: nowrap;

            color: Indigo;
            text-align: center;
        }

        /* answer buttons: 98.css button look, original geometry */

        .answer {
            position: absolute;

            top: 832px;
            height: 57px;

            padding: 0;

            /* font comes from 98.css (MS Sans Serif) */

            font-size: 12pt;
        }

        #no {
            left: 25px;
            width: 262px;
        }

        #none {
            left: 295px;
            width: 354px;
        }

        #yes {
            left: 657px;
            width: 244px;
        }


        /* ---------- message box (98.css .window) ---------- */

        #popup-overlay {
            position: fixed;

            inset: 0;

            display: none;

            z-index: 100000;
        }

        #popup-overlay.visible {
            display: block;
        }

        #popup {
            position: fixed;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%);

            width: min(
                500px,
                calc(100vw - 30px),
                calc(100vh - 30px)
            );

            min-width: min(
                390px,
                calc(100vw - 30px),
                calc(100vh - 30px)
            );
        }

        #popup-content {
            min-height: 90px;

            display: flex;
            align-items: center;

            padding: 14px 6px;
        }

        #popup-icon {
            width: 32px;
            min-width: 32px;

            height: 32px;

            margin-right: 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 26px;
            font-weight: bold;
            line-height: 32px;

            text-align: center;
        }

        #popup-message {
            flex: 1;

            line-height: 1.35;
        }

        /* .field-row from 98.css handles the button row spacing */

        #popup-buttons {
            justify-content: center;

            padding: 0 6px 8px;
        }

        /* button min-width comes from 98.css */

    </style>

</head>

<body>

    <main
        id="question-window"
        class="window"
    >

        <div
            id="titlebar"
            class="title-bar"
        >

            <div
                id="title"
                class="title-bar-text"
            >
                Are You An Idiot?
            </div>

            <div class="title-bar-controls">

                <button
                    id="question-close"
                    type="button"
                    aria-label="Close"
                ></button>

            </div>

        </div>


        <div class="window-body">

            <img
                id="pictureBox1"
                class="sunken-panel"
                src="media/idiot.gif"
                alt=""
                draggable="false"
            >


            <div id="question-area">

                <div id="question">
                    Are You An Idiot ?
                </div>

            </div>


            <button
                class="answer"
                id="no"
                type="button"
            >
                No, I'm not.
            </button>


            <button
                class="answer"
                id="none"
                type="button"
            >
                I don't know =[
            </button>


            <button
                class="answer default"
                id="yes"
                type="button"
            >
                Yes, I am.
            </button>

        </div>

    </main>


    <div id="popup-overlay">

        <div
            id="popup"
            class="window"
        >

            <div
                id="popup-titlebar"
                class="title-bar"
            >

                <div
                    id="popup-title"
                    class="title-bar-text"
                >
                    YouAreAnIdiot
                </div>

                <div class="title-bar-controls">

                    <button
                        id="popup-close"
                        type="button"
                        aria-label="Close"
                    ></button>

                </div>

            </div>


            <div class="window-body">

                <div id="popup-content">

                    <div id="popup-icon">
                        !
                    </div>

                    <div id="popup-message"></div>

                </div>


                <div
                    id="popup-buttons"
                    class="field-row"
                ></div>

            </div>

        </div>

    </div>


    <!-- ========================================================
         AUDIO

         C# Question constructor:
             you_are_an_idiot starts immediately.

         C# button_MouseHover:
             startup audio stops.
             long audio starts.

         C# WaveOut_PlaybackStopped:
             long audio starts again.
         ======================================================== -->

    <audio
        id="idiot-start-audio"
        preload="auto"
    >

        <source
            src="/media/youare.mp3"
            type="audio/mpeg"
        >

    </audio>


    <audio
        id="idiot-long-audio"
        preload="auto"
    >

        <source
            src="/media/youare-long.mp3"
            type="audio/mpeg"
        >

    </audio>


    <script>

        "use strict";


        /* ====================================================
           ELEMENTS
           ==================================================== */

        const question =
            document.getElementById("question");

        const noButton =
            document.getElementById("no");

        const noneButton =
            document.getElementById("none");

        const yesButton =
            document.getElementById("yes");

        const idiotStartAudio =
            document.getElementById("idiot-start-audio");

        const idiotLongAudio =
            document.getElementById("idiot-long-audio");

        const popupOverlay =
            document.getElementById("popup-overlay");

        const popupMessage =
            document.getElementById("popup-message");

        const popupButtons =
            document.getElementById("popup-buttons");

        const popupClose =
            document.getElementById("popup-close");

        const popupIcon =
            document.getElementById("popup-icon");

        const questionWindow =
            document.getElementById("question-window");

        const titlebar =
            document.getElementById("titlebar");


        /* ====================================================
           RESPONSIVE SCALING
           ==================================================== */

        const BASE_WIDTH = 928;
        const BASE_HEIGHT = 929;

        let scale = 1;

        let windowX = 0;
        let windowY = 0;

        let manuallyPositioned = false;


        function updateScale() {

            const viewportWidth =
                Math.max(
                    1,
                    window.innerWidth
                );

            const viewportHeight =
                Math.max(
                    1,
                    window.innerHeight
                );

            scale = Math.min(
                (viewportWidth - 6) / BASE_WIDTH,
                (viewportHeight - 6) / BASE_HEIGHT
            );

            scale = Math.min(
                scale,
                1
            );

            scale = Math.max(
                scale,
                0.1
            );


            if (!manuallyPositioned) {

                questionWindow.style.left =
                    "50%";

                questionWindow.style.top =
                    "50%";

                questionWindow.style.transform =
                    `translate(-50%, -50%) scale(${scale})`;

            }
            else {

                questionWindow.style.transform =
                    `scale(${scale})`;

                const renderedWidth =
                    BASE_WIDTH * scale;

                const renderedHeight =
                    BASE_HEIGHT * scale;

                const maxX =
                    Math.max(
                        0,
                        window.innerWidth -
                        renderedWidth
                    );

                const maxY =
                    Math.max(
                        0,
                        window.innerHeight -
                        renderedHeight
                    );

                windowX =
                    Math.min(
                        Math.max(
                            windowX,
                            0
                        ),
                        maxX
                    );

                windowY =
                    Math.min(
                        Math.max(
                            windowY,
                            0
                        ),
                        maxY
                    );

                questionWindow.style.left =
                    `${windowX}px`;

                questionWindow.style.top =
                    `${windowY}px`;

            }

        }


        /* ====================================================
           REAL WINDOW <-> FAKE WINDOW SIZE MATCH
           ==================================================== */

        const SCREEN_MARGIN = 20;
        const BROWSER_CHROME_HEIGHT = 90;
        const MAX_SCREEN_SHARE = 0.6;

        const PREFERRED_WIDTH = 520;
        const PREFERRED_HEIGHT = 521;


        function getTargetContentSize() {

            const availableWidth =
                Math.max(
                    1,
                    Number(screen.availWidth) -
                    SCREEN_MARGIN * 2
                );

            const availableHeight =
                Math.max(
                    1,
                    Number(screen.availHeight) -
                    SCREEN_MARGIN * 2
                );

            const maxContentWidth =
                Math.min(
                    availableWidth,
                    Number(screen.availWidth) *
                    MAX_SCREEN_SHARE
                );

            const maxContentHeight =
                Math.min(
                    availableHeight -
                    BROWSER_CHROME_HEIGHT,
                    Number(screen.availHeight) *
                    MAX_SCREEN_SHARE
                );

            let targetScale =
                Math.min(
                    maxContentWidth / BASE_WIDTH,
                    maxContentHeight / BASE_HEIGHT,
                    PREFERRED_WIDTH / BASE_WIDTH,
                    PREFERRED_HEIGHT / BASE_HEIGHT
                );


            if (
                !Number.isFinite(targetScale) ||
                targetScale <= 0
            ) {

                targetScale = 0.5;

            }


            return {

                width:
                    Math.round(
                        BASE_WIDTH *
                        targetScale
                    ),

                height:
                    Math.round(
                        BASE_HEIGHT *
                        targetScale
                    )

            };

        }


        function snapWindowToContent() {

            try {

                const target =
                    getTargetContentSize();

                const chromeWidth =
                    Math.max(
                        0,
                        window.outerWidth -
                        window.innerWidth
                    );

                const chromeHeight =
                    Math.max(
                        0,
                        window.outerHeight -
                        window.innerHeight
                    );

                const offBy =
                    Math.abs(
                        window.innerWidth -
                        target.width
                    ) > 2 ||
                    Math.abs(
                        window.innerHeight -
                        target.height
                    ) > 2;


                if (
                    offBy &&
                    typeof window.resizeTo ===
                    "function"
                ) {

                    window.resizeTo(
                        target.width +
                        chromeWidth,

                        target.height +
                        chromeHeight
                    );

                }


                centerWindow();

            }
            catch (_) {}


            updateScale();

        }


        function centerWindow() {

            try {

                if (
                    typeof window.moveTo !==
                    "function"
                ) {

                    return;

                }


                const availLeft =
                    Number(
                        screen.availLeft
                    ) || 0;

                const availTop =
                    Number(
                        screen.availTop
                    ) || 0;

                const availWidth =
                    Number(
                        screen.availWidth
                    ) ||
                    Number(
                        screen.width
                    );

                const availHeight =
                    Number(
                        screen.availHeight
                    ) ||
                    Number(
                        screen.height
                    );


                const left =
                    Math.round(
                        availLeft +
                        (
                            availWidth -
                            window.outerWidth
                        ) / 2
                    );


                const top =
                    Math.round(
                        availTop +
                        (
                            availHeight -
                            window.outerHeight
                        ) / 2
                    );


                window.moveTo(
                    Math.max(
                        availLeft,
                        left
                    ),

                    Math.max(
                        availTop,
                        top
                    )
                );

            }
            catch (_) {}

        }


        snapWindowToContent();


        setTimeout(
            snapWindowToContent,
            120
        );


        setTimeout(
            snapWindowToContent,
            400
        );


        window.addEventListener(
            "resize",
            updateScale
        );


        window.addEventListener(
            "orientationchange",
            () => {

                setTimeout(
                    updateScale,
                    50
                );

            }
        );


        /* ====================================================
           DISCORD SIZE CALCULATION
           ==================================================== */

        function getDiscordPopupSize() {

            const screenWidth =
                Number(
                    window.screen.width
                );

            const screenHeight =
                Number(
                    window.screen.height
                );


            if (
                !Number.isFinite(screenWidth) ||
                !Number.isFinite(screenHeight) ||
                screenWidth <= 0 ||
                screenHeight <= 0
            ) {

                return {
                    width: 320,
                    height: 320
                };

            }


            return {

                width:
                    Math.max(
                        1,
                        Math.round(
                            screenWidth *
                            0.1875
                        )
                    ),

                height:
                    Math.max(
                        1,
                        Math.round(
                            screenHeight *
                            0.2222
                        )
                    )

            };

        }


        /* ====================================================
           OPENER RESIZE HANDSHAKE
           ==================================================== */

        function requestOpenerResize() {

            const opener =
                window.opener;


            if (
                !opener ||
                opener.closed
            ) {

                return false;

            }


            const size =
                getDiscordPopupSize();


            try {

                opener.postMessage(
                    {
                        type:
                            "YOUARE_REQUEST_DISCORD_SIZE",

                        width:
                            size.width,

                        height:
                            size.height,

                        source:
                            "popup.html",

                        timestamp:
                            Date.now()
                    },

                    "*"
                );


                return true;

            }
            catch (_) {

                return false;

            }

        }


        function resizeSelfToDiscordSize() {

            const size =
                getDiscordPopupSize();


            requestOpenerResize();


            try {

                if (
                    typeof window.resizeTo ===
                    "function"
                ) {

                    window.resizeTo(
                        size.width,
                        size.height
                    );

                    centerWindow();

                }

            }
            catch (_) {}


            requestOpenerResize();


            return size;

        }


        /* ====================================================
           MESSAGE BOX
           ==================================================== */

        let popupResolver = null;


        function showPopup(
            message,
            buttons,
            icon = "!"
        ) {

            popupMessage.textContent =
                message;

            popupIcon.textContent =
                icon;

            popupButtons.innerHTML =
                "";


            popupOverlay.classList.add(
                "visible"
            );


            return new Promise(
                resolve => {

                    popupResolver =
                        resolve;


                    for (
                        const text of buttons
                    ) {

                        const button =
                            document.createElement(
                                "button"
                            );


                        button.type =
                            "button";

                        button.textContent =
                            text;


                        button.addEventListener(
                            "click",
                            () => {

                                closePopup(
                                    text
                                );

                            }
                        );


                        popupButtons.appendChild(
                            button
                        );

                    }


                    const firstButton =
                        popupButtons.querySelector(
                            "button"
                        );


                    if (firstButton) {

                        firstButton.focus();

                    }

                }
            );

        }


        function closePopup(
            result = "Close"
        ) {

            popupOverlay.classList.remove(
                "visible"
            );


            if (popupResolver) {

                const resolve =
                    popupResolver;

                popupResolver =
                    null;

                resolve(result);

            }

        }


        popupClose.addEventListener(
            "click",
            () => {

                closePopup(
                    "Close"
                );

            }
        );


        /* ====================================================
           AUDIO
           ====================================================

           Exact behavior based on the C# Question class.

           Constructor:
               short audio starts.

           button_MouseHover:
               short audio is stopped.
               long audio starts.

           PlaybackStopped:
               long audio loops.
           ==================================================== */

        let longAudioStarted = false;


        function playStartAudio() {

            if (!idiotStartAudio) {
                return;
            }


            try {

                idiotStartAudio.currentTime =
                    0;


                const promise =
                    idiotStartAudio.play();


                if (
                    promise &&
                    typeof promise.catch ===
                    "function"
                ) {

                    promise.catch(
                        () => {}
                    );

                }

            }
            catch (_) {}

        }


        function stopStartAudio() {

            if (!idiotStartAudio) {
                return;
            }


            try {

                idiotStartAudio.pause();

                idiotStartAudio.currentTime =
                    0;

            }
            catch (_) {}

        }


        function playLongAudio() {

            if (!idiotLongAudio) {
                return;
            }


            /*
             * Same idea as:
             *
             * if (waveOut.PlaybackState ==
             *     PlaybackState.Playing)
             *
             *     return;
             */
            if (
                !idiotLongAudio.paused &&
                !idiotLongAudio.ended
            ) {

                return;

            }


            try {

                idiotLongAudio.currentTime =
                    0;

                longAudioStarted =
                    true;


                const promise =
                    idiotLongAudio.play();


                if (
                    promise &&
                    typeof promise.catch ===
                    "function"
                ) {

                    promise.catch(
                        () => {}
                    );

                }

            }
            catch (_) {}

        }


        /*
         * Equivalent of:
         *
         * WaveOut_PlaybackStopped
         *
         * provider.Position = 0;
         * waveOut.Play();
         */
        idiotLongAudio.addEventListener(
            "ended",
            () => {

                if (!longAudioStarted) {
                    return;
                }


                try {

                    idiotLongAudio.currentTime =
                        0;


                    const promise =
                        idiotLongAudio.play();


                    if (
                        promise &&
                        typeof promise.catch ===
                        "function"
                    ) {

                        promise.catch(
                            () => {}
                        );

                    }

                }
                catch (_) {}

            }
        );


        /*
         * C# constructor:
         *
         * waveOutStart.Init(provider);
         * waveOutStart.Play();
         */
        playStartAudio();


        /*
         * Browser autoplay fallback.
         *
         * If the browser blocks automatic
         * playback, retry after the first
         * user interaction.
         */
        document.addEventListener(
            "pointerdown",
            () => {

                if (!longAudioStarted) {

                    playStartAudio();

                }

            },
            {
                once: true
            }
        );


        /* ====================================================
           BUTTON HOVER AUDIO
           ==================================================== */

        function handleAnswerHover() {

            /*
             * C#:
             *
             * waveOutStart.Dispose();
             */
            stopStartAudio();


            /*
             * C#:
             *
             * waveOut.Init(provider);
             * waveOut.Play();
             */
            playLongAudio();

        }


        /*
         * WinForms:
         *
         * No.MouseHover
         * None.MouseHover
         * Yes.MouseHover
         */
        noButton.addEventListener(
            "mouseenter",
            handleAnswerHover
        );

        noneButton.addEventListener(
            "mouseenter",
            handleAnswerHover
        );

        yesButton.addEventListener(
            "mouseenter",
            handleAnswerHover
        );


        /*
         * Pointer fallback for touch / mobile.
         */
        noButton.addEventListener(
            "pointerenter",
            handleAnswerHover
        );

        noneButton.addEventListener(
            "pointerenter",
            handleAnswerHover
        );

        yesButton.addEventListener(
            "pointerenter",
            handleAnswerHover
        );


        /* ====================================================
           RAINBOW QUESTION
           ==================================================== */

        const fontColors = [

            "Indigo",
            "Ivory",
            "LightPink",
            "LightSkyBlue",
            "Lime",
            "MediumPurple",
            "MediumSpringGreen",
            "Pink",
            "Red",
            "Snow"

        ];


        let timerFT = 0;


        setInterval(
            () => {

                timerFT++;


                if (
                    timerFT >= 1 &&
                    timerFT <= 9
                ) {

                    question.style.color =
                        fontColors[timerFT];

                }


                if (
                    timerFT >= 9
                ) {

                    question.style.color =
                        "Snow";

                    timerFT = 0;

                }

            },
            55
        );


        /* ====================================================
           REDIRECT
           ==================================================== */

        let redirecting = false;


        function redirectToDiscord() {

            if (redirecting) {
                return;
            }


            redirecting = true;


            resizeSelfToDiscordSize();


            window.location.href =
                "lol.html";

        }


        /* ====================================================
           NO / I DON'T KNOW
           ==================================================== */

        async function handleNo() {

            if (redirecting) {
                return;
            }


            await showPopup(
                "Oh... I think you are an idiot. XD",
                ["OK"],
                "!"
            );


            redirectToDiscord();

        }


        const questionClose =
            document.getElementById("question-close");


        if (questionClose) {

            questionClose.addEventListener(
                "click",
                () => {
                    redirectToDiscord();
                }
            );

        }


        noButton.addEventListener(
            "click",
            handleNo
        );


        noneButton.addEventListener(
            "click",
            handleNo
        );


        /* ====================================================
           YES
           ==================================================== */

        yesButton.addEventListener(
            "click",
            async () => {

                if (redirecting) {
                    return;
                }


                const result =
                    await showPopup(
                        "Are you sure?",
                        ["Yes", "No"],
                        "?"
                    );


                if (
                    result === "Yes" ||
                    result === "No" ||
                    result === "Close"
                ) {

                    redirectToDiscord();

                }

            }
        );


        /* ====================================================
           ESCAPE
           ==================================================== */

        document.addEventListener(
            "keydown",
            event => {

                if (
                    event.key === "Escape"
                ) {

                    redirectToDiscord();

                }

            }
        );


        /* ====================================================
           RIGHT CLICK
           ==================================================== */

        document.addEventListener(
            "contextmenu",
            event => {

                event.preventDefault();

            }
        );

    </script>

</body>

</html>
