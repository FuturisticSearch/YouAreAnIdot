"use strict";


/* ============================================================
   ELEMENTS
   ============================================================ */

const question =
    document.getElementById("question");

const noButton =
    document.getElementById("no");

const noneButton =
    document.getElementById("none");

const yesButton =
    document.getElementById("yes");

const idiotAudio =
    document.getElementById("idiot-audio");

const popupOverlay =
    document.getElementById("popup-overlay");

const popupMessage =
    document.getElementById("popup-message");

const popupButtons =
    document.getElementById("popup-buttons");

const popupClose =
    document.getElementById("popup-close");

const popupIcon =
    document.getElementById("popup-icon");

const questionWindow =
    document.getElementById("question-window");

const titlebar =
    document.getElementById("titlebar");


/* ============================================================
   RESPONSIVE SCALING
   ============================================================ */

const BASE_WIDTH = 928;
const BASE_HEIGHT = 929;

let scale = 1;

let windowX = 0;
let windowY = 0;

let manuallyPositioned = false;


function updateScale() {

    const viewportWidth =
        Math.max(1, window.innerWidth);

    const viewportHeight =
        Math.max(1, window.innerHeight);

    scale = Math.min(
        (viewportWidth - 6) / BASE_WIDTH,
        (viewportHeight - 6) / BASE_HEIGHT
    );

    scale = Math.min(scale, 1);
    scale = Math.max(scale, 0.1);

    if (!manuallyPositioned) {

        questionWindow.style.left =
            "50%";

        questionWindow.style.top =
            "50%";

        questionWindow.style.transform =
            `translate(-50%, -50%) scale(${scale})`;

    } else {

        questionWindow.style.transform =
            `scale(${scale})`;

        const renderedWidth =
            BASE_WIDTH * scale;

        const renderedHeight =
            BASE_HEIGHT * scale;

        const maxX =
            Math.max(
                0,
                window.innerWidth -
                renderedWidth
            );

        const maxY =
            Math.max(
                0,
                window.innerHeight -
                renderedHeight
            );

        windowX =
            Math.min(
                Math.max(windowX, 0),
                maxX
            );

        windowY =
            Math.min(
                Math.max(windowY, 0),
                maxY
            );

        questionWindow.style.left =
            `${windowX}px`;

        questionWindow.style.top =
            `${windowY}px`;
    }
}


/* ============================================================
   REAL WINDOW <-> FAKE WINDOW SIZE MATCH

   These numbers MUST stay identical to
   index.html (getQuestionPopupDimensions).
   ============================================================ */

const SCREEN_MARGIN = 20;
const BROWSER_CHROME_HEIGHT = 90;
const MAX_SCREEN_SHARE = 0.6;

/*
 * The original "You Are An Idiot" dialog is
 * a small window, so cap the real popup at
 * that size instead of the 928x929 artwork.
 */
const PREFERRED_WIDTH = 520;
const PREFERRED_HEIGHT = 521;



function getTargetContentSize() {

    const availableWidth =
        Math.max(
            1,
            Number(screen.availWidth) -
            SCREEN_MARGIN * 2
        );

    const availableHeight =
        Math.max(
            1,
            Number(screen.availHeight) -
            SCREEN_MARGIN * 2
        );

    const maxContentWidth =
        Math.min(
            availableWidth,
            Number(screen.availWidth) *
            MAX_SCREEN_SHARE
        );

    const maxContentHeight =
        Math.min(
            availableHeight -
            BROWSER_CHROME_HEIGHT,
            Number(screen.availHeight) *
            MAX_SCREEN_SHARE
        );

    let targetScale =
        Math.min(
            maxContentWidth / BASE_WIDTH,
            maxContentHeight / BASE_HEIGHT,
            PREFERRED_WIDTH / BASE_WIDTH,
            PREFERRED_HEIGHT / BASE_HEIGHT
        );


    if (
        !Number.isFinite(targetScale) ||
        targetScale <= 0
    ) {

        targetScale = 0.5;

    }

    return {

        width:
            Math.round(
                BASE_WIDTH * targetScale
            ),

        height:
            Math.round(
                BASE_HEIGHT * targetScale
            )

    };

}


/*
 * Corrects the real browser window so its
 * content area is exactly the size the fake
 * Windows 95 window is drawn at.
 */
function snapWindowToContent() {

    try {

        const target =
            getTargetContentSize();

        const chromeWidth =
            Math.max(
                0,
                window.outerWidth -
                window.innerWidth
            );

        const chromeHeight =
            Math.max(
                0,
                window.outerHeight -
                window.innerHeight
            );

        const offBy =
            Math.abs(
                window.innerWidth -
                target.width
            ) > 2 ||
            Math.abs(
                window.innerHeight -
                target.height
            ) > 2;

        if (
            offBy &&
            typeof window.resizeTo ===
            "function"
        ) {

            window.resizeTo(
                target.width + chromeWidth,
                target.height + chromeHeight
            );

        }

        centerWindow();

    } catch (_) {}

    updateScale();

}


/*
 * Re-centers the real browser window on the
 * available screen area after a resize.
 */
function centerWindow() {

    try {

        if (
            typeof window.moveTo !==
            "function"
        ) {

            return;

        }

        const availLeft =
            Number(
                screen.availLeft
            ) || 0;

        const availTop =
            Number(
                screen.availTop
            ) || 0;

        const availWidth =
            Number(
                screen.availWidth
            ) ||
            Number(
                screen.width
            );

        const availHeight =
            Number(
                screen.availHeight
            ) ||
            Number(
                screen.height
            );

        const left =
            Math.round(
                availLeft +
                (availWidth -
                    window.outerWidth) / 2
            );

        const top =
            Math.round(
                availTop +
                (availHeight -
                    window.outerHeight) / 2
            );

        window.moveTo(
            Math.max(availLeft, left),
            Math.max(availTop, top)
        );

    } catch (_) {}

}



snapWindowToContent();

setTimeout(
    snapWindowToContent,
    120
);

setTimeout(
    snapWindowToContent,
    400
);



window.addEventListener(
    "resize",
    updateScale
);


window.addEventListener(
    "orientationchange",
    () => {

        setTimeout(
            updateScale,
            50
        );

    }
);


/* ============================================================
   DISCORD SIZE CALCULATION
   IMPORTANT:
   This is only used after the user continues.
   ============================================================ */

function getDiscordPopupSize() {

    const screenWidth =
        Number(window.screen.width);

    const screenHeight =
        Number(window.screen.height);

    if (
        !Number.isFinite(screenWidth) ||
        !Number.isFinite(screenHeight) ||
        screenWidth <= 0 ||
        screenHeight <= 0
    ) {

        return {
            width: 320,
            height: 320
        };

    }

    return {

        width: Math.max(
            1,
            Math.round(
                screenWidth * 0.1875
            )
        ),

        height: Math.max(
            1,
            Math.round(
                screenHeight * 0.2222
            )
        )

    };

}


/* ============================================================
   OPENER RESIZE HANDSHAKE
   ============================================================ */

function requestOpenerResize() {

    const opener =
        window.opener;

    if (
        !opener ||
        opener.closed
    ) {

        return false;

    }

    const size =
        getDiscordPopupSize();

    try {

        opener.postMessage(
            {
                type:
                    "YOUARE_REQUEST_DISCORD_SIZE",

                width:
                    size.width,

                height:
                    size.height,

                source:
                    "popup.html",

                timestamp:
                    Date.now()
            },
            "*"
        );

        return true;

    } catch (_) {

        return false;

    }

}


function resizeSelfToDiscordSize() {

    const size =
        getDiscordPopupSize();

    /*
     * Send the resize request immediately
     * before navigating.
     */
    requestOpenerResize();

    try {

        if (
            typeof window.resizeTo ===
            "function"
        ) {

            window.resizeTo(
                size.width,
                size.height
            );

            centerWindow();

        }


    } catch (_) {}

    /*
     * Send again after resizeTo().
     * This is still part of the user's
     * explicit continuation action.
     */
    requestOpenerResize();

    return size;

}


/* ============================================================
   MESSAGE BOX
   ============================================================ */

let popupResolver = null;


function showPopup(
    message,
    buttons,
    icon = "!"
) {

    popupMessage.textContent =
        message;

    popupIcon.textContent =
        icon;

    popupButtons.innerHTML =
        "";

    popupOverlay.classList.add(
        "visible"
    );

    return new Promise(
        resolve => {

            popupResolver =
                resolve;

            for (
                const text of buttons
            ) {

                const button =
                    document.createElement(
                        "button"
                    );

                button.type =
                    "button";

                button.textContent =
                    text;

                button.addEventListener(
                    "click",
                    () => {

                        closePopup(
                            text
                        );

                    }
                );

                popupButtons.appendChild(
                    button
                );

            }

            const firstButton =
                popupButtons.querySelector(
                    "button"
                );

            if (firstButton) {

                firstButton.focus();

            }

        }
    );

}


function closePopup(
    result = "Close"
) {

    popupOverlay.classList.remove(
        "visible"
    );

    if (popupResolver) {

        const resolve =
            popupResolver;

        popupResolver =
            null;

        resolve(result);

    }

}


popupClose.addEventListener(
    "click",
    () => {

        closePopup(
            "Close"
        );

    }
);


/* ============================================================
   AUDIO
   ============================================================ */

function playAudio() {

    try {

        const playPromise =
            idiotAudio.play();

        if (
            playPromise &&
            typeof playPromise.catch ===
            "function"
        ) {

            playPromise.catch(
                () => {}
            );

        }

    } catch (_) {}

}


playAudio();


document.addEventListener(
    "pointerdown",
    playAudio,
    {
        once: true
    }
);


/* ============================================================
   RAINBOW QUESTION
   ============================================================ */

const fontColors = [

    "Indigo",
    "Ivory",
    "LightPink",
    "LightSkyBlue",
    "Lime",
    "MediumPurple",
    "MediumSpringGreen",
    "Pink",
    "Red",
    "Snow"

];


let timerFT = 0;


setInterval(
    () => {

        timerFT++;

        if (
            timerFT >= 1 &&
            timerFT <= 9
        ) {

            question.style.color =
                fontColors[timerFT];

        }

        if (
            timerFT >= 9
        ) {

            question.style.color =
                "Snow";

            timerFT = 0;

        }

    },
    55
);


/* ============================================================
   REDIRECT
   ============================================================ */

let redirecting = false;


function redirectToDiscord() {

    if (redirecting) {
        return;
    }

    redirecting = true;

    /*
     * IMPORTANT:
     *
     * No resize request is made when popup.html
     * loads.
     *
     * No resize request is made while the
     * question is sitting on screen.
     *
     * The resize happens ONLY when this function
     * is reached by the user's continuation action.
     */

    resizeSelfToDiscordSize();

    /*
     * Navigate immediately.
     * No artificial timeout.
     */
    window.location.href =
        "lol.html";

}


/* ============================================================
   NO / I DON'T KNOW
   ============================================================ */

async function handleNo() {

    if (redirecting) {
        return;
    }

    await showPopup(
        "Oh... I think you are an idiot. XD",
        ["OK"],
        "!"
    );

    /*
     * Resize + redirect only after
     * the user presses OK.
     */
    redirectToDiscord();

}


noButton.addEventListener(
    "click",
    handleNo
);


noneButton.addEventListener(
    "click",
    handleNo
);


/* ============================================================
   YES
   ============================================================ */

yesButton.addEventListener(
    "click",
    async () => {

        if (redirecting) {
            return;
        }

        const result =
            await showPopup(
                "Are you sure?",
                ["Yes", "No"],
                "?"
            );

        /*
         * Both choices continue to Discord,
         * exactly like question.html.
         */
        if (
            result === "Yes" ||
            result === "No" ||
            result === "Close"
        ) {

            redirectToDiscord();

        }

    }
);


/* ============================================================
   ESCAPE
   ============================================================ */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape"
        ) {

            redirectToDiscord();

        }

    }
);


/* ============================================================
   RIGHT CLICK
   ============================================================ */

document.addEventListener(
    "contextmenu",
    event => {

        event.preventDefault();

    }
);


/* ============================================================
   DRAGGING
   ============================================================ */

let dragging = false;

let dragPointerId = null;

let dragStartPointerX = 0;
let dragStartPointerY = 0;

let dragStartWindowX = 0;
let dragStartWindowY = 0;


titlebar.addEventListener(
    "pointerdown",
    event => {

        dragging = true;

        dragPointerId =
            event.pointerId;

        if (
            !manuallyPositioned
        ) {

            const rect =
                questionWindow.getBoundingClientRect();

            windowX =
                rect.left;

            windowY =
                rect.top;

            manuallyPositioned =
                true;

            questionWindow.style.left =
                `${windowX}px`;

            questionWindow.style.top =
                `${windowY}px`;

            questionWindow.style.transform =
                `scale(${scale})`;

        }

        dragStartPointerX =
            event.clientX;

        dragStartPointerY =
            event.clientY;

        dragStartWindowX =
            windowX;

        dragStartWindowY =
            windowY;

        titlebar.setPointerCapture(
            event.pointerId
        );

        event.preventDefault();

    }
);


titlebar.addEventListener(
    "pointermove",
    event => {

        if (
            !dragging ||
            event.pointerId !==
            dragPointerId
        ) {

            return;

        }

        windowX =
            dragStartWindowX +
            (
                event.clientX -
                dragStartPointerX
            );

        windowY =
            dragStartWindowY +
            (
                event.clientY -
                dragStartPointerY
            );

        const renderedWidth =
            BASE_WIDTH * scale;

        const renderedHeight =
            BASE_HEIGHT * scale;

        const minVisible =
            Math.min(
                30,
                renderedWidth
            );

        const minVisibleY =
            Math.min(
                30,
                renderedHeight
            );

        const minX =
            -renderedWidth +
            minVisible;

        const maxX =
            window.innerWidth -
            minVisible;

        const minY =
            -renderedHeight +
            minVisibleY;

        const maxY =
            window.innerHeight -
            minVisibleY;

        windowX =
            Math.min(
                Math.max(
                    windowX,
                    minX
                ),
                maxX
            );

        windowY =
            Math.min(
                Math.max(
                    windowY,
                    minY
                ),
                maxY
            );

        questionWindow.style.left =
            `${windowX}px`;

        questionWindow.style.top =
            `${windowY}px`;

        questionWindow.style.transform =
            `scale(${scale})`;

    }
);


function stopDragging(event) {

    if (
        !dragging ||
        event.pointerId !==
        dragPointerId
    ) {

        return;

    }

    dragging = false;

    dragPointerId = null;

    try {

        titlebar.releasePointerCapture(
            event.pointerId
        );

    } catch (_) {}

}


titlebar.addEventListener(
    "pointerup",
    stopDragging
);


titlebar.addEventListener(
    "pointercancel",
    stopDragging
);

document
    .getElementById("pictureBox1")
    .addEventListener(
        "dragstart",
        event => {

            event.preventDefault();

        }
    );
