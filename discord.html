<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You Are An Idiot!</title>

    <script src="scripts/app.js"></script>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            user-select: none;
            -webkit-user-drag: none;
        }
    </style>
</head>

<body>

    <img src="/media/idiot.gif" alt="You Are An Idiot!">

    <audio id="youare-audio" autoplay loop hidden>
        <source src="/media/youare.mp3" type="audio/mpeg">
    </audio>

    <script>
        // Autoplay fallback
        document.addEventListener("click", () => {
            const audio = document.getElementById("youare-audio");

            if (audio && audio.paused) {
                audio.play().catch(() => {});
            }
        }, { once: true });
    </script>

</body>
</html>
