<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8"><meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Are You An Idiot?</title>

<style>

    /* ============================================================
       CLASSIC WINDOWS 95 BASE
       ============================================================ */

    * {
        box-sizing: border-box;
    }

    html,
    body {
        width: 100%;
        height: 100%;
        margin: 0;
    }

    body {
        background: #008080;

        overflow: hidden;

        font-family:
            "MS Sans Serif",
            "Microsoft Sans Serif",
            Tahoma,
            Arial,
            sans-serif;

        font-size: 11px;

        user-select: none;
        -webkit-user-select: none;
    }


    /* ============================================================
       POPUP OVERLAY
       ============================================================ */

    #popup-overlay {
        position: fixed;

        inset: 0;

        display: none;

        z-index: 100000;
    }

    #popup-overlay.visible {
        display: block;
    }


    /* ============================================================
       WINDOWS 95 MESSAGE BOX
       ============================================================ */

    #popup {
        position: fixed;

        left: 50%;
        top: 50%;

        transform:
            translate(-50%, -50%);

        min-width: 390px;

        max-width:
            min(
                500px,
                calc(100vw - 30px)
            );

        background: #c0c0c0;

        border: 2px solid;

        border-color:
            #ffffff
            #000000
            #000000
            #ffffff;

        box-shadow:
            inset 1px 1px 0 #dfdfdf,
            inset -1px -1px 0 #808080;

        font-family:
            "MS Sans Serif",
            "Microsoft Sans Serif",
            Tahoma,
            Arial,
            sans-serif;
    }


    /* ============================================================
       MESSAGE BOX TITLE BAR
       ============================================================ */

    #popup-titlebar {
        height: 22px;

        display: flex;

        align-items: center;

        padding-left: 4px;
        padding-right: 2px;

        background: #000080;

        color: #ffffff;

        font-size: 13px;

        font-weight: bold;
    }


    #popup-title {
        flex: 1;

        white-space: nowrap;

        overflow: hidden;

        text-overflow: ellipsis;
    }


    /* ============================================================
       MESSAGE BOX CLOSE BUTTON
       ============================================================ */

    #popup-close {
        width: 19px;
        height: 18px;

        padding: 0;

        background: #c0c0c0;

        color: #000000;

        border: 2px solid;

        border-color:
            #ffffff
            #000000
            #000000
            #ffffff;

        box-shadow:
            inset 1px 1px 0 #dfdfdf,
            inset -1px -1px 0 #808080;

        font-family:
            Arial,
            sans-serif;

        font-size: 11px;

        font-weight: bold;

        line-height: 13px;

        cursor: default;

        appearance: none;
        -webkit-appearance: none;
    }


    #popup-close:active {
        border-color:
            #000000
            #ffffff
            #ffffff
            #000000;

        box-shadow:
            inset 1px 1px 0 #808080,
            inset -1px -1px 0 #dfdfdf;
    }


    /* ============================================================
       MESSAGE CONTENT
       ============================================================ */

    #popup-content {
        min-height: 90px;

        display: flex;

        align-items: center;

        padding: 18px;
    }


    /* ============================================================
       WARNING ICON
       ============================================================ */

    #popup-icon {
        width: 32px;
        min-width: 32px;

        height: 32px;

        margin-right: 18px;

        display: flex;

        align-items: center;
        justify-content: center;

        background: #c0c0c0;

        color: #000000;

        font-family:
            Arial,
            sans-serif;

        font-size: 26px;

        font-weight: bold;

        line-height: 32px;

        text-align: center;
    }


    /* ============================================================
       MESSAGE
       ============================================================ */

    #popup-message {
        flex: 1;

        font-family:
            "MS Sans Serif",
            "Microsoft Sans Serif",
            Tahoma,
            Arial,
            sans-serif;

        font-size: 13px;

        color: #000000;

        line-height: 1.35;
    }


    /* ============================================================
       BUTTON AREA
       ============================================================ */

    #popup-buttons {
        display: flex;

        justify-content: center;

        gap: 8px;

        padding:
            0
            12px
            14px;
    }


    /* ============================================================
       CLASSIC BUTTON
       ============================================================ */

    #popup-buttons button {
        min-width: 75px;

        height: 27px;

        padding:
            2px
            12px;

        background: #c0c0c0;

        color: #000000;

        border: 2px solid;

        border-color:
            #ffffff
            #000000
            #000000
            #ffffff;

        box-shadow:
            inset 1px 1px 0 #dfdfdf,
            inset -1px -1px 0 #808080;

        font-family:
            "MS Sans Serif",
            "Microsoft Sans Serif",
            Tahoma,
            Arial,
            sans-serif;

        font-size: 12px;

        cursor: default;

        appearance: none;
        -webkit-appearance: none;
    }


    #popup-buttons button:active {
        border-color:
            #000000
            #ffffff
            #ffffff
            #000000;

        box-shadow:
            inset 1px 1px 0 #808080,
            inset -1px -1px 0 #dfdfdf;

        padding-left: 13px;
        padding-top: 3px;
    }


    #popup-buttons button:focus {
        outline: 1px dotted #000000;

        outline-offset: -5px;
    }


    /* ============================================================
       SMALL SCREENS
       ============================================================ */

    @media (max-width: 430px) {

        #popup {
            min-width: 0;

            width:
                calc(100vw - 30px);
        }

    }

</style>

</head><body><!-- ============================================================
     PERMISSION POPUP
     ============================================================ -->

<div id="popup-overlay">

    <div id="popup">

        <div id="popup-titlebar">

            <span id="popup-title">
                YouAreAnIdiot
            </span>

            <button
                id="popup-close"
                type="button"
            >×</button>

        </div>


        <div id="popup-content">

            <div id="popup-icon">
                !
            </div>


            <div id="popup-message"></div>

        </div>


        <div id="popup-buttons"></div>

    </div>

</div>


<script>

    "use strict";


    /* ============================================================
       ELEMENTS
       ============================================================ */

    const popupOverlay =
        document.getElementById(
            "popup-overlay"
        );


    const popupMessage =
        document.getElementById(
            "popup-message"
        );


    const popupButtons =
        document.getElementById(
            "popup-buttons"
        );


    const popupClose =
        document.getElementById(
            "popup-close"
        );


    const popupIcon =
        document.getElementById(
            "popup-icon"
        );


    /* ============================================================
       POPUP TEST STATE
       ============================================================ */

    const POPUP_TEST_COUNT = 3;


    const popupResults =
        new Set();


    let popupTestStarted =
        false;


    let popupAllowed =
        false;


    let popupTestFinished =
        false;


    let popupQuestionOpened =
        false;


    /* ============================================================
       PERMISSION MESSAGE STATE
       ============================================================ */

    let permissionMessageVisible =
        false;


    let popupResolver =
        null;


    /* ============================================================
       OPEN QUESTION POPUP
       ============================================================ */

    function openQuestionPopup() {

        if (
            popupQuestionOpened
        ) {
            return;
        }


        popupQuestionOpened =
            true;


        /*
         * Use the real viewport size.
         *
         * The 928x929 question window is scaled
         * by popup.html itself, so this window only
         * needs to provide a reasonable outer size.
         */

        const screenWidth =
            window.screen.availWidth ||
            window.innerWidth;


        const screenHeight =
            window.screen.availHeight ||
            window.innerHeight;


        const maxWidth =
            Math.max(
                320,
                screenWidth - 40
            );


        const maxHeight =
            Math.max(
                320,
                screenHeight - 80
            );


        /*
         * popup.html is deliberately smaller than
         * the full screen so its own responsive
         * scaling can fit the question correctly.
         */

        const width =
            Math.min(
                928,
                maxWidth
            );


        const height =
            Math.min(
                929,
                maxHeight
            );


        const left =
            Math.max(
                0,
                Math.round(
                    (
                        screenWidth -
                        width
                    ) / 2
                )
            );


        const top =
            Math.max(
                0,
                Math.round(
                    (
                        screenHeight -
                        height
                    ) / 2
                )
            );


        let popup = null;


        try {

            popup =
                window.open(
                    "popup.html",
                    "YouAreAnIdiot",
                    [
                        `width=${width}`,
                        `height=${height}`,
                        `left=${left}`,
                        `top=${top}`,
                        "resizable=yes",
                        "scrollbars=no",
                        "menubar=no",
                        "toolbar=no",
                        "location=no",
                        "status=no"
                    ].join(",")
                );

        } catch (_) {

            popup = null;

        }


        /*
         * If the actual question popup was blocked,
         * show the same permission message.
         */

        if (!popup) {

            popupQuestionOpened =
                false;


            showPopup(
                "This recreation requires pop-up windows " +
                "to be enabled in your browser. Please allow " +
                "pop-ups for this site.",
                ["OK"],
                "!"
            );

        }

    }


    /* ============================================================
       SHOW CUSTOM POPUP
       ============================================================ */

    function showPopup(
        message,
        buttons,
        icon = "!"
    ) {

        popupMessage.textContent =
            message;


        popupIcon.textContent =
            icon;


        popupButtons.innerHTML =
            "";


        popupOverlay.classList.add(
            "visible"
        );


        permissionMessageVisible =
            true;


        return new Promise(
            resolve => {

                popupResolver =
                    resolve;


                for (
                    const text of buttons
                ) {

                    const button =
                        document.createElement(
                            "button"
                        );


                    button.type =
                        "button";


                    button.textContent =
                        text;


                    button.addEventListener(
                        "click",
                        () => {

                            closePopup(
                                text
                            );

                        }
                    );


                    popupButtons.appendChild(
                        button
                    );

                }


                const firstButton =
                    popupButtons.querySelector(
                        "button"
                    );


                if (firstButton) {

                    firstButton.focus();

                }

            }
        );

    }


    /* ============================================================
       CLOSE CUSTOM POPUP
       ============================================================ */

    function closePopup(
        result = "Close"
    ) {

        popupOverlay.classList.remove(
            "visible"
        );


        permissionMessageVisible =
            false;


        if (popupResolver) {

            const resolve =
                popupResolver;


            popupResolver =
                null;


            resolve(result);

        }


        /*
         * If the test failed, allow another attempt
         * after the user has changed browser settings.
         */

        if (
            !popupAllowed &&
            !popupTestFinished
        ) {

            popupTestStarted =
                false;

        }

    }


    popupClose.addEventListener(
        "click",
        () => {

            closePopup(
                "Close"
            );

        }
    );


    /* ============================================================
       EXACT SAME MESSAGE HANDLING AS QUESTION.HTML
       ============================================================ */

    function getPermissionMessage() {

        if (
            popupAllowed
        ) {

            return null;

        }


        return (
            "This recreation requires pop-up windows " +
            "to be enabled in your browser. Please allow " +
            "pop-ups for this site."
        );

    }


    function updatePermissionMessage() {

        const message =
            getPermissionMessage();


        /*
         * All three test windows have responded.
         */

        if (!message) {

            if (
                permissionMessageVisible &&
                popupResolver
            ) {

                closePopup(
                    "Permissions complete"
                );

            }


            permissionMessageVisible =
                false;


            /*
             * Automatically launch the real
             * popup.html as soon as the third
             * test response arrives.
             */

            openQuestionPopup();

            return;

        }


        /*
         * If the permission popup is currently
         * visible, update its message.
         */

        if (
            permissionMessageVisible
        ) {

            popupMessage.textContent =
                message;

        }

    }


    /* ============================================================
       TEST RESULT HANDLER
       ============================================================ */

    window.addEventListener(
        "message",
        event => {

            /*
             * Only accept messages from this
             * exact origin.
             */

            if (
                event.origin !==
                window.location.origin
            ) {

                return;

            }


            const data =
                event.data;


            if (
                !data ||
                data.type !==
                "YOUARE_POPUP_TEST_SUCCESS"
            ) {

                return;

            }


            const id =
                String(data.id);


            /*
             * Same IDs as question.html.
             */

            if (
                ![
                    "0",
                    "1",
                    "2"
                ].includes(id)
            ) {

                return;

            }


            /*
             * Set automatically prevents duplicate
             * responses from counting twice.
             */

            popupResults.add(
                id
            );


            /*
             * Exactly three unique successful
             * responses means popups are working.
             */

            if (
                popupResults.size >=
                POPUP_TEST_COUNT
            ) {

                popupAllowed =
                    true;


                popupTestFinished =
                    true;

            }


            updatePermissionMessage();

        }
    );


    /* ============================================================
       THREE-WINDOW POPUP TEST
       ============================================================ */

    function testPopupPermission() {

        if (
            popupTestStarted
        ) {

            return popupAllowed;

        }


        popupTestStarted =
            true;


        popupResults.clear();


        popupAllowed =
            false;


        popupTestFinished =
            false;


        /*
         * Open all three test windows exactly
         * like question.html.
         */

        for (
            let i = 0;
            i < POPUP_TEST_COUNT;
            i++
        ) {

            try {

                const popup =
                    window.open(
                        `test.html?id=${i}`,
                        `youare_popup_test_${i}`,
                        [
                            "width=1",
                            "height=1",
                            "left=-10000",
                            "top=-10000"
                        ].join(",")
                    );


                /*
                 * Do not require the response
                 * immediately.
                 *
                 * test.html can report later.
                 */

                void popup;

            } catch (_) {

                /*
                 * Blocked popups simply don't
                 * report success.
                 */

            }

        }


        return popupAllowed;

    }


    /* ============================================================
       STARTUP
       ============================================================ */

    window.addEventListener(
        "load",
        () => {

            /*
             * This is intentionally started
             * immediately on visiting index.html.
             */

            testPopupPermission();


            /*
             * If the browser blocks the test
             * windows, there will be no success
             * messages. Show the same permission
             * dialog after a reasonable grace
             * period.
             *
             * Importantly, this does NOT invalidate
             * late responses.
             */

            setTimeout(
                () => {

                    if (
                        !popupAllowed
                    ) {

                        showPopup(
                            getPermissionMessage(),
                            ["OK"],
                            "!"
                        );

                    }

                },
                1500
            );

        },
        {
            once: true
        }
    );


    /* ============================================================
       ESCAPE
       ============================================================ */

    document.addEventListener(
        "keydown",
        event => {

            if (
                event.key === "Escape"
            ) {

                closePopup();

            }

        }
    );


    /* ============================================================
       RIGHT CLICK
       ============================================================ */

    document.addEventListener(
        "contextmenu",
        event => {

            event.preventDefault();

        }
    );

</script>

</body></html>
