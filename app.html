<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Are you an idiot?</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            background: #008080;

            overflow: hidden;

            font-family:
                "MS Sans Serif",
                "Microsoft Sans Serif",
                Tahoma,
                Arial,
                sans-serif;

            font-size: 11px;

            user-select: none;
            -webkit-user-select: none;

            display: flex;

            align-items: center;
            justify-content: center;
        }


        #popup-overlay {
            position: fixed;

            inset: 0;

            display: none;

            z-index: 100000;
        }


        #popup-overlay.visible {
            display: block;
        }


        #popup {
            position: fixed;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%);

            width:
                min(
                    500px,
                    calc(100vw - 30px)
                );

            background: #c0c0c0;

            border: 2px solid;

            border-color:
                #ffffff
                #000000
                #000000
                #ffffff;

            box-shadow:
                inset 1px 1px 0 #dfdfdf,
                inset -1px -1px 0 #808080;
        }


        #popup-titlebar {
            height: 22px;

            display: flex;

            align-items: center;

            padding-left: 4px;
            padding-right: 2px;

            background: #000080;

            color: #ffffff;

            font-size: 13px;
            font-weight: bold;

            line-height: 18px;
        }


        #popup-title {
            flex: 1;

            white-space: nowrap;

            overflow: hidden;
            text-overflow: ellipsis;
        }


        #popup-close {
            width: 19px;
            height: 18px;

            padding: 0;

            background: #c0c0c0;

            border: 2px solid;

            border-color:
                #ffffff
                #000000
                #000000
                #ffffff;

            box-shadow:
                inset 1px 1px 0 #dfdfdf,
                inset -1px -1px 0 #808080;

            font-family:
                Arial,
                sans-serif;

            font-size: 11px;
            font-weight: bold;

            line-height: 13px;

            cursor: default;
        }


        #popup-close:active {
            border-color:
                #000000
                #ffffff
                #ffffff
                #000000;

            box-shadow:
                inset 1px 1px 0 #808080,
                inset -1px -1px 0 #dfdfdf;
        }


        #popup-content {
            min-height: 90px;

            display: flex;

            align-items: center;

            padding: 18px;
        }


        #popup-icon {
            width: 32px;
            min-width: 32px;

            height: 32px;

            margin-right: 18px;

            display: flex;

            align-items: center;
            justify-content: center;

            color: #000000;

            font-family:
                Arial,
                sans-serif;

            font-size: 26px;
            font-weight: bold;

            line-height: 32px;

            text-align: center;
        }


        #popup-message {
            flex: 1;

            font-size: 13px;

            color: #000000;

            line-height: 1.35;
        }


        #popup-buttons {
            display: flex;

            justify-content: center;

            gap: 8px;

            padding:
                0
                12px
                14px;
        }


        #popup-buttons button {
            min-width: 75px;

            height: 27px;

            padding:
                2px
                12px;

            background: #c0c0c0;

            border: 2px solid;

            border-color:
                #ffffff
                #000000
                #000000
                #ffffff;

            box-shadow:
                inset 1px 1px 0 #dfdfdf,
                inset -1px -1px 0 #808080;

            font-family:
                "MS Sans Serif",
                "Microsoft Sans Serif",
                Tahoma,
                Arial,
                sans-serif;

            font-size: 12px;

            color: #000000;

            cursor: default;
        }


        #popup-buttons button:active {
            border-color:
                #000000
                #ffffff
                #ffffff
                #000000;

            box-shadow:
                inset 1px 1px 0 #808080,
                inset -1px -1px 0 #dfdfdf;
        }


        #popup-buttons button:focus {
            outline: 1px dotted #000000;

            outline-offset: -5px;
        }

    </style>

</head>

<body>


<div id="popup-overlay">

    <div id="popup">

        <div id="popup-titlebar">

            <span id="popup-title">
                YouAreAnIdiot
            </span>

            <button
                id="popup-close"
                type="button"
            >×</button>

        </div>


        <div id="popup-content">

            <div id="popup-icon">
                !
            </div>

            <div id="popup-message"></div>

        </div>


        <div id="popup-buttons"></div>

    </div>

</div>


<script>

"use strict";


/* ============================================================
   CONFIGURATION
   ============================================================ */

const POPUP_TEST_COUNT = 3;

const TEST_PAGE =
    "test.html";

const TARGET_PAGE =
    "popup.html";


/*
 * Only a starting size.
 *
 * popup.html replaces this with its actual
 * dynamically measured size.
 */
const DEFAULT_POPUP_WIDTH = 820;

const DEFAULT_POPUP_HEIGHT = 820;


/* ============================================================
   ELEMENTS
   ============================================================ */

const popupOverlay =
    document.getElementById(
        "popup-overlay"
    );


const popupMessage =
    document.getElementById(
        "popup-message"
    );


const popupButtons =
    document.getElementById(
        "popup-buttons"
    );


const popupClose =
    document.getElementById(
        "popup-close"
    );


/* ============================================================
   STATE
   ============================================================ */

const popupResults =
    new Set();


let popupTestStarted =
    false;


let popupAllowed =
    false;


let openingTarget =
    false;


let permissionMessageVisible =
    false;


let popupResolver =
    null;


let lastResizeRequest =
    null;


/* ============================================================
   MESSAGE BOX
   ============================================================ */

function showPopup(
    message,
    buttons = ["OK"]
) {

    popupMessage.textContent =
        message;


    popupButtons.innerHTML =
        "";


    for (
        const text of buttons
    ) {

        const button =
            document.createElement(
                "button"
            );


        button.type =
            "button";


        button.textContent =
            text;


        button.addEventListener(
            "click",
            () => {

                closePopup(
                    text
                );

            }
        );


        popupButtons.appendChild(
            button
        );

    }


    popupOverlay.classList.add(
        "visible"
    );


    const firstButton =
        popupButtons.querySelector(
            "button"
        );


    if (firstButton) {

        firstButton.focus();

    }


    return new Promise(
        resolve => {

            popupResolver =
                resolve;

        }
    );

}


function closePopup(
    result = "Close"
) {

    popupOverlay.classList.remove(
        "visible"
    );


    if (popupResolver) {

        const resolve =
            popupResolver;

        popupResolver =
            null;

        resolve(result);

    }

}


popupClose.addEventListener(
    "click",
    () => {

        closePopup(
            "Close"
        );

    }
);


/* ============================================================
   PERMISSION MESSAGE
   ============================================================ */

function getPermissionMessage() {

    return (
        "This recreation requires pop-up windows " +
        "to be enabled in your browser. Please allow " +
        "pop-ups for this site."
    );

}


async function showPermissionMessage() {

    if (popupAllowed) {
        return;
    }


    if (permissionMessageVisible) {
        return;
    }


    permissionMessageVisible =
        true;


    await showPopup(
        getPermissionMessage(),
        ["OK"]
    );


    permissionMessageVisible =
        false;


    if (!popupAllowed) {

        popupTestStarted =
            false;

        popupResults.clear();

        testPopupPermission();

    }

}


/* ============================================================
   BROWSER CHROME
   ============================================================ */

function getBrowserChromeSize() {

    return {

        width:
            Math.max(
                0,
                window.outerWidth -
                window.innerWidth
            ),

        height:
            Math.max(
                0,
                window.outerHeight -
                window.innerHeight
            )

    };

}


/* ============================================================
   RESIZE CHILD WINDOW
   ============================================================ */

function resizeChildWindow(
    childWindow,
    requestedWidth,
    requestedHeight
) {

    if (
        !childWindow ||
        childWindow.closed
    ) {

        return false;

    }


    let width =
        Number(requestedWidth);


    let height =
        Number(requestedHeight);


    if (
        !Number.isFinite(width) ||
        !Number.isFinite(height) ||
        width <= 0 ||
        height <= 0
    ) {

        return false;

    }


    width =
        Math.round(width);


    height =
        Math.round(height);


    const chrome =
        getBrowserChromeSize();


    const targetOuterWidth =
        width +
        chrome.width;


    const targetOuterHeight =
        height +
        chrome.height;


    try {

        childWindow.resizeTo(
            targetOuterWidth,
            targetOuterHeight
        );


        return true;

    } catch (_) {

        return false;

    }

}


/* ============================================================
   DYNAMIC RESIZE MESSAGE
   ============================================================ */

window.addEventListener(
    "message",
    event => {

        /*
         * Only same-origin messages.
         */
        if (
            event.origin !==
            window.location.origin
        ) {

            return;

        }


        const data =
            event.data;


        if (
            !data ||
            data.type !==
            "YOUARE_REQUEST_RESIZE"
        ) {

            return;

        }


        /*
         * The message must come from an actual
         * WindowProxy.
         */
        const source =
            event.source;


        if (!source) {

            return;

        }


        const width =
            Number(data.width);


        const height =
            Number(data.height);


        if (
            !Number.isFinite(width) ||
            !Number.isFinite(height) ||
            width <= 0 ||
            height <= 0
        ) {

            return;

        }


        lastResizeRequest = {

            id:
                data.id,

            reason:
                data.reason,

            width,

            height,

            timestamp:
                data.timestamp

        };


        /*
         * Resize the exact popup that sent
         * the message.
         *
         * This is performed regardless of
         * whether popup.html's own resizeTo()
         * succeeded.
         */
        resizeChildWindow(
            source,
            width,
            height
        );

    }
);


/* ============================================================
   INITIAL POPUP FEATURES
   ============================================================ */

function getInitialPopupFeatures() {

    const aspectRatio =
        928 / 929;


    const availableWidth =
        Math.max(
            320,
            screen.availWidth - 40
        );


    const availableHeight =
        Math.max(
            320,
            screen.availHeight - 40
        );


    let width =
        Math.min(
            DEFAULT_POPUP_WIDTH,
            availableWidth
        );


    let height =
        width /
        aspectRatio;


    if (
        height >
        Math.min(
            DEFAULT_POPUP_HEIGHT,
            availableHeight
        )
    ) {

        height =
            Math.min(
                DEFAULT_POPUP_HEIGHT,
                availableHeight
            );


        width =
            height *
            aspectRatio;

    }


    width =
        Math.max(
            320,
            Math.floor(width)
        );


    height =
        Math.max(
            320,
            Math.floor(height)
        );


    const left =
        Math.max(
            0,
            Math.floor(
                (
                    screen.availWidth -
                    width
                ) / 2
            )
        );


    const top =
        Math.max(
            0,
            Math.floor(
                (
                    screen.availHeight -
                    height
                ) / 2
            )
        );


    return [

        `width=${width}`,

        `height=${height}`,

        `left=${left}`,

        `top=${top}`,

        "resizable=yes",

        "scrollbars=no",

        "toolbar=no",

        "menubar=no",

        "location=no",

        "status=no"

    ].join(",");

}


/* ============================================================
   OPEN QUESTION POPUP
   ============================================================ */

function openQuestionPopup() {

    if (openingTarget) {
        return;
    }


    openingTarget =
        true;


    const features =
        getInitialPopupFeatures();


    let popup = null;


    try {

        popup =
            window.open(
                TARGET_PAGE,
                "YouAreAnIdiotQuestion",
                features
            );

    } catch (_) {

        popup = null;

    }


    if (!popup) {

        openingTarget =
            false;


        popupAllowed =
            false;


        popupTestStarted =
            false;


        popupResults.clear();


        showPermissionMessage();

        return;

    }


    /*
     * Focus when allowed.
     */
    try {

        popup.focus();

    } catch (_) {}


    /*
     * popup.html will send its actual dimensions
     * through postMessage as soon as it loads.
     */

}


/* ============================================================
   POPUP TEST
   ============================================================ */

function testPopupPermission() {

    if (
        popupTestStarted ||
        popupAllowed
    ) {

        return;

    }


    popupTestStarted =
        true;


    popupResults.clear();


    for (
        let i = 0;
        i < POPUP_TEST_COUNT;
        i++
    ) {

        try {

            const testPopup =
                window.open(
                    `${TEST_PAGE}?id=${i}`,
                    `youare_popup_test_${i}`,
                    [
                        "width=1",
                        "height=1",
                        "left=-10000",
                        "top=-10000"
                    ].join(",")
                );


            void testPopup;

        } catch (_) {}

    }


    setTimeout(
        () => {

            if (
                popupAllowed ||
                popupResults.size >=
                POPUP_TEST_COUNT
            ) {

                return;

            }


            showPermissionMessage();

        },
        1500
    );

}


/* ============================================================
   TEST RESULTS
   ============================================================ */

window.addEventListener(
    "message",
    event => {

        if (
            event.origin !==
            window.location.origin
        ) {

            return;

        }


        const data =
            event.data;


        if (
            !data ||
            data.type !==
            "YOUARE_POPUP_TEST_SUCCESS"
        ) {

            return;

        }


        const id =
            String(data.id);


        if (
            ![
                "0",
                "1",
                "2"
            ].includes(id)
        ) {

            return;

        }


        popupResults.add(id);


        if (
            popupResults.size >=
            POPUP_TEST_COUNT
        ) {

            popupAllowed =
                true;


            closePopup(
                "Permissions complete"
            );


            openQuestionPopup();

        }

    }
);


/* ============================================================
   STARTUP
   ============================================================ */

window.addEventListener(
    "load",
    () => {

        testPopupPermission();

    },
    {
        once: true
    }
);


/* ============================================================
   RETEST ON FOCUS
   ============================================================ */

window.addEventListener(
    "focus",
    () => {

        if (
            !popupAllowed &&
            !permissionMessageVisible
        ) {

            popupTestStarted =
                false;


            popupResults.clear();


            testPopupPermission();

        }

    }
);


/* ============================================================
   ESCAPE
   ============================================================ */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape"
        ) {

            closePopup(
                "Close"
            );

        }

    }
);


/* ============================================================
   CONTEXT MENU
   ============================================================ */

document.addEventListener(
    "contextmenu",
    event => {

        event.preventDefault();

    }
);

</script>

</body>
</html>
