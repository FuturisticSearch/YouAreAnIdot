</audio><script>

"use strict";


/* ============================================================
   CONFIGURATION
   ============================================================ */

const POPUP_TEST_COUNT = 3;

const TEST_PAGE =
    "test.html";

const TARGET_PAGE =
    "popup.html";

const DISCORD_PAGE =
    "discord.html";


/*
 * How often the real popup is checked.
 *
 * window.closed is cheap to poll and works even when
 * the child window is on another page, as long as the
 * WindowProxy remains available.
 */

const TARGET_CHECK_INTERVAL =
    250;


/* ============================================================
   ELEMENTS
   ============================================================ */

const popupOverlay =
    document.getElementById(
        "popup-overlay"
    );


const popupMessage =
    document.getElementById(
        "popup-message"
    );


const popupButtons =
    document.getElementById(
        "popup-buttons"
    );


const popupClose =
    document.getElementById(
        "popup-close"
    );


const autoplayAudio =
    document.getElementById(
        "autoplay-test-audio"
    );


/* ============================================================
   STATE
   ============================================================ */

const popupResults =
    new Set();


let popupTestStarted =
    false;


let popupAllowed =
    false;


let openingTarget =
    false;


let autoplayAllowed =
    false;


let autoplayChecked =
    false;


let permissionMessageVisible =
    false;


let popupResolver =
    null;


/*
 * Reference to the ACTUAL popup.html window.
 */

let targetPopup =
    null;


/*
 * Prevent the closed-popup redirect from
 * happening more than once.
 */

let targetPopupFinished =
    false;


let targetPopupMonitor =
    null;


/* ============================================================
   MESSAGE BOX
   ============================================================ */

function showPopup(
    message,
    buttons = ["OK"]
) {

    popupMessage.textContent =
        message;


    popupButtons.innerHTML =
        "";


    for (
        const text of buttons
    ) {

        const button =
            document.createElement(
                "button"
            );


        button.type =
            "button";


        button.textContent =
            text;


        button.addEventListener(
            "click",
            () => {

                closePopup(
                    text
                );

            }
        );


        popupButtons.appendChild(
            button
        );

    }


    popupOverlay.classList.add(
        "visible"
    );


    const firstButton =
        popupButtons.querySelector(
            "button"
        );


    if (firstButton) {

        firstButton.focus();

    }


    return new Promise(
        resolve => {

            popupResolver =
                resolve;

        }
    );

}


function closePopup(
    result = "Close"
) {

    popupOverlay.classList.remove(
        "visible"
    );


    if (popupResolver) {

        const resolve =
            popupResolver;

        popupResolver =
            null;

        resolve(result);

    }

}


popupClose.addEventListener(
    "click",
    () => {

        closePopup(
            "Close"
        );

    }
);


/* ============================================================
   AUTOPLAY CHECK
   ============================================================ */

async function checkAutoplay() {

    if (
        autoplayChecked
    ) {

        return autoplayAllowed;

    }


    autoplayChecked =
        true;


    try {

        autoplayAudio.muted =
            false;


        const result =
            autoplayAudio.play();


        if (
            result &&
            typeof result.then ===
            "function"
        ) {

            await result;

        }


        autoplayAllowed =
            true;


        return true;

    } catch (_) {

        autoplayAllowed =
            false;


        return false;

    }

}


/* ============================================================
   AUTOPLAY PERMISSION MESSAGE
   ============================================================ */

async function showAutoplayMessage() {

    if (
        autoplayAllowed ||
        permissionMessageVisible
    ) {

        return;

    }


    await showPopup(
        "Autoplay is blocked by your browser. " +
        "Tap OK or interact with the page to allow the audio.",
        ["OK"]
    );


    try {

        const result =
            autoplayAudio.play();


        if (
            result &&
            typeof result.then ===
            "function"
        ) {

            await result;

        }


        autoplayAllowed =
            true;

        autoplayChecked =
            true;

    } catch (_) {

        autoplayAllowed =
            false;

    }

}


/* ============================================================
   UNLOCK AUTOPLAY ON USER INTERACTION
   ============================================================ */

function tryUnlockAutoplay() {

    if (
        autoplayAllowed
    ) {

        return;

    }


    try {

        const result =
            autoplayAudio.play();


        if (
            result &&
            typeof result.then ===
            "function"
        ) {

            result
                .then(
                    () => {

                        autoplayAllowed =
                            true;

                        autoplayChecked =
                            true;

                    }
                )
                .catch(
                    () => {

                        autoplayAllowed =
                            false;

                    }
                );

        } else {

            autoplayAllowed =
                true;

            autoplayChecked =
                true;

        }

    } catch (_) {

        autoplayAllowed =
            false;

    }

}


document.addEventListener(
    "pointerdown",
    tryUnlockAutoplay,
    {
        passive: true
    }
);


document.addEventListener(
    "keydown",
    tryUnlockAutoplay,
    {
        passive: true
    }
);


/* ============================================================
   RESIZE REQUEST FROM popup.html
   ============================================================ */

window.addEventListener(
    "message",
    event => {

        if (
            event.origin !==
            window.location.origin
        ) {

            return;

        }


        const data =
            event.data;


        if (
            !data ||
            data.type !==
            "YOUARE_REQUEST_DISCORD_SIZE"
        ) {

            return;

        }


        /*
         * Only allow the REAL target popup to
         * request the resize.
         */

        if (
            !targetPopup ||
            event.source !== targetPopup
        ) {

            return;

        }


        const width =
            Number(data.width);


        const height =
            Number(data.height);


        if (
            !Number.isFinite(width) ||
            !Number.isFinite(height) ||
            width < 1 ||
            height < 1
        ) {

            return;

        }


        const safeWidth =
            Math.round(
                Math.min(
                    width,
                    Math.max(
                        1,
                        screen.availWidth
                    )
                )
            );


        const safeHeight =
            Math.round(
                Math.min(
                    height,
                    Math.max(
                        1,
                        screen.availHeight
                    )
                )
            );


        try {

            targetPopup.resizeTo(
                safeWidth,
                safeHeight
            );

        } catch (_) {}


        try {

            targetPopup.focus();

        } catch (_) {}

    }
);


/* ============================================================
   POPUP TEST RESULT HANDLING
   ============================================================ */

window.addEventListener(
    "message",
    event => {

        if (
            event.origin !==
            window.location.origin
        ) {

            return;

        }


        const data =
            event.data;


        if (
            !data ||
            data.type !==
            "YOUARE_POPUP_TEST_SUCCESS"
        ) {

            return;

        }


        const id =
            String(data.id);


        if (
            ![
                "0",
                "1",
                "2"
            ].includes(id)
        ) {

            return;

        }


        popupResults.add(id);


        if (
            popupResults.size >=
            POPUP_TEST_COUNT
        ) {

            popupAllowed =
                true;


            closePopup(
                "Permissions complete"
            );


            openQuestionPopup();

        }

    }
);


/* ============================================================
   PERMISSION MESSAGE
   ============================================================ */

function getPermissionMessage() {

    return (
        "This recreation requires pop-up windows " +
        "to be enabled in your browser. Please allow " +
        "pop-ups for this site."
    );

}


async function showPermissionMessage() {

    if (
        popupAllowed ||
        permissionMessageVisible
    ) {

        return;

    }


    permissionMessageVisible =
        true;


    await showPopup(
        getPermissionMessage(),
        ["OK"]
    );


    permissionMessageVisible =
        false;


    if (
        !popupAllowed
    ) {

        popupTestStarted =
            false;

        popupResults.clear();

        testPopupPermission();

    }

}


/* ============================================================
   INITIAL / FAKE WINDOW SIZE
   ============================================================ */

function getPopupFeatures() {

    const availableWidth =
        Math.max(
            320,
            screen.availWidth - 40
        );


    const availableHeight =
        Math.max(
            320,
            screen.availHeight - 40
        );


    const aspectRatio =
        928 / 929;


    let width =
        Math.min(
            820,
            availableWidth
        );


    let height =
        width /
        aspectRatio;


    if (
        height >
        Math.min(
            820,
            availableHeight
        )
    ) {

        height =
            Math.min(
                820,
                availableHeight
            );


        width =
            height *
            aspectRatio;

    }


    width =
        Math.max(
            320,
            Math.floor(width)
        );


    height =
        Math.max(
            320,
            Math.floor(height)
        );


    const left =
        Math.max(
            0,
            Math.floor(
                (
                    screen.availWidth -
                    width
                ) / 2
            )
        );


    const top =
        Math.max(
            0,
            Math.floor(
                (
                    screen.availHeight -
                    height
                ) / 2
            )
        );


    return [
        `width=${width}`,
        `height=${height}`,
        `left=${left}`,
        `top=${top}`,
        "resizable=yes",
        "scrollbars=no",
        "toolbar=no",
        "menubar=no",
        "location=no",
        "status=no"
    ].join(",");

}


/* ============================================================
   REAL POPUP CLOSED HANDLER
   ============================================================ */

function handleTargetPopupClosed() {

    if (
        targetPopupFinished
    ) {

        return;

    }


    targetPopupFinished =
        true;


    if (
        targetPopupMonitor
    ) {

        clearInterval(
            targetPopupMonitor
        );

        targetPopupMonitor =
            null;

    }


    targetPopup =
        null;


    /*
     * Redirect ONLY after the actual popup
     * window has really been closed.
     */

    window.location.href =
        DISCORD_PAGE;

}


/* ============================================================
   MONITOR REAL POPUP
   ============================================================ */

function monitorTargetPopup(
    popup
) {

    if (
        targetPopupMonitor
    ) {

        clearInterval(
            targetPopupMonitor
        );

    }


    targetPopupMonitor =
        setInterval(
            () => {

                /*
                 * The popup may become inaccessible
                 * in unusual browser situations.
                 *
                 * window.closed is the important check.
                 */

                try {

                    if (
                        popup.closed
                    ) {

                        handleTargetPopupClosed();

                    }

                } catch (_) {

                    /*
                     * If reading .closed itself throws,
                     * do not immediately redirect.
                     *
                     * Keep monitoring because the
                     * popup may still exist.
                     */

                }

            },
            TARGET_CHECK_INTERVAL
        );

}


/* ============================================================
   OPEN QUESTION POPUP
   ============================================================ */

function openQuestionPopup() {

    if (
        openingTarget ||
        targetPopup
    ) {

        return;

    }


    openingTarget =
        true;


    targetPopupFinished =
        false;


    const features =
        getPopupFeatures();


    let popup =
        null;


    try {

        popup =
            window.open(
                TARGET_PAGE,
                "YouAreAnIdiotQuestion",
                features
            );

    } catch (_) {

        popup =
            null;

    }


    /*
     * A blocked popup normally returns null.
     */

    if (
        !popup
    ) {

        openingTarget =
            false;

        popupAllowed =
            false;

        popupTestStarted =
            false;

        popupResults.clear();


        showPermissionMessage();

        return;

    }


    /*
     * Save the WindowProxy immediately.
     *
     * This is what lets index.html detect when
     * the actual popup is closed.
     */

    targetPopup =
        popup;


    openingTarget =
        false;


    /*
     * Start monitoring immediately.
     */

    monitorTargetPopup(
        popup
    );


    try {

        popup.focus();

    } catch (_) {}

}


/* ============================================================
   THREE-POPUP PERMISSION TEST
   ============================================================ */

function testPopupPermission() {

    if (
        popupTestStarted ||
        popupAllowed
    ) {

        return;

    }


    popupTestStarted =
        true;


    popupResults.clear();


    for (
        let i = 0;
        i < POPUP_TEST_COUNT;
        i++
    ) {

        try {

            const testPopup =
                window.open(
                    `${TEST_PAGE}?id=${i}`,
                    `youare_popup_test_${i}`,
                    [
                        "width=1",
                        "height=1",
                        "left=-10000",
                        "top=-10000"
                    ].join(",")
                );


            /*
             * Do not keep these windows around.
             *
             * test.html is responsible for sending
             * its success message.
             */

            if (
                testPopup
            ) {

                try {

                    testPopup.blur();

                } catch (_) {}

            }

        } catch (_) {}

    }


    setTimeout(
        () => {

            if (
                popupAllowed ||
                popupResults.size >=
                POPUP_TEST_COUNT
            ) {

                return;

            }


            showPermissionMessage();

        },
        1500
    );

}


/* ============================================================
   STARTUP
   ============================================================ */

window.addEventListener(
    "load",
    async () => {

        /*
         * Run both checks independently.
         */

        const autoplay =
            await checkAutoplay();


        testPopupPermission();


        /*
         * Autoplay warning is independent from
         * popup permission.
         */

        if (
            !autoplay
        ) {

            setTimeout(
                () => {

                    if (
                        !permissionMessageVisible &&
                        !autoplayAllowed
                    ) {

                        showAutoplayMessage();

                    }

                },
                250
            );

        }

    },
    {
        once: true
    }
);


/* ============================================================
   RETEST ON FOCUS
   ============================================================ */

window.addEventListener(
    "focus",
    () => {

        /*
         * Do not retest popup permission after
         * the real question popup has already opened.
         */

        if (
            !popupAllowed &&
            !permissionMessageVisible &&
            !targetPopup
        ) {

            popupTestStarted =
                false;

            popupResults.clear();

            testPopupPermission();

        }


        if (
            !autoplayAllowed
        ) {

            tryUnlockAutoplay();

        }

    }
);


/* ============================================================
   ESCAPE
   ============================================================ */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape"
        ) {

            closePopup(
                "Close"
            );

        }

    }
);


/* ============================================================
   RIGHT CLICK
   ============================================================ */

document.addEventListener(
    "contextmenu",
    event => {

        event.preventDefault();

    }
);

</script></body>
