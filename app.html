<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Are you an idiot?</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            background: #008080;

            overflow: hidden;

            font-family:
                "MS Sans Serif",
                "Microsoft Sans Serif",
                Tahoma,
                Arial,
                sans-serif;

            font-size: 11px;

            user-select: none;
            -webkit-user-select: none;

            display: flex;

            align-items: center;
            justify-content: center;
        }

        #popup-overlay {
            position: fixed;

            inset: 0;

            display: none;

            z-index: 100000;
        }

        #popup-overlay.visible {
            display: block;
        }

        #popup {
            position: fixed;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%);

            width:
                min(
                    500px,
                    calc(100vw - 30px)
                );

            background: #c0c0c0;

            border: 2px solid;

            border-color:
                #ffffff
                #000000
                #000000
                #ffffff;

            box-shadow:
                inset 1px 1px 0 #dfdfdf,
                inset -1px -1px 0 #808080;
        }

        #popup-titlebar {
            height: 22px;

            display: flex;

            align-items: center;

            padding-left: 4px;
            padding-right: 2px;

            background: #000080;

            color: #ffffff;

            font-size: 13px;

            font-weight: bold;

            line-height: 18px;
        }

        #popup-title {
            flex: 1;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }

        #popup-close {
            width: 19px;
            height: 18px;

            padding: 0;

            background: #c0c0c0;

            border: 2px solid;

            border-color:
                #ffffff
                #000000
                #000000
                #ffffff;

            box-shadow:
                inset 1px 1px 0 #dfdfdf,
                inset -1px -1px 0 #808080;

            font-family:
                Arial,
                sans-serif;

            font-size: 11px;

            font-weight: bold;

            line-height: 13px;
        }

        #popup-close:active {
            border-color:
                #000000
                #ffffff
                #ffffff
                #000000;
        }

        #popup-content {
            min-height: 90px;

            display: flex;

            align-items: center;

            padding: 18px;
        }

        #popup-icon {
            width: 32px;
            min-width: 32px;

            height: 32px;

            margin-right: 18px;

            display: flex;

            align-items: center;
            justify-content: center;

            color: #000000;

            font-family:
                Arial,
                sans-serif;

            font-size: 26px;

            font-weight: bold;
        }

        #popup-message {
            flex: 1;

            font-size: 13px;

            color: #000000;

            line-height: 1.35;
        }

        #popup-buttons {
            display: flex;

            justify-content: center;

            gap: 8px;

            padding:
                0
                12px
                14px;
        }

        #popup-buttons button {
            min-width: 75px;

            height: 27px;

            padding:
                2px
                12px;

            background: #c0c0c0;

            border: 2px solid;

            border-color:
                #ffffff
                #000000
                #000000
                #ffffff;

            box-shadow:
                inset 1px 1px 0 #dfdfdf,
                inset -1px -1px 0 #808080;

            font-family:
                "MS Sans Serif",
                "Microsoft Sans Serif",
                Tahoma,
                Arial,
                sans-serif;

            font-size: 12px;

            color: #000000;
        }

        #popup-buttons button:active {
            border-color:
                #000000
                #ffffff
                #ffffff
                #000000;
        }

        #popup-buttons button:focus {
            outline: 1px dotted #000000;
            outline-offset: -5px;
        }

    </style>

</head>

<body>

<div id="popup-overlay">

    <div id="popup">

        <div id="popup-titlebar">

            <span id="popup-title">
                YouAreAnIdiot
            </span>

            <button
                id="popup-close"
                type="button"
            >×</button>

        </div>

        <div id="popup-content">

            <div id="popup-icon">
                !
            </div>

            <div id="popup-message"></div>

        </div>

        <div id="popup-buttons"></div>

    </div>

</div>


<audio
    id="autoplay-test-audio"
    preload="auto"
    loop
>
    <source
        src="/media/youare-long.mp3"
        type="audio/mpeg"
    >
</audio>


<script>

"use strict";


/* ============================================================
   CONFIGURATION
   ============================================================ */

const POPUP_TEST_COUNT = 3;

const TEST_PAGE =
    "test.html";

const TARGET_PAGE =
    "popup.html";


/* ============================================================
   ELEMENTS
   ============================================================ */

const popupOverlay =
    document.getElementById(
        "popup-overlay"
    );

const popupMessage =
    document.getElementById(
        "popup-message"
    );

const popupButtons =
    document.getElementById(
        "popup-buttons"
    );

const popupClose =
    document.getElementById(
        "popup-close"
    );

const autoplayAudio =
    document.getElementById(
        "autoplay-test-audio"
    );


/* ============================================================
   STATE
   ============================================================ */

const popupResults =
    new Set();

let popupTestStarted =
    false;

let popupAllowed =
    false;

let openingTarget =
    false;

let autoplayAllowed =
    false;

let autoplayChecked =
    false;

let permissionMessageVisible =
    false;

let autoplayMessageVisible =
    false;

let popupResolver =
    null;


/* ============================================================
   MESSAGE BOX
   ============================================================ */

function showPopup(
    message,
    buttons = ["OK"]
) {

    /*
     * If another popup is already visible,
     * don't create a second unresolved promise.
     */

    if (popupResolver) {

        closePopup("Replaced");

    }


    popupMessage.textContent =
        message;

    popupButtons.innerHTML =
        "";


    for (const text of buttons) {

        const button =
            document.createElement(
                "button"
            );

        button.type =
            "button";

        button.textContent =
            text;

        button.addEventListener(
            "click",
            () => {
                closePopup(text);
            }
        );

        popupButtons.appendChild(
            button
        );

    }


    popupOverlay.classList.add(
        "visible"
    );


    const first =
        popupButtons.querySelector(
            "button"
        );


    if (first) {
        first.focus();
    }


    return new Promise(resolve => {

        popupResolver =
            resolve;

    });
}


function closePopup(
    result = "Close"
) {

    popupOverlay.classList.remove(
        "visible"
    );


    if (!popupResolver) {
        return;
    }


    const resolve =
        popupResolver;

    popupResolver =
        null;

    resolve(result);
}


popupClose.addEventListener(
    "click",
    () => {
        closePopup("Close");
    }
);


/* ============================================================
   AUTOPLAY CHECK
   ============================================================ */

async function checkAutoplay() {

    if (autoplayChecked) {

        return autoplayAllowed;

    }


    autoplayChecked =
        true;


    /*
     * navigator.getAutoplayPolicy() is supported
     * by some browsers and gives us a direct
     * indication when available.
     */

    try {

        if (
            typeof navigator.getAutoplayPolicy ===
            "function"
        ) {

            const policy =
                navigator.getAutoplayPolicy(
                    autoplayAudio
                );


            if (
                policy === "disallowed"
            ) {

                autoplayAllowed =
                    false;

                return false;

            }

        }

    } catch (_) {
        /* Fall through to actual play test. */
    }


    try {

        autoplayAudio.muted =
            false;

        autoplayAudio.currentTime =
            0;


        const result =
            autoplayAudio.play();


        if (
            result &&
            typeof result.then ===
            "function"
        ) {

            await result;

        }


        /*
         * play() resolving means the browser
         * accepted the autoplay request.
         */

        if (
            !autoplayAudio.paused
        ) {

            autoplayAllowed =
                true;

            return true;

        }

    } catch (_) {

        /* Autoplay blocked. */

    }


    autoplayAllowed =
        false;

    return false;
}


/* ============================================================
   RETRY AUTOPLAY AFTER USER GESTURE
   ============================================================ */

async function tryUnlockAutoplay() {

    try {

        autoplayAudio.muted =
            false;

        autoplayAudio.currentTime =
            0;


        const result =
            autoplayAudio.play();


        if (
            result &&
            typeof result.then ===
            "function"
        ) {

            await result;

        }


        if (
            !autoplayAudio.paused
        ) {

            autoplayAllowed =
                true;

            autoplayChecked =
                true;

            return true;

        }

    } catch (_) {

        /* Still blocked. */

    }


    autoplayAllowed =
        false;

    return false;
}


/* ============================================================
   AUTOPLAY MESSAGE
   ============================================================ */

async function showAutoplayMessage() {

    if (
        autoplayAllowed ||
        autoplayMessageVisible
    ) {

        return;

    }


    autoplayMessageVisible =
        true;


    const result =
        await showPopup(
            "Autoplay is blocked by your browser. " +
            "Press OK to retry audio playback.",
            ["OK"]
        );


    autoplayMessageVisible =
        false;


    if (
        result !== "OK"
    ) {

        return;

    }


    const unlocked =
        await tryUnlockAutoplay();


    if (!unlocked) {

        /*
         * The browser still blocked it.
         * Don't endlessly spam the dialog.
         */

        return;

    }

}


/* ============================================================
   USER INTERACTION AUTOPLAY UNLOCK
   ============================================================ */

document.addEventListener(
    "pointerdown",
    () => {

        if (
            !autoplayAllowed
        ) {

            tryUnlockAutoplay();

        }

    },
    {
        passive: true
    }
);


document.addEventListener(
    "keydown",
    () => {

        if (
            !autoplayAllowed
        ) {

            tryUnlockAutoplay();

        }

    },
    {
        passive: true
    }
);


/* ============================================================
   RESIZE REQUEST FROM popup.html
   ============================================================ */

window.addEventListener(
    "message",
    event => {

        if (
            event.origin !==
            window.location.origin
        ) {

            return;

        }


        const data =
            event.data;


        if (
            !data ||
            data.type !==
            "YOUARE_REQUEST_DISCORD_SIZE"
        ) {

            return;

        }


        const childWindow =
            event.source;


        if (!childWindow) {
            return;
        }


        const width =
            Number(data.width);

        const height =
            Number(data.height);


        if (
            !Number.isFinite(width) ||
            !Number.isFinite(height) ||
            width < 1 ||
            height < 1
        ) {

            return;

        }


        /*
         * Don't use a fixed size.
         *
         * The dimensions came dynamically from
         * popup.html.
         */

        const maxWidth =
            Math.max(
                1,
                screen.availWidth
            );

        const maxHeight =
            Math.max(
                1,
                screen.availHeight
            );


        const safeWidth =
            Math.round(
                Math.min(
                    width,
                    maxWidth
                )
            );

        const safeHeight =
            Math.round(
                Math.min(
                    height,
                    maxHeight
                )
            );


        try {

            childWindow.resizeTo(
                safeWidth,
                safeHeight
            );

        } catch (_) {
            /* Browser refused resize. */
        }


        /*
         * ACK the exact request.
         *
         * popup.html waits for this before
         * navigating to discord.html.
         */

        try {

            childWindow.postMessage(
                {
                    type:
                        "YOUARE_DISCORD_SIZE_APPLIED",

                    requestId:
                        data.requestId,

                    width:
                        safeWidth,

                    height:
                        safeHeight
                },
                window.location.origin
            );

        } catch (_) {}


        try {

            childWindow.focus();

        } catch (_) {}

    }
);


/* ============================================================
   POPUP TEST RESULT
   ============================================================ */

window.addEventListener(
    "message",
    event => {

        if (
            event.origin !==
            window.location.origin
        ) {

            return;

        }


        const data =
            event.data;


        if (
            !data ||
            data.type !==
            "YOUARE_POPUP_TEST_SUCCESS"
        ) {

            return;

        }


        const id =
            String(data.id);


        if (
            !/^[0-2]$/.test(id)
        ) {

            return;

        }


        popupResults.add(id);


        if (
            popupResults.size >=
            POPUP_TEST_COUNT
        ) {

            popupAllowed =
                true;

            popupTestStarted =
                true;

            closePopup(
                "Permissions complete"
            );

            openQuestionPopup();

        }

    }
);


/* ============================================================
   PERMISSION MESSAGE
   ============================================================ */

function getPermissionMessage() {

    return (
        "This recreation requires pop-up windows " +
        "to be enabled in your browser. Please allow " +
        "pop-ups for this site."
    );

}


async function showPermissionMessage() {

    if (
        popupAllowed ||
        permissionMessageVisible
    ) {

        return;

    }


    permissionMessageVisible =
        true;


    const result =
        await showPopup(
            getPermissionMessage(),
            ["OK"]
        );


    permissionMessageVisible =
        false;


    if (
        result === "OK" &&
        !popupAllowed
    ) {

        popupTestStarted =
            false;

        popupResults.clear();

        testPopupPermission();

    }

}


/* ============================================================
   DYNAMIC INITIAL POPUP SIZE
   ============================================================ */

function getPopupFeatures() {

    const availableWidth =
        Math.max(
            320,
            screen.availWidth - 40
        );

    const availableHeight =
        Math.max(
            320,
            screen.availHeight - 40
        );


    const aspectRatio =
        928 / 929;


    /*
     * This is the INITIAL question window size.
     *
     * It is deliberately separate from the
     * Discord resize dimensions.
     */

    let width =
        Math.min(
            820,
            availableWidth
        );


    let height =
        width / aspectRatio;


    const maxHeight =
        Math.min(
            820,
            availableHeight
        );


    if (
        height > maxHeight
    ) {

        height =
            maxHeight;

        width =
            height * aspectRatio;

    }


    width =
        Math.max(
            320,
            Math.floor(width)
        );


    height =
        Math.max(
            320,
            Math.floor(height)
        );


    const left =
        Math.max(
            0,
            Math.floor(
                (
                    screen.availWidth -
                    width
                ) / 2
            )
        );


    const top =
        Math.max(
            0,
            Math.floor(
                (
                    screen.availHeight -
                    height
                ) / 2
            )
        );


    return [
        `width=${width}`,
        `height=${height}`,
        `left=${left}`,
        `top=${top}`,
        "resizable=yes",
        "scrollbars=no",
        "toolbar=no",
        "menubar=no",
        "location=no",
        "status=no"
    ].join(",");
}


/* ============================================================
   OPEN popup.html
   ============================================================ */

function openQuestionPopup() {

    if (openingTarget) {
        return;
    }


    openingTarget =
        true;


    const features =
        getPopupFeatures();


    let popup =
        null;


    try {

        popup =
            window.open(
                TARGET_PAGE,
                "YouAreAnIdiotQuestion",
                features
            );

    } catch (_) {

        popup =
            null;

    }


    if (!popup) {

        openingTarget =
            false;

        popupAllowed =
            false;

        popupTestStarted =
            false;

        popupResults.clear();

        showPermissionMessage();

        return;

    }


    /*
     * Do NOT resize the newly opened popup here.
     *
     * popup.html starts at the size supplied above.
     *
     * It will send the Discord resize message only
     * when it is actually ready to navigate.
     */

    try {

        popup.focus();

    } catch (_) {}

}


/* ============================================================
   POPUP PERMISSION TEST
   ============================================================ */

function testPopupPermission() {

    if (
        popupTestStarted ||
        popupAllowed
    ) {

        return;

    }


    popupTestStarted =
        true;

    popupResults.clear();


    for (
        let i = 0;
        i < POPUP_TEST_COUNT;
        i++
    ) {

        try {

            const testPopup =
                window.open(
                    `${TEST_PAGE}?id=${i}`,
                    `youare_popup_test_${i}`,
                    [
                        "width=1",
                        "height=1",
                        "left=-10000",
                        "top=-10000"
                    ].join(",")
                );


            /*
             * A null result means the popup was
             * blocked, but don't immediately assume
             * all popup tests failed because some
             * browsers behave asynchronously.
             */

            if (!testPopup) {
                continue;
            }

        } catch (_) {}

    }


    setTimeout(
        () => {

            if (
                popupAllowed ||
                popupResults.size >=
                POPUP_TEST_COUNT
            ) {

                return;

            }


            popupTestStarted =
                false;

            showPermissionMessage();

        },
        1500
    );

}


/* ============================================================
   STARTUP
   ============================================================ */

window.addEventListener(
    "load",
    async () => {

        /*
         * Run the real autoplay test.
         */

        const autoplay =
            await checkAutoplay();


        /*
         * Test popups independently.
         */

        testPopupPermission();


        /*
         * If autoplay is blocked, show the message
         * without preventing the popup test itself.
         */

        if (!autoplay) {

            setTimeout(
                () => {

                    if (
                        !autoplayAllowed &&
                        !autoplayMessageVisible
                    ) {

                        showAutoplayMessage();

                    }

                },
                250
            );

        }

    },
    {
        once: true
    }
);


/* ============================================================
   FOCUS
   ============================================================ */

window.addEventListener(
    "focus",
    () => {

        if (
            !popupAllowed &&
            !permissionMessageVisible
        ) {

            popupTestStarted =
                false;

            popupResults.clear();

            testPopupPermission();

        }


        if (!autoplayAllowed) {

            tryUnlockAutoplay();

        }

    }
);


/* ============================================================
   ESCAPE
   ============================================================ */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape"
        ) {

            closePopup("Close");

        }

    }
);


/* ============================================================
   RIGHT CLICK
   ============================================================ */

document.addEventListener(
    "contextmenu",
    event => {

        event.preventDefault();

    }
);

</script>

</body>
</html>
