<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8"><meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Are You An Idiot?</title>

<style>
    html,
    body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: #008080;
        font-family:
            "MS Sans Serif",
            "Microsoft Sans Serif",
            Tahoma,
            Arial,
            sans-serif;
        overflow: hidden;
    }

    #fallback {
        position: fixed;

        left: 50%;
        top: 50%;

        transform:
            translate(-50%, -50%);

        padding: 8px 20px;

        background: #c0c0c0;

        color: #000000;

        border: 2px solid;

        border-color:
            #ffffff
            #000000
            #000000
            #ffffff;

        box-shadow:
            inset 1px 1px 0 #dfdfdf,
            inset -1px -1px 0 #808080;

        font-family: inherit;
        font-size: 13px;

        display: none;
    }

    #fallback:active {
        border-color:
            #000000
            #ffffff
            #ffffff
            #000000;
    }
</style>

</head><body><button
id="fallback"
type="button"

«»

Open Are You An Idiot?

</button><script>
"use strict";


/* ============================================================
   POPUP PERMISSION TEST
   ============================================================ */

const POPUP_TEST_COUNT = 3;

const popupResults =
    new Set();

let popupTestStarted = false;

let popupAllowed = false;


window.addEventListener(
    "message",
    event => {

        if (
            event.origin !==
            window.location.origin
        ) {
            return;
        }


        const data =
            event.data;


        if (
            !data ||
            data.type !==
            "YOUARE_POPUP_TEST_SUCCESS"
        ) {
            return;
        }


        const id =
            String(data.id);


        if (
            ![
                "0",
                "1",
                "2"
            ].includes(id)
        ) {
            return;
        }


        popupResults.add(id);


        if (
            popupResults.size >=
            POPUP_TEST_COUNT
        ) {

            popupAllowed = true;

        }

    }
);


/* ============================================================
   TEST POPUPS
   ============================================================ */

function testPopupPermission() {

    if (popupTestStarted) {
        return popupAllowed;
    }


    popupTestStarted = true;

    popupResults.clear();


    for (
        let i = 0;
        i < POPUP_TEST_COUNT;
        i++
    ) {

        try {

            const popup =
                window.open(
                    `test.html?id=${i}`,
                    `youare_popup_test_${i}`,
                    [
                        "width=1",
                        "height=1",
                        "left=-10000",
                        "top=-10000"
                    ].join(",")
                );


            void popup;

        } catch (_) {

            /*
             * Browser blocked the popup.
             */

        }

    }


    return popupAllowed;

}


/* ============================================================
   POPUP SIZE
   ============================================================ */

function getPopupFeatures() {

    const screenWidth =
        window.screen.availWidth ||
        window.innerWidth;

    const screenHeight =
        window.screen.availHeight ||
        window.innerHeight;


    /*
     * Keep a small margin so the popup isn't positioned
     * directly against the edges of the usable screen.
     */

    const margin = 24;


    const maxWidth =
        Math.max(
            320,
            screenWidth - margin
        );


    const maxHeight =
        Math.max(
            320,
            screenHeight - margin
        );


    /*
     * Original question window:
     *
     * 928 × 929
     */

    const aspectRatio =
        928 / 929;


    let width =
        Math.min(
            928,
            maxWidth
        );


    let height =
        width / aspectRatio;


    if (
        height >
        maxHeight
    ) {

        height =
            maxHeight;

        width =
            height *
            aspectRatio;

    }


    width =
        Math.max(
            320,
            Math.floor(width)
        );


    height =
        Math.max(
            320,
            Math.floor(height)
        );


    const left =
        Math.max(
            0,
            Math.floor(
                (
                    screenWidth -
                    width
                ) / 2
            )
        );


    const top =
        Math.max(
            0,
            Math.floor(
                (
                    screenHeight -
                    height
                ) / 2
            )
        );


    return [
        `width=${width}`,
        `height=${height}`,
        `left=${left}`,
        `top=${top}`,
        "resizable=yes",
        "scrollbars=no",
        "toolbar=no",
        "menubar=no",
        "location=no",
        "status=no"
    ].join(",");

}


/* ============================================================
   QUESTION POPUP
   ============================================================ */

let questionPopup = null;

let popupOpened = false;

let redirecting = false;


/* ============================================================
   REDIRECT
   ============================================================ */

function redirectToDiscord() {

    if (redirecting) {
        return;
    }


    redirecting = true;


    window.location.href =
        "discord.html";

}


/* ============================================================
   MONITOR POPUP
   ============================================================
   
   This is what makes closing the external window behave
   like the original:
   
       close question window
              ↓
       Discord page
   
   The interval is intentionally short so the redirect
   happens almost immediately.
   ============================================================ */

let popupMonitor = null;


function startPopupMonitor() {

    if (popupMonitor) {
        return;
    }


    popupMonitor =
        setInterval(
            () => {

                if (
                    redirecting
                ) {
                    clearInterval(
                        popupMonitor
                    );

                    popupMonitor =
                        null;

                    return;
                }


                /*
                 * The popup was successfully opened and
                 * subsequently closed.
                 */

                if (
                    popupOpened &&
                    (
                        !questionPopup ||
                        questionPopup.closed
                    )
                ) {

                    clearInterval(
                        popupMonitor
                    );

                    popupMonitor =
                        null;

                    redirectToDiscord();

                }

            },
            100
        );

}


/* ============================================================
   OPEN QUESTION POPUP
   ============================================================ */

function openQuestionPopup() {

    /*
     * Don't create multiple copies.
     */

    if (
        questionPopup &&
        !questionPopup.closed
    ) {

        try {
            questionPopup.focus();
        } catch (_) {}

        return true;

    }


    const features =
        getPopupFeatures();


    let popup = null;


    try {

        popup =
            window.open(
                "popup.html",
                "youare_question_popup",
                features
            );

    } catch (_) {

        popup = null;

    }


    /*
     * Popup blocked.
     */

    if (
        !popup ||
        popup.closed
    ) {

        document.getElementById(
            "fallback"
        ).style.display =
            "block";

        return false;

    }


    questionPopup =
        popup;

    popupOpened =
        true;


    /*
     * Hide fallback once we have a working popup.
     */

    document.getElementById(
        "fallback"
    ).style.display =
        "none";


    startPopupMonitor();


    /*
     * Some browsers ignore left/top in window.open().
     * Try to center it again once it exists.
     */

    setTimeout(
        () => {

            try {

                const screenWidth =
                    window.screen.availWidth ||
                    window.innerWidth;

                const screenHeight =
                    window.screen.availHeight ||
                    window.innerHeight;


                const width =
                    questionPopup.outerWidth;

                const height =
                    questionPopup.outerHeight;


                questionPopup.moveTo(
                    Math.max(
                        0,
                        Math.floor(
                            (
                                screenWidth -
                                width
                            ) / 2
                        )
                    ),
                    Math.max(
                        0,
                        Math.floor(
                            (
                                screenHeight -
                                height
                            ) / 2
                        )
                    )
                );


                questionPopup.focus();

            } catch (_) {

                /*
                 * Browsers can forbid moveTo/focus.
                 */

            }

        },
        100
    );


    return true;

}


/* ============================================================
   STARTUP
   ============================================================ */

window.addEventListener(
    "load",
    () => {

        testPopupPermission();


        /*
         * Wait briefly for test.html responses.
         * The test itself doesn't determine whether we
         * attempt the real popup — it only detects support.
         */

        setTimeout(
            () => {

                if (
                    !openQuestionPopup()
                ) {

                    document.getElementById(
                        "fallback"
                    ).style.display =
                        "block";

                }

            },
            150
        );

    },
    {
        once: true
    }
);


/* ============================================================
   FALLBACK
   ============================================================ */

document
    .getElementById("fallback")
    .addEventListener(
        "click",
        () => {

            /*
             * A click gives the browser a user gesture,
             * making popup opening much more likely to work.
             */

            openQuestionPopup();

        }
    );


/* ============================================================
   CLEANUP
   ============================================================ */

window.addEventListener(
    "beforeunload",
    () => {

        if (popupMonitor) {

            clearInterval(
                popupMonitor
            );

            popupMonitor =
                null;

        }

    }
);

</script></body>
</html>
