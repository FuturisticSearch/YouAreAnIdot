<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8"><meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Are You An Idiot?</title>

<style>
    html,
    body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: #008080;
        font-family:
            "MS Sans Serif",
            "Microsoft Sans Serif",
            Tahoma,
            Arial,
            sans-serif;
        overflow: hidden;
    }

    #fallback {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);

        padding: 8px 20px;

        background: #c0c0c0;
        color: #000;

        border: 2px solid;
        border-color:
            #fff
            #000
            #000
            #fff;

        box-shadow:
            inset 1px 1px 0 #dfdfdf,
            inset -1px -1px 0 #808080;

        font-family: inherit;
        font-size: 13px;

        display: none;
    }

    #fallback:active {
        border-color:
            #000
            #fff
            #fff
            #000;
    }
</style>

</head><body><button id="fallback" type="button">
    Open Are You An Idiot?
</button><script>
"use strict";

/*
 * ============================================================
 * POPUP TEST
 * ============================================================
 */

const POPUP_TEST_COUNT = 3;

const popupResults = new Set();

let popupTestStarted = false;
let popupAllowed = false;

window.addEventListener("message", event => {

    if (event.origin !== window.location.origin) {
        return;
    }

    const data = event.data;

    if (
        !data ||
        data.type !== "YOUARE_POPUP_TEST_SUCCESS"
    ) {
        return;
    }

    const id = String(data.id);

    if (!["0", "1", "2"].includes(id)) {
        return;
    }

    popupResults.add(id);

    if (popupResults.size >= POPUP_TEST_COUNT) {
        popupAllowed = true;
    }
});


function testPopupPermission() {

    if (popupTestStarted) {
        return popupAllowed;
    }

    popupTestStarted = true;

    popupResults.clear();

    for (
        let i = 0;
        i < POPUP_TEST_COUNT;
        i++
    ) {

        try {

            const popup = window.open(
                `test.html?id=${i}`,
                `youare_popup_test_${i}`,
                [
                    "width=1",
                    "height=1",
                    "left=-10000",
                    "top=-10000"
                ].join(",")
            );

            /*
             * test.html is responsible for sending
             * YOUARE_POPUP_TEST_SUCCESS and closing itself.
             */

            void popup;

        } catch (_) {
            /* Popup blocked. */
        }
    }

    return popupAllowed;
}


/*
 * ============================================================
 * CALCULATE POPUP SIZE
 * ============================================================
 *
 * The original artwork is 928x929.
 *
 * We leave a little room for browser chrome and prevent
 * the popup from becoming ridiculously large on desktops.
 */

function getPopupFeatures() {

    const screenWidth =
        window.screen.availWidth || window.innerWidth;

    const screenHeight =
        window.screen.availHeight || window.innerHeight;

    const margin = 24;

    const maxWidth =
        Math.max(
            320,
            screenWidth - margin
        );

    const maxHeight =
        Math.max(
            320,
            screenHeight - margin
        );

    const aspectRatio =
        928 / 929;

    let width =
        Math.min(
            928,
            maxWidth
        );

    let height =
        width / aspectRatio;

    if (height > maxHeight) {

        height = maxHeight;
        width = height * aspectRatio;

    }

    width = Math.max(
        320,
        Math.floor(width)
    );

    height = Math.max(
        320,
        Math.floor(height)
    );

    const left =
        Math.max(
            0,
            Math.floor(
                (screenWidth - width) / 2
            )
        );

    const top =
        Math.max(
            0,
            Math.floor(
                (screenHeight - height) / 2
            )
        );

    return [
        `width=${width}`,
        `height=${height}`,
        `left=${left}`,
        `top=${top}`,
        "resizable=yes",
        "scrollbars=no",
        "toolbar=no",
        "menubar=no",
        "location=no",
        "status=no"
    ].join(",");
}


/*
 * ============================================================
 * OPEN QUESTION POPUP
 * ============================================================
 */

let questionPopup = null;

function openQuestionPopup() {

    const features =
        getPopupFeatures();

    try {

        questionPopup =
            window.open(
                "popup.html",
                "youare_question_popup",
                features
            );

    } catch (_) {

        questionPopup = null;

    }

    if (
        !questionPopup ||
        questionPopup.closed
    ) {

        document.getElementById(
            "fallback"
        ).style.display = "block";

        return false;

    }

    /*
     * Some browsers ignore the initial centering
     * parameters. Try to center it again after creation.
     */

    setTimeout(() => {

        try {

            const screenWidth =
                window.screen.availWidth ||
                window.innerWidth;

            const screenHeight =
                window.screen.availHeight ||
                window.innerHeight;

            const width =
                questionPopup.outerWidth;

            const height =
                questionPopup.outerHeight;

            questionPopup.moveTo(
                Math.max(
                    0,
                    Math.floor(
                        (screenWidth - width) / 2
                    )
                ),
                Math.max(
                    0,
                    Math.floor(
                        (screenHeight - height) / 2
                    )
                )
            );

            questionPopup.focus();

        } catch (_) {
            /* Browser may forbid moveTo(). */
        }

    }, 100);

    return true;
}


/*
 * ============================================================
 * START
 * ============================================================
 */

window.addEventListener(
    "load",
    () => {

        testPopupPermission();

        /*
         * Give test.html a short amount of time to report.
         * The actual question popup is still attempted once.
         */

        setTimeout(() => {

            if (!openQuestionPopup()) {

                document.getElementById(
                    "fallback"
                ).style.display = "block";

            }

        }, 150);

    },
    {
        once: true
    }
);


/*
 * ============================================================
 * FALLBACK BUTTON
 * ============================================================
 */

document
    .getElementById("fallback")
    .addEventListener(
        "click",
        () => {

            openQuestionPopup();

        }
    );

</script></body>
</html>
