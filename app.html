</audio><script>

"use strict";


/* ============================================================
   CONFIGURATION
   ============================================================ */

const POPUP_TEST_COUNT =
    3;


const TEST_PAGE =
    "test.html";


const TARGET_PAGE =
    "popup.html";


const DISCORD_PAGE =
    "discord.html";


const TARGET_CHECK_INTERVAL =
    250;


/* ============================================================
   ELEMENTS
   ============================================================ */

const popupOverlay =
    document.getElementById(
        "popup-overlay"
    );


const popupMessage =
    document.getElementById(
        "popup-message"
    );


const popupButtons =
    document.getElementById(
        "popup-buttons"
    );


const popupClose =
    document.getElementById(
        "popup-close"
    );


const popupIcon =
    document.getElementById(
        "popup-icon"
    );


const autoplayAudio =
    document.getElementById(
        "autoplay-test-audio"
    );


/* ============================================================
   STATE
   ============================================================ */

const popupResults =
    new Set();


let popupTestStarted =
    false;


let popupAllowed =
    false;


let autoplayTestComplete =
    false;


let autoplayAllowed =
    false;


let openingTarget =
    false;


let permissionMessageVisible =
    false;


let popupResolver =
    null;


let targetPopup =
    null;


let targetPopupFinished =
    false;


let targetPopupMonitor =
    null;


/* ============================================================
   MESSAGE BOX
   ============================================================ */

function showPopup(
    message,
    buttons = ["OK"],
    icon = "!"
) {

    popupMessage.textContent =
        message;


    popupIcon.textContent =
        icon;


    popupButtons.innerHTML =
        "";


    popupOverlay.classList.add(
        "visible"
    );


    return new Promise(
        resolve => {

            popupResolver =
                resolve;


            for (
                const text of buttons
            ) {

                const button =
                    document.createElement(
                        "button"
                    );


                button.type =
                    "button";


                button.textContent =
                    text;


                button.addEventListener(
                    "click",
                    () => {

                        closePopup(
                            text
                        );

                    }
                );


                popupButtons.appendChild(
                    button
                );

            }


            const firstButton =
                popupButtons.querySelector(
                    "button"
                );


            if (firstButton) {

                firstButton.focus();

            }

        }
    );

}


function closePopup(
    result = "Close"
) {

    popupOverlay.classList.remove(
        "visible"
    );


    if (popupResolver) {

        const resolve =
            popupResolver;

        popupResolver =
            null;

        resolve(result);

    }

}


popupClose.addEventListener(
    "click",
    () => {

        closePopup(
            "Close"
        );

    }
);


/* ============================================================
   POPUP PERMISSION TEST
   ============================================================ */

window.addEventListener(
    "message",
    event => {

        if (
            event.origin !==
            window.location.origin
        ) {

            return;

        }


        const data =
            event.data;


        if (
            !data ||
            data.type !==
            "YOUARE_POPUP_TEST_SUCCESS"
        ) {

            return;

        }


        const id =
            String(data.id);


        if (
            ![
                "0",
                "1",
                "2"
            ].includes(id)
        ) {

            return;

        }


        popupResults.add(
            id
        );


        if (
            popupResults.size >=
            POPUP_TEST_COUNT
        ) {

            popupAllowed =
                true;

        }


        updatePermissionMessage();

    }
);


function testPopupPermission() {

    if (
        popupTestStarted
    ) {

        return popupAllowed;

    }


    popupTestStarted =
        true;


    popupResults.clear();


    for (
        let i = 0;
        i < POPUP_TEST_COUNT;
        i++
    ) {

        try {

            const popup =
                window.open(
                    `${TEST_PAGE}?id=${i}`,
                    `youare_popup_test_${i}`,
                    [
                        "width=1",
                        "height=1",
                        "left=-10000",
                        "top=-10000"
                    ].join(",")
                );


            void popup;

        } catch (_) {

            /*
             * Blocked popup simply does not
             * report success.
             */

        }

    }


    return popupAllowed;

}


/* ============================================================
   AUTOPLAY TEST
   ============================================================ */

async function testAutoplayPermission() {

    if (
        autoplayTestComplete
    ) {

        return autoplayAllowed;

    }


    autoplayTestComplete =
        true;


    try {

        autoplayAudio.pause();


        try {

            autoplayAudio.currentTime =
                0;

        } catch (_) {

            /*
             * Ignore.
             */

        }


        const playPromise =
            autoplayAudio.play();


        if (
            playPromise &&
            typeof playPromise.then ===
            "function"
        ) {

            await playPromise;

        }


        /*
         * Match question.html:
         *
         * Give the browser a short moment to
         * actually enter the playing state.
         */

        await new Promise(
            resolve => {

                setTimeout(
                    resolve,
                    100
                );

            }
        );


        autoplayAllowed =
            !autoplayAudio.paused &&
            !autoplayAudio.ended;


        if (
            !autoplayAllowed
        ) {

            autoplayAudio.pause();


            try {

                autoplayAudio.currentTime =
                    0;

            } catch (_) {

                /*
                 * Ignore.
                 */

            }

        }

    } catch (_) {

        autoplayAllowed =
            false;


        try {

            autoplayAudio.pause();

            autoplayAudio.currentTime =
                0;

        } catch (_) {

            /*
             * Ignore.
             */

        }

    }


    updatePermissionMessage();


    return autoplayAllowed;

}


/* ============================================================
   DYNAMIC PERMISSION MESSAGE
   ============================================================ */

function getPermissionMessage() {

    if (
        popupAllowed &&
        autoplayAllowed
    ) {

        return null;

    }


    if (
        !popupAllowed &&
        autoplayAllowed
    ) {

        return (
            "This recreation requires pop-up windows " +
            "to be enabled in your browser. Please allow " +
            "pop-ups for this site."
        );

    }


    if (
        popupAllowed &&
        !autoplayAllowed
    ) {

        return (
            "This recreation requires audio autoplay " +
            "to be enabled in your browser. Please allow " +
            "autoplay for this site."
        );

    }


    return (
        "This recreation requires pop-up windows and " +
        "audio autoplay to be enabled in your browser. " +
        "Please allow both for this site."
    );

}


function updatePermissionMessage() {

    const message =
        getPermissionMessage();


    /*
     * Both permissions are available.
     */

    if (
        !message
    ) {

        if (
            permissionMessageVisible &&
            popupResolver
        ) {

            closePopup(
                "Permissions complete"
            );

        }


        permissionMessageVisible =
            false;


        return;

    }


    /*
     * Update the currently visible
     * permission dialog dynamically.
     */

    if (
        !permissionMessageVisible
    ) {

        return;

    }


    popupMessage.textContent =
        message;

}


async function showPermissionMessage() {

    const message =
        getPermissionMessage();


    if (
        !message
    ) {

        return;

    }


    permissionMessageVisible =
        true;


    await showPopup(
        message,
        ["OK"],
        "!"
    );


    permissionMessageVisible =
        false;

}


/* ============================================================
   RESIZE REQUEST FROM popup.html
   ============================================================ */

window.addEventListener(
    "message",
    event => {

        if (
            event.origin !==
            window.location.origin
        ) {

            return;

        }


        const data =
            event.data;


        if (
            !data ||
            data.type !==
            "YOUARE_REQUEST_DISCORD_SIZE"
        ) {

            return;

        }


        /*
         * Only the real popup.html may request
         * the Discord-sized window.
         */

        if (
            !targetPopup ||
            event.source !== targetPopup
        ) {

            return;

        }


        const width =
            Number(data.width);


        const height =
            Number(data.height);


        if (
            !Number.isFinite(width) ||
            !Number.isFinite(height) ||
            width < 1 ||
            height < 1
        ) {

            return;

        }


        const safeWidth =
            Math.round(
                Math.min(
                    width,
                    Math.max(
                        1,
                        screen.availWidth
                    )
                )
            );


        const safeHeight =
            Math.round(
                Math.min(
                    height,
                    Math.max(
                        1,
                        screen.availHeight
                    )
                )
            );


        try {

            targetPopup.resizeTo(
                safeWidth,
                safeHeight
            );

        } catch (_) {}


        try {

            targetPopup.focus();

        } catch (_) {}

    }
);


/* ============================================================
   INITIAL / FAKE WINDOW SIZE
   ============================================================ */

function getPopupFeatures() {

    const availableWidth =
        Math.max(
            320,
            screen.availWidth - 40
        );


    const availableHeight =
        Math.max(
            320,
            screen.availHeight - 40
        );


    /*
     * Fake question-window aspect ratio.
     */

    const aspectRatio =
        928 / 929;


    let width =
        Math.min(
            820,
            availableWidth
        );


    let height =
        width /
        aspectRatio;


    if (
        height >
        Math.min(
            820,
            availableHeight
        )
    ) {

        height =
            Math.min(
                820,
                availableHeight
            );


        width =
            height *
            aspectRatio;

    }


    width =
        Math.max(
            320,
            Math.floor(width)
        );


    height =
        Math.max(
            320,
            Math.floor(height)
        );


    const left =
        Math.max(
            0,
            Math.floor(
                (
                    screen.availWidth -
                    width
                ) / 2
            )
        );


    const top =
        Math.max(
            0,
            Math.floor(
                (
                    screen.availHeight -
                    height
                ) / 2
            )
        );


    return [
        `width=${width}`,
        `height=${height}`,
        `left=${left}`,
        `top=${top}`,
        "resizable=yes",
        "scrollbars=no",
        "toolbar=no",
        "menubar=no",
        "location=no",
        "status=no"
    ].join(",");

}


/* ============================================================
   REAL POPUP CLOSED HANDLER
   ============================================================ */

function handleTargetPopupClosed() {

    if (
        targetPopupFinished
    ) {

        return;

    }


    targetPopupFinished =
        true;


    if (
        targetPopupMonitor
    ) {

        clearInterval(
            targetPopupMonitor
        );

        targetPopupMonitor =
            null;

    }


    targetPopup =
        null;


    /*
     * Redirect only after the actual
     * popup window has closed.
     */

    window.location.href =
        DISCORD_PAGE;

}


/* ============================================================
   MONITOR REAL POPUP
   ============================================================ */

function monitorTargetPopup(
    popup
) {

    if (
        targetPopupMonitor
    ) {

        clearInterval(
            targetPopupMonitor
        );

    }


    targetPopupMonitor =
        setInterval(
            () => {

                try {

                    if (
                        popup.closed
                    ) {

                        handleTargetPopupClosed();

                    }

                } catch (_) {

                    /*
                     * Keep monitoring.
                     */

                }

            },
            TARGET_CHECK_INTERVAL
        );

}


/* ============================================================
   OPEN QUESTION POPUP
   ============================================================ */

function openQuestionPopup() {

    if (
        openingTarget ||
        targetPopup
    ) {

        return;

    }


    openingTarget =
        true;


    targetPopupFinished =
        false;


    const features =
        getPopupFeatures();


    let popup =
        null;


    try {

        popup =
            window.open(
                TARGET_PAGE,
                "YouAreAnIdiotQuestion",
                features
            );

    } catch (_) {

        popup =
            null;

    }


    /*
     * Blocked real popup.
     */

    if (
        !popup
    ) {

        openingTarget =
            false;


        popupAllowed =
            false;


        popupTestStarted =
            false;


        popupResults.clear();


        showPermissionMessage();

        return;

    }


    targetPopup =
        popup;


    openingTarget =
        false;


    monitorTargetPopup(
        popup
    );


    try {

        popup.focus();

    } catch (_) {}

}


/* ============================================================
   STARTUP FEATURE DETECTION
   ============================================================ */

window.addEventListener(
    "load",
    async () => {

        /*
         * Exactly like question.html:
         *
         * 1. Start popup detection.
         * 2. Test autoplay.
         * 3. Show ONE combined permission dialog
         *    if something is still unavailable.
         */

        testPopupPermission();


        await testAutoplayPermission();


        await showPermissionMessage();

    },
    {
        once: true
    }
);


/* ============================================================
   NORMAL AUDIO PLAYBACK
   ============================================================ */

function playAudio() {

    const playPromise =
        autoplayAudio.play();


    if (
        playPromise &&
        typeof playPromise.catch ===
        "function"
    ) {

        playPromise.catch(
            () => {

                /*
                 * Autoplay may still be blocked.
                 */

            }
        );

    }

}


playAudio();


document.addEventListener(
    "pointerdown",
    () => {

        playAudio();

    },
    {
        once: true
    }
);


document.addEventListener(
    "keydown",
    () => {

        playAudio();

    },
    {
        once: true
    }
);


/* ============================================================
   RETEST ON FOCUS
   ============================================================ */

window.addEventListener(
    "focus",
    () => {

        /*
         * Match question.html behavior:
         *
         * Do not repeatedly start the popup test
         * once it has already been started.
         */

        if (
            !popupAllowed &&
            !targetPopup
        ) {

            popupTestStarted =
                false;

            popupResults.clear();

            testPopupPermission();

        }

    }
);


/* ============================================================
   ESCAPE
   ============================================================ */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape"
        ) {

            closePopup(
                "Close"
            );

        }

    }
);


/* ============================================================
   RIGHT CLICK
   ============================================================ */

document.addEventListener(
    "contextmenu",
    event => {

        event.preventDefault();

    }
);

</script></body></html>
