<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Are you an idiot?</title>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }


        body {
            background: #008080;

            overflow: hidden;

            font-family:
                "MS Sans Serif",
                "Microsoft Sans Serif",
                Tahoma,
                Arial,
                sans-serif;

            font-size: 11px;

            user-select: none;
            -webkit-user-select: none;

            display: flex;

            align-items: center;
            justify-content: center;
        }


        /* ============================================================
           WINDOWS 95 MESSAGE BOX
           ============================================================ */

        #popup-overlay {
            position: fixed;

            inset: 0;

            display: none;

            z-index: 100000;
        }


        #popup-overlay.visible {
            display: block;
        }


        #popup {
            position: fixed;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%);

            min-width: 390px;

            max-width:
                min(
                    500px,
                    calc(100vw - 30px)
                );

            background: #c0c0c0;

            border: 2px solid;

            border-color:
                #ffffff
                #000000
                #000000
                #ffffff;

            box-shadow:
                inset 1px 1px 0 #dfdfdf,
                inset -1px -1px 0 #808080;

            font-family:
                "MS Sans Serif",
                "Microsoft Sans Serif",
                Tahoma,
                Arial,
                sans-serif;
        }


        #popup-titlebar {
            height: 22px;

            display: flex;

            align-items: center;

            padding-left: 4px;
            padding-right: 2px;

            background: #000080;

            color: #ffffff;

            font-size: 13px;

            font-weight: bold;

            line-height: 18px;
        }


        #popup-title {
            flex: 1;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }


        #popup-close {
            width: 19px;
            height: 18px;

            padding: 0;

            background: #c0c0c0;

            border: 2px solid;

            border-color:
                #ffffff
                #000000
                #000000
                #ffffff;

            box-shadow:
                inset 1px 1px 0 #dfdfdf,
                inset -1px -1px 0 #808080;

            font-family:
                Arial,
                sans-serif;

            font-size: 11px;

            font-weight: bold;

            line-height: 13px;

            cursor: default;
        }


        #popup-close:active {
            border-color:
                #000000
                #ffffff
                #ffffff
                #000000;

            box-shadow:
                inset 1px 1px 0 #808080,
                inset -1px -1px 0 #dfdfdf;
        }


        #popup-content {
            min-height: 90px;

            display: flex;

            align-items: center;

            padding: 18px;
        }


        #popup-icon {
            width: 32px;
            min-width: 32px;

            height: 32px;

            margin-right: 18px;

            display: flex;

            align-items: center;
            justify-content: center;

            background: #c0c0c0;

            color: #000000;

            font-family:
                Arial,
                sans-serif;

            font-size: 26px;

            font-weight: bold;

            line-height: 32px;

            text-align: center;
        }


        #popup-message {
            flex: 1;

            font-size: 13px;

            color: #000000;

            line-height: 1.35;
        }


        #popup-buttons {
            display: flex;

            justify-content: center;

            gap: 8px;

            padding:
                0
                12px
                14px;
        }


        #popup-buttons button {
            min-width: 75px;

            height: 27px;

            padding:
                2px
                12px;

            background: #c0c0c0;

            border: 2px solid;

            border-color:
                #ffffff
                #000000
                #000000
                #ffffff;

            box-shadow:
                inset 1px 1px 0 #dfdfdf,
                inset -1px -1px 0 #808080;

            font-family:
                "MS Sans Serif",
                "Microsoft Sans Serif",
                Tahoma,
                Arial,
                sans-serif;

            font-size: 12px;

            color: #000000;

            cursor: default;
        }


        #popup-buttons button:hover {
            background: #c0c0c0;
        }


        #popup-buttons button:active {
            border-color:
                #000000
                #ffffff
                #ffffff
                #000000;

            box-shadow:
                inset 1px 1px 0 #808080,
                inset -1px -1px 0 #dfdfdf;
        }


        #popup-buttons button:focus {
            outline: 1px dotted #000000;

            outline-offset: -5px;
        }

    </style>

</head>


<body>


<!-- ============================================================
     PERMISSION MESSAGE
     ============================================================ -->

<div id="popup-overlay">

    <div id="popup">

        <div id="popup-titlebar">

            <span id="popup-title">
                YouAreAnIdiot
            </span>


            <button
                id="popup-close"
                type="button"
            >×</button>

        </div>


        <div id="popup-content">

            <div id="popup-icon">
                !
            </div>


            <div id="popup-message"></div>

        </div>


        <div id="popup-buttons"></div>

    </div>

</div>


<!-- ============================================================
     AUDIO USED FOR AUTOPLAY TEST
     ============================================================ -->

<audio
    id="autoplay-test-audio"
    preload="auto"
    loop
>

    <source
        src="/media/youare-long.mp3"
        type="audio/mpeg"
    >

</audio>


<script>

"use strict";


/* ============================================================
   CONFIGURATION
   ============================================================ */

const POPUP_TEST_COUNT = 3;

const TEST_PAGE =
    "test.html";

const TARGET_PAGE =
    "popup.html";

const DISCORD_PAGE =
    "discord.html";


const TARGET_CHECK_INTERVAL =
    250;


/* ============================================================
   ELEMENTS
   ============================================================ */

const popupOverlay =
    document.getElementById(
        "popup-overlay"
    );


const popupMessage =
    document.getElementById(
        "popup-message"
    );


const popupButtons =
    document.getElementById(
        "popup-buttons"
    );


const popupClose =
    document.getElementById(
        "popup-close"
    );


const popupIcon =
    document.getElementById(
        "popup-icon"
    );


const autoplayAudio =
    document.getElementById(
        "autoplay-test-audio"
    );


/* ============================================================
   STATE
   ============================================================ */

const popupResults =
    new Set();


let popupTestStarted =
    false;


let popupAllowed =
    false;


let autoplayTestComplete =
    false;


let autoplayAllowed =
    false;


let permissionMessageVisible =
    false;


let popupResolver =
    null;


let openingTarget =
    false;


let targetPopup =
    null;


let targetPopupFinished =
    false;


let targetPopupMonitor =
    null;


/*
 * Prevent multiple automatic attempts to open
 * popup.html at the same time.
 */

let permissionStartupComplete =
    false;


/* ============================================================
   MESSAGE BOX
   ============================================================ */

function showPopup(
    message,
    buttons = ["OK"],
    icon = "!"
) {

    popupMessage.textContent =
        message;


    popupIcon.textContent =
        icon;


    popupButtons.innerHTML =
        "";


    popupOverlay.classList.add(
        "visible"
    );


    return new Promise(
        resolve => {

            popupResolver =
                resolve;


            for (
                const text of buttons
            ) {

                const button =
                    document.createElement(
                        "button"
                    );


                button.type =
                    "button";


                button.textContent =
                    text;


                button.addEventListener(
                    "click",
                    () => {

                        closePopup(
                            text
                        );

                    }
                );


                popupButtons.appendChild(
                    button
                );

            }


            const firstButton =
                popupButtons.querySelector(
                    "button"
                );


            if (firstButton) {

                firstButton.focus();

            }

        }
    );

}


function closePopup(
    result = "Close"
) {

    popupOverlay.classList.remove(
        "visible"
    );


    if (popupResolver) {

        const resolve =
            popupResolver;

        popupResolver =
            null;

        resolve(result);

    }

}


popupClose.addEventListener(
    "click",
    () => {

        closePopup(
            "Close"
        );

    }
);


/* ============================================================
   AUTOPLAY TEST
   SAME LOGIC AS question.html
   ============================================================ */

async function testAutoplayPermission() {

    if (
        autoplayTestComplete
    ) {

        return autoplayAllowed;

    }


    autoplayTestComplete =
        true;


    try {

        autoplayAudio.pause();


        try {

            autoplayAudio.currentTime =
                0;

        } catch (_) {

            /* Ignore. */

        }


        const playPromise =
            autoplayAudio.play();


        if (
            playPromise &&
            typeof playPromise.then ===
            "function"
        ) {

            await playPromise;

        }


        await new Promise(
            resolve => {

                setTimeout(
                    resolve,
                    100
                );

            }
        );


        autoplayAllowed =
            !autoplayAudio.paused &&
            !autoplayAudio.ended;


        if (
            !autoplayAllowed
        ) {

            autoplayAudio.pause();


            try {

                autoplayAudio.currentTime =
                    0;

            } catch (_) {

                /* Ignore. */

            }

        }

    } catch (_) {

        autoplayAllowed =
            false;


        try {

            autoplayAudio.pause();

            autoplayAudio.currentTime =
                0;

        } catch (_) {

            /* Ignore. */

        }

    }


    updatePermissionMessage();


    maybeOpenQuestionPopup();


    return autoplayAllowed;

}


/* ============================================================
   USER-INTERACTION AUTOPLAY UNLOCK
   ============================================================ */

function tryUnlockAutoplay() {

    if (
        autoplayAllowed
    ) {

        return;

    }


    try {

        const playPromise =
            autoplayAudio.play();


        if (
            playPromise &&
            typeof playPromise.then ===
            "function"
        ) {

            playPromise
                .then(
                    () => {

                        autoplayAllowed =
                            !autoplayAudio.paused &&
                            !autoplayAudio.ended;


                        if (
                            autoplayAllowed
                        ) {

                            autoplayTestComplete =
                                true;

                            updatePermissionMessage();

                            maybeOpenQuestionPopup();

                        }

                    }
                )
                .catch(
                    () => {

                        autoplayAllowed =
                            false;

                        updatePermissionMessage();

                    }
                );

        } else {

            autoplayAllowed =
                !autoplayAudio.paused &&
                !autoplayAudio.ended;


            if (
                autoplayAllowed
            ) {

                autoplayTestComplete =
                    true;

                updatePermissionMessage();

                maybeOpenQuestionPopup();

            }

        }

    } catch (_) {

        autoplayAllowed =
            false;

    }

}


document.addEventListener(
    "pointerdown",
    tryUnlockAutoplay,
    {
        passive: true
    }
);


document.addEventListener(
    "keydown",
    tryUnlockAutoplay,
    {
        passive: true
    }
);


/* ============================================================
   POPUP PERMISSION TEST
   SAME LOGIC AS question.html
   ============================================================ */

function testPopupPermission() {

    if (
        popupTestStarted
    ) {

        return popupAllowed;

    }


    popupTestStarted =
        true;


    popupResults.clear();


    for (
        let i = 0;
        i < POPUP_TEST_COUNT;
        i++
    ) {

        try {

            const testPopup =
                window.open(
                    `${TEST_PAGE}?id=${i}`,
                    `youare_popup_test_${i}`,
                    [
                        "width=1",
                        "height=1",
                        "left=-10000",
                        "top=-10000"
                    ].join(",")
                );


            void testPopup;

        } catch (_) {

            /*
             * Blocked popup simply does not
             * report success.
             */

        }

    }


    /*
     * Do not immediately assume failure.
     *
     * test.html may send its result slightly later.
     */

    setTimeout(
        () => {

            updatePermissionMessage();

            maybeOpenQuestionPopup();

            if (
                !popupAllowed &&
                !permissionMessageVisible
            ) {

                showPermissionMessage();

            }

        },
        1500
    );


    return popupAllowed;

}


/* ============================================================
   POPUP TEST RESULT HANDLING
   ============================================================ */

window.addEventListener(
    "message",
    event => {

        if (
            event.origin !==
            window.location.origin
        ) {

            return;

        }


        const data =
            event.data;


        if (
            !data ||
            data.type !==
            "YOUARE_POPUP_TEST_SUCCESS"
        ) {

            return;

        }


        const id =
            String(data.id);


        if (
            ![
                "0",
                "1",
                "2"
            ].includes(id)
        ) {

            return;

        }


        popupResults.add(
            id
        );


        if (
            popupResults.size >=
            POPUP_TEST_COUNT
        ) {

            popupAllowed =
                true;

        }


        updatePermissionMessage();


        /*
         * This is important:
         *
         * Once popup permission succeeds, the
         * actual popup.html is opened when autoplay
         * is also available.
         */

        maybeOpenQuestionPopup();

    }
);


/* ============================================================
   PERMISSION MESSAGE
   ============================================================ */

function getPermissionMessage() {

    if (
        popupAllowed &&
        autoplayAllowed
    ) {

        return null;

    }


    if (
        !popupAllowed &&
        autoplayAllowed
    ) {

        return (
            "This recreation requires pop-up windows " +
            "to be enabled in your browser. Please allow " +
            "pop-ups for this site."
        );

    }


    if (
        popupAllowed &&
        !autoplayAllowed
    ) {

        return (
            "This recreation requires audio autoplay " +
            "to be enabled in your browser. Please allow " +
            "autoplay for this site."
        );

    }


    return (
        "This recreation requires pop-up windows and " +
        "audio autoplay to be enabled in your browser. " +
        "Please allow both for this site."
    );

}


function updatePermissionMessage() {

    const message =
        getPermissionMessage();


    /*
     * Both permissions succeeded.
     */

    if (
        !message
    ) {

        if (
            permissionMessageVisible &&
            popupResolver
        ) {

            closePopup(
                "Permissions complete"
            );

        }


        permissionMessageVisible =
            false;


        maybeOpenQuestionPopup();

        return;

    }


    if (
        !permissionMessageVisible
    ) {

        return;

    }


    popupMessage.textContent =
        message;

}


async function showPermissionMessage() {

    const message =
        getPermissionMessage();


    if (
        !message
    ) {

        maybeOpenQuestionPopup();

        return;

    }


    if (
        permissionMessageVisible
    ) {

        return;

    }


    permissionMessageVisible =
        true;


    await showPopup(
        message,
        ["OK"],
        "!"
    );


    permissionMessageVisible =
        false;


    /*
     * The OK interaction itself gives the browser
     * another user interaction opportunity.
     */

    tryUnlockAutoplay();


    /*
     * Retry popup permission as well.
     */

    if (
        !popupAllowed
    ) {

        popupTestStarted =
            false;

        popupResults.clear();

        testPopupPermission();

    }


    /*
     * If both permissions have already become
     * available, open popup.html immediately.
     */

    maybeOpenQuestionPopup();

}


/* ============================================================
   RESIZE REQUEST FROM popup.html
   ============================================================ */

window.addEventListener(
    "message",
    event => {

        if (
            event.origin !==
            window.location.origin
        ) {

            return;

        }


        const data =
            event.data;


        if (
            !data ||
            data.type !==
            "YOUARE_REQUEST_DISCORD_SIZE"
        ) {

            return;

        }


        /*
         * Only the actual popup.html window
         * can request the resize.
         */

        if (
            !targetPopup ||
            event.source !== targetPopup
        ) {

            return;

        }


        const width =
            Number(data.width);


        const height =
            Number(data.height);


        if (
            !Number.isFinite(width) ||
            !Number.isFinite(height) ||
            width < 1 ||
            height < 1
        ) {

            return;

        }


        const safeWidth =
            Math.round(
                Math.min(
                    width,
                    Math.max(
                        1,
                        screen.availWidth
                    )
                )
            );


        const safeHeight =
            Math.round(
                Math.min(
                    height,
                    Math.max(
                        1,
                        screen.availHeight
                    )
                )
            );


        try {

            targetPopup.resizeTo(
                safeWidth,
                safeHeight
            );

        } catch (_) {}


        try {

            targetPopup.focus();

        } catch (_) {}

    }
);


/* ============================================================
   INITIAL / FAKE WINDOW SIZE
   ============================================================ */

function getPopupFeatures() {

    const availableWidth =
        Math.max(
            320,
            screen.availWidth - 40
        );


    const availableHeight =
        Math.max(
            320,
            screen.availHeight - 40
        );


    /*
     * Fake question-window aspect ratio.
     *
     * popup.html starts at this size.
     *
     * It can later request the Discord size.
     */

    const aspectRatio =
        928 / 929;


    let width =
        Math.min(
            820,
            availableWidth
        );


    let height =
        width /
        aspectRatio;


    if (
        height >
        Math.min(
            820,
            availableHeight
        )
    ) {

        height =
            Math.min(
                820,
                availableHeight
            );


        width =
            height *
            aspectRatio;

    }


    width =
        Math.max(
            320,
            Math.floor(width)
        );


    height =
        Math.max(
            320,
            Math.floor(height)
        );


    const left =
        Math.max(
            0,
            Math.floor(
                (
                    screen.availWidth -
                    width
                ) / 2
            )
        );


    const top =
        Math.max(
            0,
            Math.floor(
                (
                    screen.availHeight -
                    height
                ) / 2
            )
        );


    return [
        `width=${width}`,
        `height=${height}`,
        `left=${left}`,
        `top=${top}`,
        "resizable=yes",
        "scrollbars=no",
        "toolbar=no",
        "menubar=no",
        "location=no",
        "status=no"
    ].join(",");

}


/* ============================================================
   REAL POPUP CLOSED HANDLER
   ============================================================ */

function handleTargetPopupClosed() {

    if (
        targetPopupFinished
    ) {

        return;

    }


    targetPopupFinished =
        true;


    if (
        targetPopupMonitor
    ) {

        clearInterval(
            targetPopupMonitor
        );

        targetPopupMonitor =
            null;

    }


    targetPopup =
        null;


    /*
     * Redirect ONLY after the real popup
     * has actually been closed.
     */

    window.location.href =
        DISCORD_PAGE;

}


/* ============================================================
   MONITOR REAL POPUP
   ============================================================ */

function monitorTargetPopup(
    popup
) {

    if (
        targetPopupMonitor
    ) {

        clearInterval(
            targetPopupMonitor
        );

    }


    targetPopupMonitor =
        setInterval(
            () => {

                try {

                    if (
                        popup.closed
                    ) {

                        handleTargetPopupClosed();

                    }

                } catch (_) {

                    /*
                     * Keep monitoring.
                     */

                }

            },
            TARGET_CHECK_INTERVAL
        );

}


/* ============================================================
   OPEN QUESTION POPUP
   ============================================================ */

function openQuestionPopup() {

    if (
        openingTarget ||
        targetPopup
    ) {

        return;

    }


    if (
        !popupAllowed ||
        !autoplayAllowed
    ) {

        return;

    }


    openingTarget =
        true;


    targetPopupFinished =
        false;


    const features =
        getPopupFeatures();


    let popup =
        null;


    try {

        popup =
            window.open(
                TARGET_PAGE,
                "YouAreAnIdiotQuestion",
                features
            );

    } catch (_) {

        popup =
            null;

    }


    /*
     * Browser blocked the actual popup.
     */

    if (
        !popup
    ) {

        openingTarget =
            false;

        popupAllowed =
            false;

        popupTestStarted =
            false;

        popupResults.clear();


        showPermissionMessage();

        return;

    }


    /*
     * Save the actual WindowProxy immediately.
     */

    targetPopup =
        popup;


    openingTarget =
        false;


    /*
     * Start monitoring immediately.
     */

    monitorTargetPopup(
        popup
    );


    try {

        popup.focus();

    } catch (_) {}

}


/* ============================================================
   OPEN ONLY WHEN BOTH CHECKS SUCCEEDED
   ============================================================ */

function maybeOpenQuestionPopup() {

    if (
        !permissionStartupComplete
    ) {

        return;

    }


    if (
        !popupAllowed ||
        !autoplayAllowed
    ) {

        return;

    }


    if (
        targetPopup ||
        openingTarget
    ) {

        return;

    }


    /*
     * Close the permission message if it is
     * still visible.
     */

    if (
        permissionMessageVisible
    ) {

        closePopup(
            "Permissions complete"
        );

        permissionMessageVisible =
            false;

    }


    openQuestionPopup();

}


/* ============================================================
   STARTUP
   ============================================================ */

window.addEventListener(
    "load",
    async () => {

        /*
         * Same order as question.html:
         *
         * 1. popup test
         * 2. autoplay test
         * 3. permission message
         */

        testPopupPermission();


        await testAutoplayPermission();


        permissionStartupComplete =
            true;


        /*
         * If both succeeded while startup was
         * running, open popup.html.
         */

        maybeOpenQuestionPopup();


        /*
         * Otherwise show the appropriate
         * combined permission message.
         */

        if (
            !popupAllowed ||
            !autoplayAllowed
        ) {

            await showPermissionMessage();

        }

    },
    {
        once: true
    }
);


/* ============================================================
   RETEST ON FOCUS
   ============================================================ */

window.addEventListener(
    "focus",
    () => {

        /*
         * Don't restart permission testing after
         * the actual popup has opened.
         */

        if (
            !targetPopup &&
            !permissionMessageVisible
        ) {

            if (
                !popupAllowed
            ) {

                popupTestStarted =
                    false;

                popupResults.clear();

                testPopupPermission();

            }


            if (
                !autoplayAllowed
            ) {

                autoplayTestComplete =
                    false;

                testAutoplayPermission();

            }

        }


        if (
            !autoplayAllowed
        ) {

            tryUnlockAutoplay();

        }


        maybeOpenQuestionPopup();

    }
);


/* ============================================================
   ESCAPE
   ============================================================ */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape"
        ) {

            closePopup(
                "Close"
            );

        }

    }
);


/* ============================================================
   RIGHT CLICK
   ============================================================ */

document.addEventListener(
    "contextmenu",
    event => {

        event.preventDefault();

    }
);

</script>

</body>

</html>
